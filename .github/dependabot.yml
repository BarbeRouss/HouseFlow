# RGPD Art. 32(1)(d) — évaluation régulière des dépendances (checklist E69).
# Les PR Dependabot suivent la checklist habituelle (tests + E2E) avant fusion.
#
# Regroupement : une PR par écosystème et par semaine pour les mises à jour mineures/correctives
# (patterns "*"). Les majeures ne sont volontairement PAS groupées : chacune reste une PR
# individuelle, relue et décidée séparément (une dépendance majeure est soumise à Julien).
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["tech-debt", "security"]
    groups:
      nuget-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/src/HouseFlow.Web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels: ["tech-debt", "security"]
    groups:
      npm-web-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/e2e"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels: ["tech-debt"]
    groups:
      npm-e2e-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels: ["infra"]
    groups:
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
