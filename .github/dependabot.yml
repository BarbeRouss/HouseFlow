# RGPD Art. 32(1)(d) — évaluation régulière des dépendances (checklist E69).
# Les PR Dependabot suivent la checklist habituelle (tests + E2E) avant fusion.
#
# Regroupement : une PR par écosystème et par semaine pour les mises à jour mineures/correctives
# (patterns "*"). Les majeures ne sont volontairement PAS groupées : chacune reste une PR
# individuelle, relue et décidée séparément (une dépendance majeure est soumise à Julien).
version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    labels: ["type:tech-debt", "security"]
    # .NET 11 étape 1 (#377) : EF Core, Npgsql et Aspire restent en 10 / 13.6.5 tant que le
    # fournisseur Npgsql EF Core 11 n'a pas de version stable. L'étape 2 (#378) retire cet `ignore`.
    # OpenIddict.EntityFrameworkCore : la 7.9.x exige EF Core 11 sous net11.0, d'où son gel en 7.8.0 jusqu'à #378.
    ignore:
      - dependency-name: "Microsoft.EntityFrameworkCore*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Microsoft.Extensions.Diagnostics.HealthChecks.EntityFrameworkCore"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Npgsql*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "Aspire*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "OpenIddict.EntityFrameworkCore"
        versions: [">= 7.9.0"]
    groups:
      nuget-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/src/HouseFlow.Web"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels: ["type:tech-debt", "security"]
    groups:
      npm-web-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "npm"
    directory: "/e2e"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels: ["type:tech-debt"]
    groups:
      npm-e2e-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels: ["infra"]
    groups:
      github-actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
