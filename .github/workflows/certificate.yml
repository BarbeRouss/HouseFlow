name: Certificate

# Certificat wildcard *.houseflow.cloud : émission Let's Encrypt (validation
# DNS-01 contre la zone OVH), copie durable dans Key Vault, puis mise à
# disposition sur le Container Apps Environment pour les bindings de domaine
# custom (deploy-preprod, deploy-prod, previews de PR).
#
# Déclencheurs :
#   - fin du workflow Infrastructure (Key Vault et environnement en place) ;
#   - le 1er de chaque mois (renouvellement si < RENEW_BEFORE_DAYS de validité) ;
#   - manuel, avec `force` pour ré-émettre quoi qu'il arrive.
#
# Idempotent : sans `force`, l'émission n'a lieu que si le certificat de Key
# Vault manque, expire bientôt, ou vient du serveur ACME de staging alors que la
# production est configurée. La mise à disposition sur l'environnement est
# refaite à CHAQUE run : c'est ce qui garantit qu'un renouvellement est pris en
# compte, sans parier sur une propagation automatique Key Vault → Container Apps.

on:
  workflow_run:
    workflows: [Infrastructure]
    types: [completed]
  schedule:
    - cron: "0 3 1 * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Ré-émettre le certificat même s'il est encore valide"
        type: boolean
        default: false

concurrency:
  group: certificate
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

env:
  DOMAIN: houseflow.cloud
  KEY_VAULT: kv-houseflow
  # Doit rester égal à local.wildcard_certificate_name (infrastructure/terraform/main/key-vault.tf).
  CERT_NAME: wildcard-houseflow-cloud
  ACME_ACCOUNT_SECRET: acme-account
  CAE_NAME: cae-houseflow
  RESOURCE_GROUP: rg-houseflow
  RENEW_BEFORE_DAYS: "30"
  # Serveur ACME. Staging tant que la chaîne complète n'est pas validée de bout
  # en bout : la production limite à 5 certificats identiques par semaine.
  # Bascule ensuite sur https://acme-v02.api.letsencrypt.org/directory
  ACME_SERVER: https://acme-staging-v02.api.letsencrypt.org/directory
  ACME_EMAIL: ${{ vars.LETSENCRYPT_EMAIL || 'admin@houseflow.cloud' }}

jobs:
  certificate:
    name: Certificat *.houseflow.cloud
    # Après Infrastructure : uniquement un run réussi sur main (un dispatch
    # d'Infrastructure depuis une branche ne doit pas émettre de certificat).
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-latest
    environment: preprod
    timeout-minutes: 30

    steps:
      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Faut-il (ré)émettre ?
        id: decide
        run: |
          set -euo pipefail
          need=false
          reason=""
          if [ "${{ inputs.force }}" = "true" ]; then
            need=true; reason="force"
          elif ! az keyvault certificate show --vault-name "$KEY_VAULT" -n "$CERT_NAME" -o none 2>/dev/null; then
            need=true; reason="aucun certificat dans Key Vault"
          else
            expires=$(az keyvault certificate show --vault-name "$KEY_VAULT" -n "$CERT_NAME" --query attributes.expires -o tsv)
            days=$(( ( $(date -d "$expires" +%s) - $(date +%s) ) / 86400 ))
            az keyvault certificate download --vault-name "$KEY_VAULT" -n "$CERT_NAME" -f current.pem -e PEM
            issuer=$(openssl x509 -in current.pem -noout -issuer)
            echo "Certificat présent : expire dans $days jours — $issuer"
            if [ "$days" -le "$RENEW_BEFORE_DAYS" ]; then
              need=true; reason="expire dans $days jours"
            elif echo "$issuer" | grep -qi staging && ! echo "$ACME_SERVER" | grep -q staging; then
              need=true; reason="certificat de staging alors que la production est configurée"
            fi
          fi
          echo "need=$need" >> "$GITHUB_OUTPUT"
          echo "Émission nécessaire : $need ${reason:+($reason)}"

      - name: Installer lego
        if: steps.decide.outputs.need == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release download --repo go-acme/lego --pattern 'lego_*_linux_amd64.tar.gz' -O lego.tar.gz
          tar -xzf lego.tar.gz lego
          ./lego --version

      - name: Restaurer le compte ACME
        if: steps.decide.outputs.need == 'true'
        run: |
          set -euo pipefail
          # Réutiliser le compte évite d'en créer un à chaque émission (Let's
          # Encrypt limite les créations par IP, et les runners partagent les leurs).
          if az keyvault secret download --vault-name "$KEY_VAULT" -n "$ACME_ACCOUNT_SECRET" -f account.tgz -e base64 2>/dev/null; then
            tar -xzf account.tgz && echo "Compte ACME restauré depuis Key Vault."
          else
            echo "Aucun compte ACME en Key Vault : lego en créera un."
          fi

      - name: Émettre le certificat (Let's Encrypt, DNS-01 OVH)
        if: steps.decide.outputs.need == 'true'
        env:
          OVH_ENDPOINT: ovh-eu
          OVH_APPLICATION_KEY: ${{ vars.OVH_APPLICATION_KEY }}
          OVH_APPLICATION_SECRET: ${{ secrets.OVH_APPLICATION_SECRET }}
          OVH_CONSUMER_KEY: ${{ secrets.OVH_CONSUMER_KEY }}
          OVH_PROPAGATION_TIMEOUT: "900"
          OVH_POLLING_INTERVAL: "15"
        run: |
          set -euo pipefail
          ./lego --accept-tos --email "$ACME_EMAIL" --server "$ACME_SERVER" \
            --dns ovh --dns.resolvers 1.1.1.1:53 \
            -d "*.$DOMAIN" -d "$DOMAIN" \
            run
          openssl x509 -in ".lego/certificates/_.$DOMAIN.crt" -noout -subject -issuer -dates

      - name: Sauvegarder le compte ACME
        if: steps.decide.outputs.need == 'true'
        run: |
          set -euo pipefail
          tar -czf account.tgz .lego/accounts
          az keyvault secret set --vault-name "$KEY_VAULT" -n "$ACME_ACCOUNT_SECRET" -f account.tgz -e base64 -o none
          rm -f account.tgz

      - name: Importer dans Key Vault
        if: steps.decide.outputs.need == 'true'
        run: |
          set -euo pipefail
          pass=$(openssl rand -base64 32)
          # Algorithmes "legacy" (3DES/SHA1) : OpenSSL 3 exporte par défaut en
          # AES-256/SHA-256, que Key Vault et Container Apps rejettent
          # ("Certificate invalid, or password is incorrect").
          openssl pkcs12 -export -out cert.pfx \
            -inkey ".lego/certificates/_.$DOMAIN.key" \
            -in ".lego/certificates/_.$DOMAIN.crt" \
            -certpbe PBE-SHA1-3DES -keypbe PBE-SHA1-3DES -macalg sha1 \
            -passout "pass:$pass"
          az keyvault certificate import --vault-name "$KEY_VAULT" -n "$CERT_NAME" -f cert.pfx --password "$pass" -o none
          rm -f cert.pfx
          echo "Certificat importé dans $KEY_VAULT/$CERT_NAME"

      - name: Mettre à disposition sur le Container Apps Environment
        run: |
          set -euo pipefail
          # Key Vault ré-exporte un PFX sans mot de passe : source unique, que le
          # certificat vienne d'être émis ou qu'il soit simplement rechargé.
          az keyvault secret download --vault-name "$KEY_VAULT" -n "$CERT_NAME" -f cae.pfx -e base64
          az extension add --name containerapp --upgrade -y -o none 2>/dev/null || true
          az containerapp env certificate upload \
            -g "$RESOURCE_GROUP" -n "$CAE_NAME" \
            --certificate-name "$CERT_NAME" --certificate-file cae.pfx \
            -o none
          rm -f cae.pfx
          az containerapp env certificate list -g "$RESOURCE_GROUP" -n "$CAE_NAME" \
            --query "[?name=='$CERT_NAME'].{name:name,subject:properties.subjectName,expires:properties.expirationDate,thumbprint:properties.thumbprint}" \
            -o table
