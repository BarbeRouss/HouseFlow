name: PR Preview Environment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    # Only deploy previews for PRs that touch application code
    paths:
      - "src/**"
      - "infrastructure/terraform/**"
      - ".github/workflows/pr-preview.yml"

# Per-PR concurrency: never cancel a running terraform apply
concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  TF_DIR: infrastructure/terraform/ephemeral
  MAX_PR_ENVS: 10
  # Le state des previews vit avec les autres states non-prod : l'environnement
  # `preview` n'a d'accès en écriture que sur ce conteneur.
  TFSTATE_CONTAINER: tfstate-nonprod
  # Le job dbtools-init du CAE preview crée / supprime houseflow_pr_<n>.
  DBTOOLS_JOB: job-dbtools-init
  DBTOOLS_RG: rg-houseflow-preview

permissions:
  id-token: write
  contents: read
  packages: write
  pull-requests: write

jobs:
  # ── Deploy preview ───────────────────────────────
  deploy-preview:
    name: Deploy Preview
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    environment: preview
    # Bind des domaines personnalisés inclus (propagation DNS + validation
    # du domaine de la Static Web App).
    timeout-minutes: 30

    steps:
      - name: Check active PR environments
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Count open PRs with the "preview" label (set after successful deploy)
          ACTIVE=$(gh pr list --repo ${{ github.repository }} --label "preview" --json number --jq length)
          echo "Active preview environments: $ACTIVE"
          if [ "$ACTIVE" -ge "$MAX_PR_ENVS" ]; then
            echo "::error::Maximum $MAX_PR_ENVS preview environments reached. Close an existing PR first."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Set image names
        id: images
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "api=ghcr.io/${OWNER}/houseflow-api" >> "$GITHUB_OUTPUT"
          echo "tag=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build & push API image
        run: |
          docker build -t "${{ steps.images.outputs.api }}:${{ steps.images.outputs.tag }}" -f src/HouseFlow.API/Dockerfile .
          docker push "${{ steps.images.outputs.api }}:${{ steps.images.outputs.tag }}"

      - name: Azure Login (OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9"

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
        run: |
          terraform init \
            -backend-config="container_name=${TFSTATE_CONTAINER}" \
            -backend-config="key=ephemeral-pr-${{ github.event.pull_request.number }}.tfstate"

      - name: Terraform Apply
        working-directory: ${{ env.TF_DIR }}
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_ghcr_pat: ${{ secrets.GHCR_PAT }}
          TF_VAR_jwt_key: ${{ secrets.JWT_KEY }}
          TF_VAR_pr_number: ${{ github.event.pull_request.number }}
          TF_VAR_image_tag: ${{ steps.images.outputs.tag }}
          # Enregistrements DNS de la preview (pr-<n>, api-pr-<n>) dans la zone OVH.
          OVH_ENDPOINT: ovh-eu
          OVH_APPLICATION_KEY: ${{ vars.OVH_APPLICATION_KEY }}
          OVH_APPLICATION_SECRET: ${{ secrets.OVH_APPLICATION_SECRET }}
          OVH_CONSUMER_KEY: ${{ secrets.OVH_CONSUMER_KEY }}
        run: terraform apply -auto-approve

      # La base de la preview est créée en SQL par le job dbtools du CAE preview :
      # le runner n'a aucun chemin réseau vers le serveur. Avant que l'API ne soit
      # sollicitée, sinon ses migrations démarrent sur une base inexistante.
      - name: Créer la base de la preview (dbtools init)
        run: |
          bash scripts/ci/run-dbtools-job.sh "$DBTOOLS_JOB" "$DBTOOLS_RG" \
            "PR_NUMBER=${{ github.event.pull_request.number }}" ACTION=create

      - name: Get preview URLs
        id: urls
        working-directory: ${{ env.TF_DIR }}
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
        run: |
          echo "api_url=$(terraform output -raw api_url)" >> "$GITHUB_OUTPUT"
          echo "frontend_url=$(terraform output -raw frontend_url)" >> "$GITHUB_OUTPUT"
          SWA_TOKEN=$(terraform output -raw swa_api_key)
          echo "::add-mask::$SWA_TOKEN"
          echo "swa_token=$SWA_TOKEN" >> "$GITHUB_OUTPUT"

      # ── Build & deploy the Blazor WASM frontend to the Static Web App ──
      # No Docker image / no compute: publish the static wwwroot (with the PR's
      # API URL baked into appsettings.json) and upload it with the SWA token.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: preview

      - name: Build Tailwind CSS
        run: |
          npm --prefix src/HouseFlow.Web ci
          npm --prefix src/HouseFlow.Web run build:css

      - name: Publish Blazor WASM (API URL + demo mode baked in)
        env:
          API_BASE_URL: ${{ steps.urls.outputs.api_url }}
          DEMO_MODE: "true"
        run: dotnet publish src/HouseFlow.Web/HouseFlow.Web.csproj -c Release -o publish

      - name: Deploy WASM to Static Web App
        env:
          SWA_TOKEN: ${{ steps.urls.outputs.swa_token }}
        run: npx --yes @azure/static-web-apps-cli deploy publish/wwwroot --deployment-token "$SWA_TOKEN" --env production

      - name: Comment PR with preview URL
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "## Preview Environment

          | Service | URL |
          |---------|-----|
          | Frontend | ${{ steps.urls.outputs.frontend_url }} |
          | API | ${{ steps.urls.outputs.api_url }} |

          **Demo account:** \`demo@demo.com\` / \`Demo@2026!\`

          _Deployed from commit ${{ github.sha }}_"

      - name: Add preview label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --add-label "preview"

  # ── Cleanup preview ──────────────────────────────
  cleanup-preview:
    name: Cleanup Preview
    if: github.event.action == 'closed'
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Azure Login (OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9"

      # Avant le destroy : l'API de la preview tient des connexions ouvertes sur
      # la base, et une fois le CAE nettoyé plus rien ne permet de la supprimer
      # (le runner n'a pas de chemin réseau vers le serveur).
      - name: Supprimer la base de la preview (dbtools init ACTION=drop)
        run: |
          bash scripts/ci/run-dbtools-job.sh "$DBTOOLS_JOB" "$DBTOOLS_RG" \
            "PR_NUMBER=${{ github.event.pull_request.number }}" ACTION=drop

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
        run: |
          terraform init \
            -backend-config="container_name=${TFSTATE_CONTAINER}" \
            -backend-config="key=ephemeral-pr-${{ github.event.pull_request.number }}.tfstate"

      - name: Terraform Destroy
        working-directory: ${{ env.TF_DIR }}
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_ghcr_pat: ${{ secrets.GHCR_PAT }}
          TF_VAR_jwt_key: ${{ secrets.JWT_KEY }}
          TF_VAR_pr_number: ${{ github.event.pull_request.number }}
          TF_VAR_image_tag: "pr-${{ github.event.pull_request.number }}"
          # Enregistrements DNS de la preview (pr-<n>, api-pr-<n>) dans la zone OVH.
          OVH_ENDPOINT: ovh-eu
          OVH_APPLICATION_KEY: ${{ vars.OVH_APPLICATION_KEY }}
          OVH_APPLICATION_SECRET: ${{ secrets.OVH_APPLICATION_SECRET }}
          OVH_CONSUMER_KEY: ${{ secrets.OVH_CONSUMER_KEY }}
        run: terraform destroy -auto-approve

      - name: Delete tfstate blob
        run: |
          az storage blob delete \
            --account-name sthouseflowtfstate \
            --container-name "$TFSTATE_CONTAINER" \
            --name "ephemeral-pr-${{ github.event.pull_request.number }}.tfstate" \
            --auth-mode login || true

      - name: Remove preview label
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --remove-label "preview" || true
