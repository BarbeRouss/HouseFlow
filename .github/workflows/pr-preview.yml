name: PR Preview Environment

# Une PR reçoit un environnement COMPLET : son resource group, son réseau, son
# serveur PostgreSQL, son Container Apps Environment. Pas un locataire d'un
# environnement partagé.
#
# C'est ce qui permet d'éprouver un changement d'infrastructure dans la PR qui
# l'introduit — une montée de version majeure de PostgreSQL, un changement de
# SKU ou de subnet s'applique ici pour de vrai, sur des ressources créées depuis
# zéro par le code de la branche. Aucun environnement partagé ne pourrait le
# faire sans être lui-même modifié, et donc sans exposer les autres.
#
# Les ~25 minutes de provisionnement se paient à l'ouverture de la PR ; les
# pushes suivants ne redéploient que les images et le frontend.

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    paths:
      - "src/**"
      - "dbtools/**"
      - "infrastructure/terraform/**"
      - ".github/workflows/pr-preview.yml"

# Par PR, sans annulation : un `terraform apply` interrompu laisse un
# environnement à moitié créé, que seul le reaper saurait ensuite ramasser.
concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: false

env:
  # Trois racines par instance, chacune avec son state (`<racine>-pr-<n>.tfstate`) :
  # environment → dns → custom-domains. Voir `environment/dns.tf`.
  TF_DIR: infrastructure/terraform
  TF_IN_AUTOMATION: "true"
  # Le storage des states de la souscription des environnements jetables : un
  # autre compte que celui de la production, dans une autre souscription.
  TFSTATE_ACCOUNT: sthouseflowtfstateeph
  # Le storage qui porte db-dumps, lui, est celui de la production : c'est là que le
  # dump nocturne est publié. L'environnement n'y lit que latest.dump, avec l'identité
  # id-houseflow-dumps-reader de la souscription jetable (Storage Blob Data Reader).
  DUMPS_ACCOUNT: sthouseflowtfstateprod
  # Chaque PR crée un serveur PostgreSQL, donc consomme du quota de vCores dans
  # la souscription des environnements jetables. C'est ce quota, et non le coût,
  # qui plafonne le nombre de previews simultanées.
  MAX_PR_ENVS: 10
  # Quatre heures glissantes : l'échéance est repoussée à chaque événement de la
  # PR, si bien qu'une PR vivante ne se fait jamais ramasser sous elle, et qu'une
  # PR oubliée s'éteint quatre heures après son dernier push. Une PR laissée
  # dormante une nuit se réveille donc sur un environnement à recréer — c'est le
  # prix assumé pour qu'un oubli ne facture jamais plus d'une demi-journée.
  TTL_HOURS: 4

permissions:
  id-token: write
  contents: read
  packages: write
  pull-requests: write

jobs:
  # ── Déploiement de la preview ────────────────────
  #
  # Un job par racine Terraform, dans l'ordre qu'impose le DNS : ses cibles sont
  # des attributs Azure (FQDN par défaut du CAE et de la Static Web App), et Azure
  # ne lie un domaine personnalisé qu'une fois le DNS résolu publiquement.
  #
  #   deploy-preview-infra  environment    Azure, données, frontend   sans verrou
  #   deploy-preview-dns    dns            écritures OVH              ovh-dns-zone
  #   deploy-preview        custom-domains liaisons Azure, fumée      sans verrou
  #
  # Seul le job du milieu écrit dans la zone OVH partagée, donc seul lui porte le
  # verrou — quelques secondes. Quand tout tenait dans un seul job, le verrou
  # couvrait ~25 minutes de provisionnement Azure, et comme un groupe de
  # concurrence GitHub ne garde qu'UN job en attente (le suivant annule le
  # précédent), les previews poussées pendant ce temps finissaient annulées
  # (#233, #235, #237 et #163 le 2026-09-23 — voir #238).
  deploy-preview-infra:
    name: Deploy Preview - Infrastructure
    # Pas de preview pour les PRs Dependabot : GitHub ne leur passe que les
    # « Dependabot secrets », sans Azure ni OVH, donc le login échouait après avoir
    # construit et poussé les images. Et une montée de version NuGet ne justifie
    # pas un environnement complet pris sur le plafond MAX_PR_ENVS. Le filtre porte
    # sur l'auteur de la PR, pas sur `github.actor` : un push humain sur la branche
    # ou un `@dependabot rebase` ne change pas la décision.
    if: github.event.action != 'closed' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 60
    outputs:
      name: ${{ steps.env.outputs.name }}
      expires_at: ${{ steps.env.outputs.expires_at }}
      api_url: ${{ steps.urls.outputs.api_url }}
      frontend_url: ${{ steps.urls.outputs.frontend_url }}

    env:
      # Posés au niveau du job et non de chaque étape : toutes les invocations de
      # `terraform` et d'`az` de ce job en ont besoin, et les recopier douze fois
      # garantissait surtout qu'un jour l'une des copies diverge.
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      # `environment` n'écrit plus dans la zone OVH, mais garde le provider le
      # temps que les states d'avant #238 détruisent leurs enregistrements (voir
      # `environment/main.tf`) : il lui faut encore ses credentials.
      OVH_ENDPOINT: ovh-eu
      OVH_APPLICATION_KEY: ${{ vars.OVH_APPLICATION_KEY }}
      OVH_APPLICATION_SECRET: ${{ secrets.OVH_APPLICATION_SECRET }}
      OVH_CONSUMER_KEY: ${{ secrets.OVH_CONSUMER_KEY }}
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}/environment
    steps:
      - name: Plafond d'environnements simultanés
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        working-directory: .
        run: |
          set -euo pipefail
          ACTIVE=$(gh pr list --repo ${{ github.repository }} --label "preview" --json number --jq length)
          echo "Environnements de preview actifs : $ACTIVE"
          if [ "$ACTIVE" -ge "$MAX_PR_ENVS" ]; then
            echo "::error::Plafond de $MAX_PR_ENVS environnements atteint — chacun consomme un serveur PostgreSQL. Fermez une PR d'abord."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Paramètres de l'instance
        id: env
        run: |
          set -euo pipefail
          N=${{ github.event.pull_request.number }}
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          {
            echo "name=pr-$N"
            echo "api_image=ghcr.io/${OWNER}/houseflow-api"
            echo "dbtools_image=ghcr.io/${OWNER}/houseflow-dbtools"
            echo "tag=pr-$N"
            echo "expires_at=$(date -u -d "+${TTL_HOURS} hours" +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Login GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire & pousser les images
        working-directory: .
        env:
          API_IMAGE: ${{ steps.env.outputs.api_image }}:${{ steps.env.outputs.tag }}
          DBTOOLS_IMAGE: ${{ steps.env.outputs.dbtools_image }}:${{ steps.env.outputs.tag }}
        run: |
          set -euo pipefail
          docker build -t "$API_IMAGE" -f src/HouseFlow.API/Dockerfile .
          docker push "$API_IMAGE"
          docker build -t "$DBTOOLS_IMAGE" dbtools
          docker push "$DBTOOLS_IMAGE"

      - name: Azure Login (OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9"

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="storage_account_name=$TFSTATE_ACCOUNT" \
            -backend-config="key=environment-${{ steps.env.outputs.name }}.tfstate"

      - name: Terraform Apply
        env:
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_key_vault_name: ${{ vars.KEY_VAULT_NAME || 'kv-houseflow' }}
          TF_VAR_entra_admin_object_id: ${{ secrets.ENTRA_ADMIN_OBJECT_ID }}
          TF_VAR_entra_admin_name: ${{ secrets.ENTRA_ADMIN_NAME }}
          TF_VAR_ghcr_pat: ${{ secrets.GHCR_PAT }}
          TF_VAR_jwt_key: ${{ secrets.JWT_KEY }}
          TF_VAR_dumps_storage_account_name: ${{ env.DUMPS_ACCOUNT }}
          NAME: ${{ steps.env.outputs.name }}
          EXPIRES_AT: ${{ steps.env.outputs.expires_at }}
          TAG: ${{ steps.env.outputs.tag }}
        run: |
          set -euo pipefail
          # La base n'est plus créée par un job dbtools en SQL : l'environnement a
          # son propre serveur, donc Terraform crée la base directement.
          terraform apply -input=false -auto-approve \
            -var-file=instances/pr.tfvars \
            -var="name=$NAME" \
            -var="frontend_host=$NAME" \
            -var="api_host=api-$NAME" \
            -var="image_tag=$TAG" \
            -var="expires_at=$EXPIRES_AT"

      # Avant la fumée : c'est sur les données de prod que la branche doit prouver qu'elle
      # démarre. Le job ne restaure qu'à la création de l'environnement (il pose un
      # marqueur dans la base) ; sur les pushes suivants il rend la main aussitôt, et les
      # données que la PR a modifiées restent en place.
      - name: Restaurer les données de prod pseudonymisées
        run: |
          set -euo pipefail
          rg=$(terraform output -raw resource_group_name)
          bash "$GITHUB_WORKSPACE/scripts/ci/run-dbtools-job.sh" \
            "$(terraform output -raw dbtools_job_name)" "$rg"

          # La base restaurée est au niveau de migration de la prod : redémarrer l'API
          # relance son init container `--migrate`, qui y applique les migrations de la
          # branche. Sans effet sur un push où rien n'a été restauré.
          app=$(terraform output -raw api_app_name)
          revision=$(az containerapp show -n "$app" -g "$rg" --query properties.latestRevisionName -o tsv)
          az containerapp revision restart -n "$app" -g "$rg" --revision "$revision" -o none
          echo "API $app redémarrée (révision $revision)."

      - name: URLs de la preview
        id: urls
        run: |
          set -euo pipefail
          echo "api_url=$(terraform output -raw api_url)" >> "$GITHUB_OUTPUT"
          echo "frontend_url=$(terraform output -raw frontend_url)" >> "$GITHUB_OUTPUT"

      # ── Frontend Blazor WebAssembly ──
      # Aucune image, aucun compute : on publie le wwwroot statique, puis on y écrit
      # la configuration de CETTE preview avant de le téléverser avec le jeton de la
      # Static Web App. Même mécanisme qu'en production (pipeline.yml) : l'URL de
      # l'API n'est pas compilée dans l'artefact, elle est posée au déploiement.
      # Rien ici n'attend le DNS : l'URL de l'API se déduit des variables, et le
      # téléversement passe par le jeton, pas par le domaine.
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: "10.0.x"
          dotnet-quality: preview

      - name: Build Tailwind CSS
        working-directory: .
        run: |
          npm --prefix src/HouseFlow.Web ci
          npm --prefix src/HouseFlow.Web run build:css

      - name: Publier le Blazor WASM
        working-directory: .
        run: dotnet publish src/HouseFlow.Web/HouseFlow.Web.csproj -c Release -o publish

      - name: Configuration d'exécution et déploiement sur la Static Web App
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/scripts/ci/write-runtime-config.sh" \
            "$GITHUB_WORKSPACE/publish/wwwroot" \
            "$(terraform output -raw api_url)" \
            "$(terraform output -raw demo_mode)"

          # Le jeton ne quitte jamais ce job : en sortie de job, il serait lisible
          # dans l'API des runs, où GitHub ne masque que les secrets déclarés.
          token=$(terraform output -raw static_web_app_api_key)
          echo "::add-mask::$token"
          npx --yes @azure/static-web-apps-cli@2 deploy "$GITHUB_WORKSPACE/publish/wwwroot" \
            --deployment-token "$token" --env production

  deploy-preview-dns:
    name: Deploy Preview - DNS OVH
    needs: deploy-preview-infra
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 10
    # Même file qu'`apply-prod-dns` (pipeline.yml) et `cleanup-preview` : chaque
    # environnement pose ses enregistrements dans la même zone, et l'API OVH refuse
    # une modification pendant qu'une autre est en cours.
    concurrency:
      group: ovh-dns-zone
      cancel-in-progress: false

    env:
      # Azure pour le backend et la lecture du state `environment`, OVH pour les
      # écritures — ces dernières jamais en variable Terraform, qui les ferait
      # fuiter dans le plan et le state.
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      OVH_ENDPOINT: ovh-eu
      OVH_APPLICATION_KEY: ${{ vars.OVH_APPLICATION_KEY }}
      OVH_APPLICATION_SECRET: ${{ secrets.OVH_APPLICATION_SECRET }}
      OVH_CONSUMER_KEY: ${{ secrets.OVH_CONSUMER_KEY }}
      TF_VAR_name: ${{ needs.deploy-preview-infra.outputs.name }}
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}/dns
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Azure Login (OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9"

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="storage_account_name=$TFSTATE_ACCOUNT" \
            -backend-config="key=dns-$TF_VAR_name.tfstate"

      - name: Terraform Apply
        env:
          TF_VAR_tfstate_storage_account_name: ${{ env.TFSTATE_ACCOUNT }}
        run: terraform apply -input=false -auto-approve

  deploy-preview:
    name: Deploy Preview
    needs: [deploy-preview-infra, deploy-preview-dns]
    runs-on: ubuntu-latest
    environment: preview
    # L'attente de propagation, puis la Static Web App qui valide le CNAME et émet
    # son certificat : quelques minutes à la création, rien sur un push ordinaire.
    timeout-minutes: 30

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      TF_VAR_name: ${{ needs.deploy-preview-infra.outputs.name }}
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}/custom-domains
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Azure Login (OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.9"

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="storage_account_name=$TFSTATE_ACCOUNT" \
            -backend-config="key=custom-domains-$TF_VAR_name.tfstate"

      - name: Terraform Apply
        env:
          TF_VAR_tfstate_storage_account_name: ${{ env.TFSTATE_ACCOUNT }}
        run: terraform apply -input=false -auto-approve

      - name: Fumée
        env:
          FRONTEND: ${{ needs.deploy-preview-infra.outputs.frontend_url }}
          API: ${{ needs.deploy-preview-infra.outputs.api_url }}
        run: |
          set -euo pipefail
          # La même garde qu'en production : servir index.html ne prouve rien sur la
          # configuration que le frontend ira lire au démarrage.
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 "$API/alive" -o /dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then echo "::error::$API/alive ne répond pas"; exit 1; fi
            sleep 10
          done

          # Juste après la liaison : la Static Web App peut encore être en train
          # d'émettre le certificat de son domaine.
          for attempt in $(seq 1 30); do
            if config=$(curl -fsS --max-time 10 "$FRONTEND/appsettings.json"); then break; fi
            if [ "$attempt" -eq 30 ]; then echo "::error::$FRONTEND/appsettings.json ne répond pas"; exit 1; fi
            sleep 10
          done
          echo "appsettings.json servi : $config"
          echo "$config" | grep -q "\"ApiBaseUrl\": \"$API\"" || {
            echo "::error::la preview ne pointe pas sur $API"
            exit 1
          }

      - name: Commenter la PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --repo ${{ github.repository }} \
            --body "## Environnement de preview

          | Service | URL |
          |---------|-----|
          | Frontend | ${{ needs.deploy-preview-infra.outputs.frontend_url }} |
          | API | ${{ needs.deploy-preview-infra.outputs.api_url }} |

          Environnement complet : son propre serveur PostgreSQL et son propre réseau.
          Données : copie pseudonymisée de la prod de la nuit, restaurée à la création de l'environnement.
          Échéance : \`${{ needs.deploy-preview-infra.outputs.expires_at }}\` (4 h) — repoussée à chaque push.

          **Compte de démonstration :** \`demo@demo.com\` / \`Demo@2026!\`

          _Déployé depuis ${{ github.sha }}_"

      - name: Poser le label preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --add-label "preview"

  # ── Destruction de la preview ────────────────────
  cleanup-preview:
    name: Cleanup Preview
    # Symétrique du déploiement : une PR Dependabot n'a jamais eu d'environnement.
    if: github.event.action == 'closed' && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: ubuntu-latest
    environment: preview
    # Dix minutes suffisent depuis que la destruction ne passe plus par
    # `terraform destroy` : `destroy-environment.sh` retire les enregistrements
    # OVH puis rend la main sur un `az group delete --no-wait`. L'ancien job
    # avait trente minutes et les a toutes dépensées, enlisé sur la suppression
    # des administrateurs Entra de PostgreSQL (voir #227).
    timeout-minutes: 10
    concurrency:
      group: ovh-dns-zone
      cancel-in-progress: false

    env:
      # Credentials OVH lus par `destroy-environment.sh` depuis l'environnement,
      # comme le provider Terraform les lisait — jamais en argument, qui les
      # exposerait dans les logs de commande.
      OVH_APPLICATION_KEY: ${{ vars.OVH_APPLICATION_KEY }}
      OVH_APPLICATION_SECRET: ${{ secrets.OVH_APPLICATION_SECRET }}
      OVH_CONSUMER_KEY: ${{ secrets.OVH_CONSUMER_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Paramètres de l'instance
        id: env
        run: echo "name=pr-${{ github.event.pull_request.number }}" >> "$GITHUB_OUTPUT"

      - name: Azure Login (OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Détruire l'environnement
        env:
          NAME: ${{ steps.env.outputs.name }}
        run: bash scripts/ci/destroy-environment.sh "rg-houseflow-$NAME"

      # Les trois states de l'instance : ce qu'ils décrivaient part avec le resource
      # group (liaisons de domaine comprises) ou vient d'être retiré de la zone OVH.
      - name: Supprimer les blobs de state
        env:
          NAME: ${{ steps.env.outputs.name }}
        run: |
          for root in environment dns custom-domains; do
            az storage blob delete \
              --account-name "$TFSTATE_ACCOUNT" \
              --container-name tfstate \
              --name "$root-$NAME.tfstate" \
              --auth-mode login || true
          done

      - name: Retirer le label preview
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh pr edit ${{ github.event.pull_request.number }} --repo ${{ github.repository }} --remove-label "preview" || true
