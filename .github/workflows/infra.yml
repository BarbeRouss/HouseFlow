name: Infrastructure

on:
  push:
    branches: [main]
    paths:
      - infrastructure/terraform/main/**
      - infrastructure/terraform/deploy-dns-ovh/**
      - infrastructure/terraform/modules/ovh-dns-zone/**
      - .github/workflows/infra.yml
  workflow_dispatch:
    inputs:
      allow_dns_destroy:
        description: "Autoriser la suppression d'enregistrements DNS (sinon refusée)"
        type: boolean
        default: false

concurrency:
  group: terraform-infra
  cancel-in-progress: false

env:
  TF_DIR: infrastructure/terraform/main
  TF_DIR_DNS_OVH: infrastructure/terraform/deploy-dns-ovh

permissions:
  id-token: write
  contents: read

jobs:
  plan:
    name: Terraform Plan
    runs-on: ubuntu-latest
    environment: preprod
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
        run: terraform init

      - name: Terraform Plan
        working-directory: ${{ env.TF_DIR }}
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_entra_admin_object_id: ${{ secrets.ENTRA_ADMIN_OBJECT_ID }}
          TF_VAR_entra_admin_name: ${{ secrets.ENTRA_ADMIN_NAME }}
          TF_VAR_bastion_ssh_public_key: ${{ secrets.BASTION_SSH_PUBLIC_KEY }}
        run: terraform plan

  apply:
    name: Apply Infrastructure
    needs: plan
    # Appliqué automatiquement à chaque push sur main touchant l'infra. Le plan
    # exact qui sera appliqué est d'abord vérifié : aucune destruction d'une
    # ressource protégée (voir l'étape Terraform Apply), sinon refus.
    # Jamais depuis une autre branche que main, même en dispatch : le state est partagé.
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-latest
    # TEMPORAIRE (lot certificats) : gate d'approbation `prod` retiré pour
    # enchaîner les applies sans clic. Remettre `environment: prod` à la fin du lot.
    environment: preprod
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR }}
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
        run: terraform init

      - name: Terraform Apply
        working-directory: ${{ env.TF_DIR }}
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_entra_admin_object_id: ${{ secrets.ENTRA_ADMIN_OBJECT_ID }}
          TF_VAR_entra_admin_name: ${{ secrets.ENTRA_ADMIN_NAME }}
          TF_VAR_bastion_ssh_public_key: ${{ secrets.BASTION_SSH_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          terraform plan -input=false -out=tfplan
          terraform show -json tfplan > plan.json
          PROTECTED='^azurerm_(container_app_environment|postgresql_flexible_server|postgresql_flexible_server_database|key_vault|virtual_network|subnet|user_assigned_identity|log_analytics_workspace)$'
          BAD=$(jq -r --arg re "$PROTECTED" '.resource_changes[]? | select(.type | test($re)) | select(.change.actions | index("delete")) | .address' plan.json)
          if [ -n "$BAD" ]; then
            echo "::error::Apply refusé : le plan détruit une ressource protégée :"
            echo "$BAD"
            exit 1
          fi
          terraform apply -input=false tfplan

  plan-dns-ovh:
    name: Terraform Plan (DNS OVH)
    # Le DNS lit le state `main` (default_domain, ID de vérification) : il passe
    # après son plan/apply — que l'apply ait tourné ou ait été sauté.
    needs: [plan, apply]
    if: always() && needs.plan.result == 'success' && contains(fromJSON('["success","skipped"]'), needs.apply.result)
    runs-on: ubuntu-latest
    environment: preprod
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR_DNS_OVH }}
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
        run: terraform init

      - name: Terraform Plan
        working-directory: ${{ env.TF_DIR_DNS_OVH }}
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
          OVH_ENDPOINT: ovh-eu
          OVH_APPLICATION_KEY: ${{ vars.OVH_APPLICATION_KEY }}
          OVH_APPLICATION_SECRET: ${{ secrets.OVH_APPLICATION_SECRET }}
          OVH_CONSUMER_KEY: ${{ secrets.OVH_CONSUMER_KEY }}
        run: terraform plan

  apply-dns-ovh:
    name: Apply DNS OVH
    needs: plan-dns-ovh
    if: github.ref == 'refs/heads/main' && (github.event_name == 'workflow_dispatch' || github.event_name == 'push')
    runs-on: ubuntu-latest
    # TEMPORAIRE (lot certificats) : idem `apply` — remettre `environment: prod`.
    environment: preprod
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - name: Terraform Init
        working-directory: ${{ env.TF_DIR_DNS_OVH }}
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
        run: terraform init

      - name: Terraform Apply
        working-directory: ${{ env.TF_DIR_DNS_OVH }}
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
          OVH_ENDPOINT: ovh-eu
          OVH_APPLICATION_KEY: ${{ vars.OVH_APPLICATION_KEY }}
          OVH_APPLICATION_SECRET: ${{ secrets.OVH_APPLICATION_SECRET }}
          OVH_CONSUMER_KEY: ${{ secrets.OVH_CONSUMER_KEY }}
          ALLOW_DNS_DESTROY: ${{ inputs.allow_dns_destroy }}
          HEAD_COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        run: |
          set -euo pipefail
          terraform plan -input=false -out=tfplan
          terraform show -json tfplan > plan.json
          # Un state `main` vide ou une sortie renommée planifierait la suppression
          # de tous les enregistrements — dont les TXT asuid.* qui portent chaque
          # domaine custom. Toute suppression doit donc être explicitement voulue :
          # marqueur [dns-allow-destroy] dans le commit, ou input du dispatch.
          DESTROYED=$(jq -r '.resource_changes[]? | select(.type == "ovh_domain_zone_record") | select(.change.actions | index("delete")) | .address' plan.json)
          ALLOW="${ALLOW_DNS_DESTROY:-false}"
          case "$HEAD_COMMIT_MESSAGE" in *"[dns-allow-destroy]"*) ALLOW=true ;; esac
          if [ -n "$DESTROYED" ] && [ "$ALLOW" != "true" ]; then
            echo "::error::Apply refusé : le plan supprime des enregistrements DNS. Marquer le commit [dns-allow-destroy] ou lancer avec allow_dns_destroy si c'est voulu :"
            echo "$DESTROYED"
            exit 1
          fi
          terraform apply -input=false tfplan
