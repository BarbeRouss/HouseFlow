name: PR Preprod Environment

# Une PR qui touche l'infrastructure ou le pipeline est déployée sur la topologie de PRODUCTION, dans la
# souscription Azure jetable : la preprod (#350). Les autres PR n'utilisent pas Azure du tout — leur
# preview fonctionnelle tourne sur le homelab (`preview.yml`, #351/#352), et c'est elle qui sert à
# valider le fonctionnel, y compris pour une PR d'infra.
#
# Une PR de preprod reçoit un environnement COMPLET : son resource group, son réseau, son serveur
# PostgreSQL, son Container Apps Environment. C'est ce qui permet d'éprouver un changement d'infra
# (version majeure de PostgreSQL, SKU, sous-réseau) dans la PR qui l'introduit, sur des ressources
# créées depuis zéro par le code de la branche, sans exposer aucun environnement partagé.
# Les ~25 minutes de provisionnement se paient à l'ouverture ; les pushes suivants ne redéploient que
# les images et le frontend.
#
#   decide                  (hébergé, sans Azure)  la PR est-elle une PR de preprod ? pourquoi ?
#   deploy-preprod-infra    environment            Azure, données, frontend      sans verrou OVH
#   deploy-preprod-dns      dns                    écritures OVH                 ovh-dns-zone
#   deploy-preprod          custom-domains         liaisons Azure, fumée, commentaire
#   cleanup-preprod         fermeture de la PR, ou preprod devenue sans objet : destruction
#
# Tout ce qui touche Azure ou OVH est derrière `decide` : une PR qui n'est pas une PR de preprod n'obtient
# que des jobs `skipped`, et aucune connexion Azure n'est ouverte.
#
# Le filet de sécurité est `reaper.yml` (tag `ttl` expiré, toutes les heures) : une preprod dont la PR
# n'a plus aucun chemin d'infra (le dernier push les a retirés), ou dont un job de nettoyage a échoué,
# disparaît au plus 4 h après son dernier déploiement.

on:
  pull_request:
    # `labeled` / `unlabeled` ne concernent que le label `preprod` : GitHub ne sait pas filtrer un
    # événement par label, c'est la condition de `decide` qui écarte les autres.
    types: [opened, synchronize, reopened, closed, labeled, unlabeled]

# Par PR, en file d'attente et sans annulation : un `terraform apply` interrompu laisse un environnement
# à moitié créé, que seul le reaper saurait ensuite ramasser. `queue: max` (comme `ovh-dns-zone`) : avec
# la file par défaut, un run en attente est ANNULÉ par le suivant — un simple label posé par ailleurs
# pendant un déploiement ferait alors sauter la destruction d'une PR qui se ferme.
concurrency:
  group: preprod-${{ github.event.pull_request.number }}
  cancel-in-progress: false
  queue: max

env:
  # Trois racines par instance, chacune avec son state (`<racine>-pr-<n>.tfstate`) :
  # environment → dns → custom-domains. Voir `environment/dns.tf`.
  TF_DIR: infrastructure/terraform
  TF_IN_AUTOMATION: "true"
  # Le storage des states de la souscription des environnements jetables : un autre compte que celui de
  # la production, dans une autre souscription.
  TFSTATE_ACCOUNT: sthouseflowtfstateeph
  # Resource group partagé de la souscription jetable — porte son nom, comme TFSTATE_ACCOUNT : la racine
  # `environment` sert aussi la production, où il s'appelle rg-houseflow-shared-prod.
  SHARED_RG: rg-houseflow-shared-ephemeral
  # Le storage qui porte db-dumps, lui, est celui de la production : c'est là que le dump nocturne est
  # publié. L'environnement n'y lit que latest.dump, avec l'identité id-houseflow-dumps-reader de la
  # souscription jetable (Storage Blob Data Reader).
  DUMPS_ACCOUNT: sthouseflowtfstateprod
  # Plafond de preprods simultanées : un Container Apps Environment et un serveur PostgreSQL chacune,
  # dans la région de la production. C'est le quota régional de la souscription jetable, et non le
  # coût, qui borne ce nombre ; deux preprods suffisent (une PR d'infra à la fois, plus une en
  # reprise). L'ancien `MAX_PR_ENVS` (10, une preview Azure par PR) n'est pas repris.
  # Quota régional réellement constaté : voir le résumé du job `Plafond d'environnements` (étape
  # « Quota régional constaté »), noté ici avec sa date quand il a été lu — 2026-11-25 : pas encore lu.
  MAX_PREPROD_ENVS: 2
  # Quatre heures glissantes : l'échéance est repoussée à chaque déploiement, si bien qu'une PR vivante
  # ne se fait jamais ramasser sous elle, et qu'une PR oubliée s'éteint quatre heures après son dernier
  # push d'infra. C'est le prix assumé pour qu'un oubli ne facture jamais plus d'une demi-journée.
  TTL_HOURS: 4

permissions:
  contents: read

jobs:
  # ── Cette PR est-elle une PR de preprod ? ────────
  decide:
    name: Décider de la preprod
    # Jamais pour un fork ni pour Dependabot : les secrets Azure/OVH n'y sont de toute façon pas
    # disponibles (et un fork n'a pas à créer de ressource payante). Même condition que `preview.yml`.
    # `labeled` / `unlabeled` : uniquement pour le label `preprod`.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
      && ((github.event.action != 'labeled' && github.event.action != 'unlabeled')
          || github.event.label.name == 'preprod')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    outputs:
      preprod: ${{ steps.decide.outputs.preprod }}
      reason: ${{ steps.decide.outputs.reason }}
    steps:
      - name: Chemins d'infra et label
        id: decide
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail

          # La liste COMPLÈTE des fichiers de la PR, pas le diff du dernier push : une PR qui a touché
          # l'infra il y a trois commits reste une PR de preprod.
          files=$(gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename')
          infra=$(grep -E '^(infrastructure/terraform/|scripts/ci/|\.github/workflows/(preprod|pipeline|reaper)\.yml$)' <<<"$files" || true)
          labels=$(gh api "repos/$REPO/issues/$PR" --jq '.labels[].name')

          preprod=false
          reason=""
          if [ -n "$infra" ]; then
            preprod=true
            count=$(wc -l <<<"$infra")
            reason="chemins d'infrastructure modifiés : $(head -n 3 <<<"$infra" | sed 's/.*/`&`/' | paste -sd ',' | sed 's/,/, /g')"
            [ "$count" -le 3 ] || reason="$reason, … ($count fichiers)"
            # Le label rend la raison visible dans la PR. Poser un label avec GITHUB_TOKEN ne relance
            # pas ce workflow. Pas sur `unlabeled` : retirer le label d'une PR qui touche l'infra ne la
            # fait pas sortir de la preprod, mais on ne le remet pas sous la main de celui qui le retire.
            if [ "$ACTION" != "unlabeled" ] && ! grep -qx 'preprod' <<<"$labels"; then
              gh api -X POST "repos/$REPO/issues/$PR/labels" -f 'labels[]=preprod' >/dev/null
            fi
          elif grep -qx 'preprod' <<<"$labels"; then
            preprod=true
            reason="label \`preprod\` posé sur la PR"
          fi

          echo "preprod=$preprod"
          echo "reason=$reason"
          {
            echo "preprod=$preprod"
            echo "reason=$reason"
          } >> "$GITHUB_OUTPUT"

  # ── Déploiement de la preprod ────────────────────
  #
  # Un job par racine Terraform, dans l'ordre qu'impose le DNS : ses cibles sont des attributs Azure
  # (FQDN par défaut du CAE et de la Static Web App), et Azure ne lie un domaine personnalisé qu'une fois
  # le DNS résolu publiquement. Seul le job du milieu écrit dans la zone OVH partagée, donc seul lui
  # porte le verrou — quelques secondes. Le groupe `ovh-dns-zone` porte `queue: max` : une vraie file,
  # sans annulation (#252).
  deploy-preprod-infra:
    name: Deploy Preprod - Infrastructure
    needs: decide
    if: needs.decide.outputs.preprod == 'true' && github.event.action != 'closed' && github.event.action != 'unlabeled'
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
      packages: write
    outputs:
      name: ${{ steps.env.outputs.name }}
      expires_at: ${{ steps.env.outputs.expires_at }}
      api_url: ${{ steps.urls.outputs.api_url }}
      frontend_url: ${{ steps.urls.outputs.frontend_url }}

    env:
      # Posés au niveau du job : toutes les invocations de `terraform` et d'`az` de ce job en ont besoin.
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      # `environment` n'écrit plus dans la zone OVH, mais garde le provider le temps que les states
      # d'avant #238 détruisent leurs enregistrements (voir `environment/main.tf`) : il lui faut encore
      # ses credentials.
      OVH_ENDPOINT: ovh-eu
      OVH_APPLICATION_KEY: ${{ vars.OVH_APPLICATION_KEY }}
      OVH_APPLICATION_SECRET: ${{ secrets.OVH_APPLICATION_SECRET }}
      OVH_CONSUMER_KEY: ${{ secrets.OVH_CONSUMER_KEY }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}/environment
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Paramètres de l'instance
        id: env
        run: |
          set -euo pipefail
          N="$PR_NUMBER"
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          {
            echo "name=pr-$N"
            echo "api_image=ghcr.io/${OWNER}/houseflow-api"
            echo "dbtools_image=ghcr.io/${OWNER}/houseflow-dbtools"
            echo "tag=pr-$N"
            echo "expires_at=$(date -u -d "+${TTL_HOURS} hours" +%Y-%m-%dT%H:%M:%SZ)"
          } >> "$GITHUB_OUTPUT"

      - name: Azure Login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Avant tout `terraform apply` (et avant de construire les images) : le plafond ne s'applique qu'à
      # la CRÉATION d'une preprod, jamais à un push sur une preprod existante.
      - name: Plafond d'environnements
        env:
          NAME: ${{ steps.env.outputs.name }}
        run: |
          set -euo pipefail
          az config set extension.use_dynamic_install=yes_without_prompt extension.dynamic_install_allow_preview=true >/dev/null

          if [ "$(az group exists --name "rg-houseflow-$NAME")" = "true" ]; then
            echo "rg-houseflow-$NAME existe déjà : mise à jour, plafond non applicable."
            exit 0
          fi

          # La région visée est celle que Terraform utilisera : `location` de la tfvars de la preprod, à
          # défaut le défaut de `variables.tf` (comme la production). Azure renvoie « West Europe » : on
          # compare sans casse ni espaces.
          location=$(sed -n 's/^location[[:space:]]*=[[:space:]]*"\(.*\)".*/\1/p' instances/preprod.tfvars | head -n 1)
          if [ -z "$location" ]; then
            location=$(awk '/^variable "location"/ {in_block=1} in_block && /default/ {gsub(/[" ]/, "", $3); print $3; exit}' variables.tf)
          fi
          [ -n "$location" ] || { echo "::error::région de la preprod introuvable (instances/preprod.tfvars, variables.tf)"; exit 1; }
          location=$(tr '[:upper:]' '[:lower:]' <<<"$location" | tr -d ' ')

          # Tous les CAE de la souscription jetable dans la région, y compris ceux en cours de suppression
          # (état `Deleting`) : ils consomment encore du quota.
          envs=$(az containerapp env list --query "[].{name:name, location:location, state:properties.provisioningState}" -o json)
          count=$(jq --arg loc "$location" '[.[] | select((.location | ascii_downcase | gsub(" "; "")) == $loc)] | length' <<<"$envs")
          echo "Container Apps Environments dans $location : $count (plafond $MAX_PREPROD_ENVS)"
          {
            echo "### Plafond d'environnements"
            echo ""
            echo "Container Apps Environments dans \`$location\` : **$count** / $MAX_PREPROD_ENVS (ceux en cours de suppression comptent)."
          } >> "$GITHUB_STEP_SUMMARY"

          if [ "$count" -ge "$MAX_PREPROD_ENVS" ]; then
            msg="plafond de $MAX_PREPROD_ENVS preprods simultanées atteint dans $location ($count Container Apps Environments, y compris ceux en cours de suppression). Fermez une PR d'infra, ou attendez la fin d'une suppression en cours, puis relancez ce job."
            echo "::error::$msg"
            { echo ""; echo "**Arrêt : $msg**"; } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      # Informatif, jamais bloquant : mesure le quota régional et la disponibilité du SKU PostgreSQL de la
      # topologie de production, pour qu'un échec de capacité soit lisible (et que le quota réel soit
      # noté en tête de ce fichier).
      - name: Quota régional constaté
        continue-on-error: true
        run: |
          set -uo pipefail
          location=$(sed -n 's/^location[[:space:]]*=[[:space:]]*"\(.*\)".*/\1/p' instances/preprod.tfvars | head -n 1)
          [ -n "$location" ] || location=$(awk '/^variable "location"/ {in_block=1} in_block && /default/ {gsub(/[" ]/, "", $3); print $3; exit}' variables.tf)
          {
            echo "### Capacité Azure constatée ($(date -u +%F)) — \`$location\`"
            echo ""
            echo "Quotas Container Apps de la souscription (\`az containerapp list-usages\`) :"
            echo '```json'
            az containerapp list-usages --location "$location" -o json 2>&1 | head -c 3000
            echo ""
            echo '```'
            echo ""
            echo "SKU PostgreSQL Flexible Server B1ms (\`az postgres flexible-server list-skus\`) :"
            echo '```json'
            az postgres flexible-server list-skus --location "$location" \
              --query "[?contains(name, 'B1ms')]" -o json 2>&1 | head -c 3000
            echo ""
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Login GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire & pousser les images
        working-directory: .
        env:
          API_IMAGE: ${{ steps.env.outputs.api_image }}:${{ steps.env.outputs.tag }}
          DBTOOLS_IMAGE: ${{ steps.env.outputs.dbtools_image }}:${{ steps.env.outputs.tag }}
        run: |
          set -euo pipefail
          docker build -t "$API_IMAGE" -f src/HouseFlow.API/Dockerfile .
          docker push "$API_IMAGE"
          docker build -t "$DBTOOLS_IMAGE" dbtools
          docker push "$DBTOOLS_IMAGE"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9"

      - name: Terraform Init
        env:
          NAME: ${{ steps.env.outputs.name }}
        run: |
          terraform init -input=false \
            -backend-config="storage_account_name=$TFSTATE_ACCOUNT" \
            -backend-config="resource_group_name=$SHARED_RG" \
            -backend-config="key=environment-$NAME.tfstate"

      - name: Terraform Apply
        env:
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_key_vault_name: ${{ vars.KEY_VAULT_NAME || 'kv-houseflow' }}
          TF_VAR_entra_admin_object_id: ${{ secrets.ENTRA_ADMIN_OBJECT_ID }}
          TF_VAR_entra_admin_name: ${{ secrets.ENTRA_ADMIN_NAME }}
          TF_VAR_ghcr_pat: ${{ secrets.GHCR_PAT }}
          TF_VAR_jwt_key: ${{ secrets.JWT_KEY }}
          TF_VAR_dumps_storage_account_name: ${{ env.DUMPS_ACCOUNT }}
          NAME: ${{ steps.env.outputs.name }}
          EXPIRES_AT: ${{ steps.env.outputs.expires_at }}
          TAG: ${{ steps.env.outputs.tag }}
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/terraform-apply.log"
          # La base n'est pas créée par un job dbtools en SQL : l'environnement a son propre serveur,
          # donc Terraform crée la base directement.
          if ! terraform apply -input=false -auto-approve \
            -var-file=instances/preprod.tfvars \
            -var="name=$NAME" \
            -var="frontend_host=$NAME" \
            -var="api_host=api-$NAME" \
            -var="image_tag=$TAG" \
            -var="expires_at=$EXPIRES_AT" 2>&1 | tee "$log"; then
            # Un refus de capacité n'est pas un bug de la PR : message dédié, et surtout PAS de repli
            # vers une autre région ou un autre SKU (la preprod éprouve la topologie de la production).
            if grep -Eq 'SkuNotAvailable|RegionalAllocationFailed|ZonalAllocationFailed|MaxNumberOfRegionalEnvironmentsInSubExceeded' "$log"; then
              msg="capacité Azure indisponible pour la preprod, relancer plus tard"
              echo "::error::$msg"
              {
                echo "### Preprod : $msg"
                echo ""
                echo "Azure a refusé la capacité demandée (topologie de production, aucun repli de région ni de SKU). Les ressources déjà créées seront reprises au prochain run, ou détruites par le reaper après l'échéance de 4 h."
                echo ""
                echo '```'
                grep -E 'SkuNotAvailable|RegionalAllocationFailed|ZonalAllocationFailed|MaxNumberOfRegionalEnvironmentsInSubExceeded' "$log" | head -n 5
                echo '```'
              } >> "$GITHUB_STEP_SUMMARY"
            fi
            exit 1
          fi

      # Avant la fumée : c'est sur les données de prod que la branche doit prouver qu'elle démarre. Le job
      # ne restaure qu'à la création de l'environnement (il pose un marqueur dans la base) ; sur les
      # pushes suivants il rend la main aussitôt, et les données que la PR a modifiées restent en place.
      - name: Restaurer les données de prod pseudonymisées
        run: |
          set -euo pipefail
          rg=$(terraform output -raw resource_group_name)
          # Les lignes du job sont recopiées dans ce log une fois l'exécution terminée.
          DBTOOLS_LOG_WORKSPACE=$(terraform output -raw log_analytics_workspace_id) \
            bash "$GITHUB_WORKSPACE/scripts/ci/run-dbtools-job.sh" \
            "$(terraform output -raw dbtools_job_name)" "$rg"

          # La base restaurée est au niveau de migration de la prod : redémarrer l'API relance son init
          # container `--migrate`, qui y applique les migrations de la branche. Sans effet sur un push où
          # rien n'a été restauré.
          app=$(terraform output -raw api_app_name)
          revision=$(az containerapp show -n "$app" -g "$rg" --query properties.latestRevisionName -o tsv)
          az containerapp revision restart -n "$app" -g "$rg" --revision "$revision" -o none
          echo "API $app redémarrée (révision $revision)."

      - name: URLs de la preprod
        id: urls
        run: |
          set -euo pipefail
          echo "api_url=$(terraform output -raw api_url)" >> "$GITHUB_OUTPUT"
          echo "frontend_url=$(terraform output -raw frontend_url)" >> "$GITHUB_OUTPUT"

      # ── Frontend Blazor WebAssembly ──
      # Aucune image, aucun compute : on publie le wwwroot statique, puis on y écrit la configuration de
      # CETTE preprod avant de le téléverser avec le jeton de la Static Web App. Même mécanisme qu'en
      # production (pipeline.yml) : l'URL de l'API n'est pas compilée dans l'artefact, elle est posée au
      # déploiement. Rien ici n'attend le DNS : l'URL de l'API se déduit des variables, et le
      # téléversement passe par le jeton, pas par le domaine.
      - name: Setup .NET
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: "11.0.x"

      - name: Publier le Blazor WASM
        working-directory: .
        run: dotnet publish src/HouseFlow.Web -c Release -o publish --nologo

      - name: Configuration d'exécution et déploiement sur la Static Web App
        run: |
          set -euo pipefail
          bash "$GITHUB_WORKSPACE/scripts/ci/write-runtime-config.sh" \
            "$GITHUB_WORKSPACE/publish/wwwroot" \
            "$(terraform output -raw api_url)" \
            "$(terraform output -raw demo_mode)"

          # Le jeton ne quitte jamais ce job : en sortie de job, il serait lisible dans l'API des runs, où
          # GitHub ne masque que les secrets déclarés.
          token=$(terraform output -raw static_web_app_api_key)
          echo "::add-mask::$token"
          npx --yes @azure/static-web-apps-cli@2 deploy "$GITHUB_WORKSPACE/publish/wwwroot" \
            --deployment-token "$token" --env production

  deploy-preprod-dns:
    name: Deploy Preprod - DNS OVH
    needs: deploy-preprod-infra
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
    # Même file qu'`apply-prod-dns` (pipeline.yml) et `cleanup-preprod` : chaque environnement pose ses
    # enregistrements dans la même zone, et l'API OVH refuse une modification pendant qu'une autre est en
    # cours. `queue: max` fait vraiment patienter les jobs suivants au lieu de les annuler (#252) —
    # incompatible avec `cancel-in-progress: true`, jamais utilisé ici.
    concurrency:
      group: ovh-dns-zone
      cancel-in-progress: false
      queue: max

    env:
      # Azure pour le backend et la lecture du state `environment`, OVH pour les écritures — ces
      # dernières jamais en variable Terraform, qui les ferait fuiter dans le plan et le state.
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      OVH_ENDPOINT: ovh-eu
      OVH_APPLICATION_KEY: ${{ vars.OVH_APPLICATION_KEY }}
      OVH_APPLICATION_SECRET: ${{ secrets.OVH_APPLICATION_SECRET }}
      OVH_CONSUMER_KEY: ${{ secrets.OVH_CONSUMER_KEY }}
      TF_VAR_name: ${{ needs.deploy-preprod-infra.outputs.name }}
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}/dns
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Azure Login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9"

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="storage_account_name=$TFSTATE_ACCOUNT" \
            -backend-config="resource_group_name=$SHARED_RG" \
            -backend-config="key=dns-$TF_VAR_name.tfstate"

      - name: Terraform Apply
        env:
          TF_VAR_tfstate_storage_account_name: ${{ env.TFSTATE_ACCOUNT }}
        run: terraform apply -input=false -auto-approve

  deploy-preprod:
    name: Deploy Preprod
    needs: [decide, deploy-preprod-infra, deploy-preprod-dns]
    runs-on: ubuntu-latest
    environment: preview
    # L'attente de propagation, puis la Static Web App qui valide le CNAME et émet son certificat :
    # quelques minutes à la création, rien sur un push ordinaire.
    timeout-minutes: 30
    permissions:
      id-token: write
      contents: read
      pull-requests: write

    env:
      ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      TF_VAR_name: ${{ needs.deploy-preprod-infra.outputs.name }}
    defaults:
      run:
        working-directory: ${{ env.TF_DIR }}/custom-domains
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Azure Login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "1.9"

      - name: Terraform Init
        run: |
          terraform init -input=false \
            -backend-config="storage_account_name=$TFSTATE_ACCOUNT" \
            -backend-config="resource_group_name=$SHARED_RG" \
            -backend-config="key=custom-domains-$TF_VAR_name.tfstate"

      - name: Terraform Apply
        env:
          TF_VAR_tfstate_storage_account_name: ${{ env.TFSTATE_ACCOUNT }}
        run: terraform apply -input=false -auto-approve

      - name: Fumée
        env:
          FRONTEND: ${{ needs.deploy-preprod-infra.outputs.frontend_url }}
          API: ${{ needs.deploy-preprod-infra.outputs.api_url }}
        run: |
          set -euo pipefail
          # La même garde qu'en production : servir index.html ne prouve rien sur la configuration que le
          # frontend ira lire au démarrage.
          for attempt in $(seq 1 30); do
            if curl -fsS --max-time 10 "$API/alive" -o /dev/null; then break; fi
            if [ "$attempt" -eq 30 ]; then echo "::error::$API/alive ne répond pas"; exit 1; fi
            sleep 10
          done

          # Juste après la liaison : la Static Web App peut encore être en train d'émettre le certificat de
          # son domaine.
          for attempt in $(seq 1 30); do
            if config=$(curl -fsS --max-time 10 "$FRONTEND/appsettings.json"); then break; fi
            if [ "$attempt" -eq 30 ]; then echo "::error::$FRONTEND/appsettings.json ne répond pas"; exit 1; fi
            sleep 10
          done
          echo "appsettings.json servi : $config"
          echo "$config" | grep -q "\"ApiBaseUrl\": \"$API\"" || {
            echo "::error::la preprod ne pointe pas sur $API"
            exit 1
          }

      # Un seul commentaire par PR, retrouvé par son marqueur et mis à jour à chaque déploiement.
      - name: Commenter la PR
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REASON: ${{ needs.decide.outputs.reason }}
          FRONTEND: ${{ needs.deploy-preprod-infra.outputs.frontend_url }}
          API: ${{ needs.deploy-preprod-infra.outputs.api_url }}
          EXPIRES_AT: ${{ needs.deploy-preprod-infra.outputs.expires_at }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          bash scripts/ci/preprod-comment.sh "$PR" <<EOF
          ## Environnement de preprod (Azure)

          | Service | URL |
          |---------|-----|
          | Frontend | $FRONTEND |
          | API | $API |

          **Pourquoi une preprod :** $REASON.

          Topologie de production dans la souscription Azure jetable (son propre serveur PostgreSQL, son propre réseau, région et SKU de la prod, sans repli). Données : copie pseudonymisée de la prod, restaurée à la création de l'environnement.
          Échéance : \`$EXPIRES_AT\` (4 h) — repoussée à chaque déploiement. Détruite à la fermeture de la PR.

          La validation **fonctionnelle** se fait sur la preview homelab (\`https://$PR.pr.houseflow.cloud\`) ; cette preprod sert à éprouver l'infrastructure.

          **Compte de démonstration :** \`demo@demo.com\` / \`Demo@2026!\`

          _Déployée depuis ${HEAD_SHA:0:7} — [run]($RUN_URL)_
          EOF

  # ── Destruction de la preprod ────────────────────
  # Deux cas : la PR se ferme (fusionnée ou non), ou son label `preprod` est retiré alors qu'aucun chemin
  # d'infra ne la justifie. Retirer le label d'une PR qui touche l'infra ne détruit rien (`decide`
  # répond alors `preprod=true`). Le cas d'un push qui retire tous les chemins d'infra d'une PR déjà
  # déployée n'est pas détecté au push (cela exigerait une connexion Azure à chaque push de PR) :
  # l'environnement expire et le reaper le détruit sous 4 h.
  cleanup-preprod:
    name: Cleanup Preprod
    needs: decide
    if: >-
      (github.event.action == 'closed' && needs.decide.outputs.preprod == 'true')
      || (github.event.action == 'unlabeled' && needs.decide.outputs.preprod == 'false')
    runs-on: ubuntu-latest
    environment: preview
    # `destroy-environment.sh` retire les enregistrements OVH puis demande la suppression du resource
    # group (`az group delete --no-wait` : la suppression ne passe plus par `terraform destroy`, enlisé
    # sur les administrateurs Entra de PostgreSQL — #227). Ce job tient le verrou `ovh-dns-zone` : il
    # reste court, l'attente de la suppression est dans `verify-cleanup`.
    timeout-minutes: 10
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    concurrency:
      group: ovh-dns-zone
      cancel-in-progress: false
      queue: max

    env:
      # Credentials OVH lus par `destroy-environment.sh` depuis l'environnement, comme le provider
      # Terraform les lisait — jamais en argument, qui les exposerait dans les logs de commande.
      OVH_APPLICATION_KEY: ${{ vars.OVH_APPLICATION_KEY }}
      OVH_APPLICATION_SECRET: ${{ secrets.OVH_APPLICATION_SECRET }}
      OVH_CONSUMER_KEY: ${{ secrets.OVH_CONSUMER_KEY }}
      PR_NUMBER: ${{ github.event.pull_request.number }}
      NAME: pr-${{ github.event.pull_request.number }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Azure Login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Détruire l'environnement
        run: bash scripts/ci/destroy-environment.sh "rg-houseflow-$NAME"

      # Les trois states de l'instance : ce qu'ils décrivaient part avec le resource group (liaisons de
      # domaine comprises) ou vient d'être retiré de la zone OVH.
      - name: Supprimer les blobs de state
        run: |
          for root in environment dns custom-domains; do
            az storage blob delete \
              --account-name "$TFSTATE_ACCOUNT" \
              --container-name tfstate \
              --name "$root-$NAME.tfstate" \
              --auth-mode login || true
          done

      - name: Commenter la PR
        env:
          GH_TOKEN: ${{ github.token }}
          ACTION: ${{ github.event.action }}
        run: |
          set -euo pipefail
          if [ "$ACTION" = "closed" ]; then
            why="la PR est fermée"
          else
            why="le label \`preprod\` a été retiré et aucun chemin d'infrastructure ne la justifie"
          fi
          bash scripts/ci/preprod-comment.sh "$PR_NUMBER" <<EOF
          ## Environnement de preprod (Azure)

          Détruit : $why. Resource group \`rg-houseflow-$NAME\`, enregistrements DNS et states Terraform supprimés.
          EOF

  # Hors du verrou OVH : attend la fin de la suppression d'Azure, puis vérifie (et supprime au besoin) le
  # resource group `ME_cae-…` du CAE. Rouge si le resource group est encore là après 30 min : le reaper
  # (tag `ttl`) reprendra.
  verify-cleanup:
    name: Verify Cleanup Preprod
    needs: cleanup-preprod
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 40
    permissions:
      id-token: write
      contents: read
    env:
      NAME: pr-${{ github.event.pull_request.number }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Azure Login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Attendre la suppression et vérifier le resource group du CAE
        run: bash scripts/ci/sweep-managed-rg.sh "$NAME" 1800
