name: One-shot cleanup of Azure PR leftovers (#353)

# TEMPORAIRE : ce fichier n'existe que dans un commit intermédiaire de la PR de #353 et disparaît
# de l'arbre final. Il liste puis supprime ce que l'ancienne preview Azure par PR a laissé :
# resource groups `rg-houseflow-pr-<n>` (sans tenir compte du TTL), enregistrements OVH
# `pr-<n>`, `api-pr-<n>`, `asuid.api-pr-<n>` et blobs de state `*-pr-<n>.tfstate`.
# Jamais la production : l'identité du GitHub Environment `preview` n'a de droits que dans la
# souscription des environnements jetables, et les filtres ci-dessous sont des motifs stricts.
# `workflow_dispatch` exige le fichier sur la branche par défaut : on déclenche donc par un push sur
# la branche de la PR, qui ne touche que ce fichier. `DRY_RUN` ci-dessous est basculé à la main.
on:
  push:
    branches: [feature/353-remove-azure-pr-preview]
    paths: [.github/workflows/oneshot-cleanup-azure-pr.yml]

permissions:
  id-token: write
  contents: read

jobs:
  cleanup:
    runs-on: ubuntu-latest
    environment: preview
    timeout-minutes: 30
    env:
      TFSTATE_ACCOUNT: sthouseflowtfstateeph
      OVH_APPLICATION_KEY: ${{ vars.OVH_APPLICATION_KEY }}
      OVH_APPLICATION_SECRET: ${{ secrets.OVH_APPLICATION_SECRET }}
      OVH_CONSUMER_KEY: ${{ secrets.OVH_CONSUMER_KEY }}
      DRY_RUN: "false"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4

      - name: Azure Login (OIDC)
        uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Resource groups, state, DNS
        run: |
          set +e
          set -uo pipefail
          echo "Souscription : $(az account show --query name -o tsv)"

          echo "── Tous les resource groups de la souscription ──"
          az group list --query "[].{name:name, state:properties.provisioningState, env:tags.environment, ttl:tags.ttl}" -o tsv

          echo "── Resource groups de PR à supprimer ──"
          mapfile -t RGS < <(az group list --query "[?starts_with(name, 'rg-houseflow-pr-')].name" -o tsv | grep -E '^rg-houseflow-pr-[0-9]+$')
          printf '  %s\n' "${RGS[@]:-(aucun)}"
          for rg in "${RGS[@]}"; do
            [ -n "$rg" ] || continue
            if [ "$DRY_RUN" = "true" ]; then
              bash scripts/ci/destroy-environment.sh "$rg" --dry-run
            else
              bash scripts/ci/destroy-environment.sh "$rg"
              echo "destroy-environment.sh $rg -> code $?"
            fi
          done

          echo "── Blobs de state de PR ──"
          for blob in $(az storage blob list --account-name "$TFSTATE_ACCOUNT" --container-name tfstate --auth-mode login --query "[].name" -o tsv | grep -E '^(environment|dns|custom-domains)-pr-[0-9]+\.tfstate$'); do
            if [ "$DRY_RUN" = "true" ]; then
              echo "  $blob (simulation)"
            elif az storage blob delete --account-name "$TFSTATE_ACCOUNT" --container-name tfstate --name "$blob" --auth-mode login -o none; then
              echo "  $blob supprimé"
            else
              echo "::error::$blob : suppression impossible (lease ?)"
            fi
          done

          echo "── Enregistrements OVH de PR ──"
          ovh_api() {
            local method=$1 path=$2 ts sig
            ts=$(date +%s)
            sig="\$1\$$(printf '%s+%s+%s+https://eu.api.ovh.com/1.0%s++%s' \
              "$OVH_APPLICATION_SECRET" "$OVH_CONSUMER_KEY" "$method" "$path" "$ts" | sha1sum | cut -d' ' -f1)"
            curl -sS -X "$method" "https://eu.api.ovh.com/1.0$path" \
              -H "X-Ovh-Application: $OVH_APPLICATION_KEY" -H "X-Ovh-Consumer: $OVH_CONSUMER_KEY" \
              -H "X-Ovh-Timestamp: $ts" -H "X-Ovh-Signature: $sig" -H "Content-Type: application/json"
          }
          deleted=0
          for id in $(ovh_api GET "/domain/zone/houseflow.cloud/record" | jq -r '.[]?'); do
            rec=$(ovh_api GET "/domain/zone/houseflow.cloud/record/$id")
            sub=$(echo "$rec" | jq -r '.subDomain // empty')
            if echo "$sub" | grep -Eq '^(asuid\.)?(api-)?pr-[0-9]+$'; then
              echo "  $id : $sub $(echo "$rec" | jq -r '.fieldType + " " + .target')"
              if [ "$DRY_RUN" != "true" ]; then
                ovh_api DELETE "/domain/zone/houseflow.cloud/record/$id" >/dev/null && deleted=$((deleted + 1))
              fi
            fi
          done
          if [ "$deleted" -gt 0 ]; then
            ovh_api POST "/domain/zone/houseflow.cloud/refresh" >/dev/null && echo "Zone rafraîchie ($deleted supprimé(s))."
          fi
          echo "Fin."
