name: Environnement à la demande

# Crée ou détruit un environnement jetable, à la main.
#
# Le chemin normal pour éprouver un changement d'infrastructure reste d'ouvrir la
# PR : `pr-preview.yml` lui donne déjà un environnement complet, avec son propre
# serveur PostgreSQL et son propre réseau. Ce workflow-ci sert à ce qui n'est pas
# encore un changement de code — essayer une version majeure de PostgreSQL avant
# d'écrire la ligne — ou à ce qui doit vivre plus longtemps qu'une PR.
#
# `preprod` est l'instance par défaut et la plus proche de la production : même
# réglage de charge, bastion, mêmes hôtes DNS durables. Un nom libre donne un
# environnement d'essai, avec ses propres hôtes dérivés du nom.
#
# Rien ici n'est permanent : tout environnement créé porte un tag `ttl` et sera
# ramassé par le reaper. La destruction explicite ci-dessous ne fait que ne pas
# attendre l'échéance.

on:
  workflow_dispatch:
    inputs:
      name:
        description: "Nom de l'instance (preprod, ou un nom libre : psql17, test-subnet…)"
        type: string
        default: preprod
      action:
        description: "Créer ou détruire"
        type: choice
        options: [create, destroy]
        default: create
      ttl_hours:
        description: "Durée de vie en heures avant ramassage par le reaper"
        type: string
        default: "12"

permissions:
  contents: read

jobs:
  environment:
    name: ${{ inputs.action }} ${{ inputs.name }}
    runs-on: ubuntu-latest
    # Même environnement GitHub que les previews : son service principal porte les
    # droits sur la souscription des environnements jetables, et aucun sur la
    # production.
    environment: preprod
    timeout-minutes: 60
    permissions:
      id-token: write
      contents: read
    # Même file que les applies du pipeline et des previews : chaque environnement
    # pose ses enregistrements dans la zone OVH, et deux applies concurrents sur
    # une même zone se marchent dessus.
    concurrency:
      group: ovh-dns-zone
      cancel-in-progress: false

    env:
      TF_VERSION: "1.9"
      TF_IN_AUTOMATION: "true"
      TF_ROOT: infrastructure/terraform/environment

    steps:
      - name: Valider le nom
        env:
          NAME: ${{ inputs.name }}
          TTL: ${{ inputs.ttl_hours }}
        run: |
          set -euo pipefail
          # Ce nom devient celui du serveur PostgreSQL, qui est un label DNS public
          # et globalement unique. La racine Terraform le revalide, mais échouer ici
          # coûte trois secondes au lieu d'un apply parti pour rien.
          if ! printf '%s' "$NAME" | grep -Eq '^[a-z0-9]([a-z0-9-]{0,18}[a-z0-9])?$'; then
            echo "::error::Nom invalide : minuscules, chiffres et tirets, 1 à 20 caractères."
            exit 1
          fi
          if [ "$NAME" = "prod" ]; then
            echo "::error::La production n'est pas un environnement jetable et ne se pilote pas ici."
            exit 1
          fi
          if ! printf '%s' "$TTL" | grep -Eq '^[0-9]+$' || [ "$TTL" -lt 1 ] || [ "$TTL" -gt 720 ]; then
            echo "::error::ttl_hours doit être un entier entre 1 et 720."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Azure Login (OIDC)
        uses: azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6 # v2.3.1
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        working-directory: ${{ env.TF_ROOT }}
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=rg-houseflow-shared" \
            -backend-config="storage_account_name=${{ secrets.TFSTATE_STORAGE_ACCOUNT }}" \
            -backend-config="container_name=tfstate" \
            -backend-config="key=environment-${{ inputs.name }}.tfstate"

      # `preprod` a son propre jeu de variables ; tout autre nom réutilise celui des
      # PR, qui décrit un environnement d'essai bon marché, et dérive ses hôtes DNS
      # du nom demandé.
      - name: Choisir le jeu de variables
        id: vars
        env:
          NAME: ${{ inputs.name }}
        run: |
          set -euo pipefail
          if [ "$NAME" = "preprod" ]; then
            echo "file=instances/preprod.tfvars" >> "$GITHUB_OUTPUT"
            echo "extra=" >> "$GITHUB_OUTPUT"
          else
            echo "file=instances/pr.tfvars" >> "$GITHUB_OUTPUT"
            echo "extra=-var=frontend_host=$NAME -var=api_host=api-$NAME" >> "$GITHUB_OUTPUT"
          fi

      - name: Apply
        if: inputs.action == 'create'
        working-directory: ${{ env.TF_ROOT }}
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
          OVH_ENDPOINT: ovh-eu
          OVH_APPLICATION_KEY: ${{ vars.OVH_APPLICATION_KEY }}
          OVH_APPLICATION_SECRET: ${{ secrets.OVH_APPLICATION_SECRET }}
          OVH_CONSUMER_KEY: ${{ secrets.OVH_CONSUMER_KEY }}
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_key_vault_uri: ${{ vars.KEY_VAULT_URI }}
          TF_VAR_entra_admin_object_id: ${{ secrets.ENTRA_ADMIN_OBJECT_ID }}
          TF_VAR_entra_admin_name: ${{ secrets.ENTRA_ADMIN_NAME }}
          TF_VAR_bastion_ssh_public_key: ${{ secrets.BASTION_SSH_PUBLIC_KEY }}
          TF_VAR_ghcr_pat: ${{ secrets.GHCR_PAT }}
          TF_VAR_jwt_key: ${{ secrets.JWT_KEY_PREPROD }}
          TF_VAR_image_tag: latest
          VARS_FILE: ${{ steps.vars.outputs.file }}
          EXTRA: ${{ steps.vars.outputs.extra }}
          NAME: ${{ inputs.name }}
          TTL: ${{ inputs.ttl_hours }}
        run: |
          set -euo pipefail
          terraform apply -input=false -auto-approve \
            -var-file="$VARS_FILE" \
            -var="name=$NAME" \
            -var="expires_at=$(date -u -d "+${TTL} hours" +%Y-%m-%dT%H:%M:%SZ)" \
            $EXTRA

      - name: Déployer le frontend
        if: inputs.action == 'create'
        working-directory: ${{ env.TF_ROOT }}
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
        run: |
          set -euo pipefail
          # Le frontend publié sur GHCR n'existe pas : Blazor WebAssembly part en
          # Static Web App. On reconstruit ici le wwwroot depuis la branche courante,
          # ce qui est justement ce qu'on veut pour un environnement d'essai.
          token=$(terraform output -raw static_web_app_api_key)
          echo "::add-mask::$token"
          cd "$GITHUB_WORKSPACE"
          dotnet publish src/HouseFlow.Web -c Release -o publish --nologo
          npx --yes @azure/static-web-apps-cli@2 deploy publish/wwwroot \
            --deployment-token "$token" --env production

      - name: Destroy
        if: inputs.action == 'destroy'
        working-directory: ${{ env.TF_ROOT }}
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
          OVH_ENDPOINT: ovh-eu
          OVH_APPLICATION_KEY: ${{ vars.OVH_APPLICATION_KEY }}
          OVH_APPLICATION_SECRET: ${{ secrets.OVH_APPLICATION_SECRET }}
          OVH_CONSUMER_KEY: ${{ secrets.OVH_CONSUMER_KEY }}
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_key_vault_uri: ${{ vars.KEY_VAULT_URI }}
          TF_VAR_entra_admin_object_id: ${{ secrets.ENTRA_ADMIN_OBJECT_ID }}
          TF_VAR_entra_admin_name: ${{ secrets.ENTRA_ADMIN_NAME }}
          TF_VAR_bastion_ssh_public_key: ${{ secrets.BASTION_SSH_PUBLIC_KEY }}
          TF_VAR_ghcr_pat: ${{ secrets.GHCR_PAT }}
          TF_VAR_jwt_key: ${{ secrets.JWT_KEY_PREPROD }}
          TF_VAR_image_tag: latest
          VARS_FILE: ${{ steps.vars.outputs.file }}
          EXTRA: ${{ steps.vars.outputs.extra }}
          NAME: ${{ inputs.name }}
          TTL: ${{ inputs.ttl_hours }}
        run: |
          set -euo pipefail
          terraform destroy -input=false -auto-approve \
            -var-file="$VARS_FILE" \
            -var="name=$NAME" \
            -var="expires_at=$(date -u -d "+${TTL} hours" +%Y-%m-%dT%H:%M:%SZ)" \
            $EXTRA

      - name: Résumé
        if: always()
        working-directory: ${{ env.TF_ROOT }}
        env:
          NAME: ${{ inputs.name }}
          ACTION: ${{ inputs.action }}
          TTL: ${{ inputs.ttl_hours }}
        run: |
          {
            echo "### Environnement \`$NAME\` — $ACTION"
            echo ""
            if [ "$ACTION" = "create" ]; then
              echo "- frontend : $(terraform output -raw frontend_url 2>/dev/null || echo '—')"
              echo "- API : $(terraform output -raw api_url 2>/dev/null || echo '—')"
              echo "- échéance : dans $TTL h, puis ramassage par le reaper"
            else
              echo "Détruit. Le blob de state \`environment-$NAME.tfstate\` subsiste et sera réutilisé si l'environnement est recréé."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
