name: PR Checks

on:
  pull_request:

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write

jobs:
  # ============================================================================
  # Backend: Build + Cache (shared by unit and integration jobs)
  # ============================================================================
  backend-build:
    name: Backend Build
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Aspire workload
        run: dotnet workload install aspire

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore dependencies
        run: dotnet restore

      - name: Restore dotnet tools
        run: dotnet tool restore

      - name: Build
        run: dotnet build --no-restore --configuration Release

      - name: Upload build artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: backend-build
          path: |
            src/*/bin/Release/
            src/*/obj/
            tests/*/bin/Release/
            tests/*/obj/
          retention-days: 1

  # ============================================================================
  # Backend: Unit Tests (parallel with integration)
  # ============================================================================
  backend-unit-tests:
    name: Backend Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [backend-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-build

      - name: Run Unit Tests
        run: dotnet test tests/HouseFlow.UnitTests/HouseFlow.UnitTests.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=unit-tests.trx" --logger "junit;LogFileName=unit-tests.xml" --results-directory tests/HouseFlow.UnitTests/TestResults

      - name: Unit Test Report
        uses: dorny/test-reporter@df6247429542221bc30d46a036ee47af1102c451 # v2
        if: always() && (success() || failure())
        with:
          name: Backend Unit Test Results
          path: 'tests/HouseFlow.UnitTests/TestResults/*.trx'
          reporter: dotnet-trx
          fail-on-error: 'false'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Test Results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-unit-test-results
          path: tests/HouseFlow.UnitTests/TestResults/
          retention-days: 7

  # ============================================================================
  # Backend: Integration Tests (parallel with unit)
  # ============================================================================
  backend-integration-tests:
    name: Backend Integration Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [backend-build]

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Aspire workload
        run: dotnet workload install aspire

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Download build artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: backend-build

      - name: Verify Docker is ready
        run: |
          docker info
          docker pull postgres:17.6

      - name: Run Integration Tests
        id: integration-tests
        continue-on-error: true
        env:
          ASPIRE_ALLOW_UNSECURED_TRANSPORT: "true"
        run: |
          set -o pipefail
          dotnet test tests/HouseFlow.IntegrationTests/HouseFlow.IntegrationTests.csproj --no-build --configuration Release --verbosity normal --logger "trx;LogFileName=integration-tests.trx" --logger "junit;LogFileName=integration-tests.xml" --logger "console;verbosity=detailed" --results-directory tests/HouseFlow.IntegrationTests/TestResults 2>&1 | tee /tmp/integration-test-output.txt

      - name: Debug Integration Test Failures
        if: steps.integration-tests.outcome == 'failure'
        run: |
          echo "## Integration Test Failures"
          echo "=== ERRORS ==="
          grep -A 5 "Error\|Exception\|FAIL\|fail:" /tmp/integration-test-output.txt | head -100 || true
          echo ""
          echo "=== LAST 50 LINES ==="
          tail -50 /tmp/integration-test-output.txt || true
          exit 1

      - name: Integration Test Report
        uses: dorny/test-reporter@df6247429542221bc30d46a036ee47af1102c451 # v2
        if: always() && (success() || failure())
        with:
          name: Backend Integration Test Results
          path: 'tests/HouseFlow.IntegrationTests/TestResults/*.trx'
          reporter: dotnet-trx
          fail-on-error: 'false'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Test Results
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: backend-integration-test-results
          path: tests/HouseFlow.IntegrationTests/TestResults/
          retention-days: 7

  # ============================================================================
  # Dependency audit (RGPD Art. 32(1)(d) — évaluation régulière ; checklist E69).
  # Échoue sur toute vulnérabilité High/Critical dans les packages DIRECTS des
  # projets déployés (API, Web, Infrastructure, Application, Core). Les vulnérabilités
  # transitives et celles des projets de tooling (AppHost, tests) sont listées dans
  # le résumé du job et suivies par Dependabot, sans bloquer la PR.
  # ============================================================================
  dependency-audit:
    name: Dependency Audit (NuGet + npm)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Aspire workload
        run: dotnet workload install aspire

      - name: Restore dependencies
        run: dotnet restore

      - name: NuGet — vulnerable packages (full report, transitive included)
        run: |
          dotnet list HouseFlow.sln package --vulnerable --include-transitive > nuget-vulnerable.txt 2>&1 || true
          {
            echo "## NuGet vulnerable packages (incl. transitive)"
            echo '```'
            cat nuget-vulnerable.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: NuGet — fail on High/Critical in direct packages of deployed projects
        run: |
          set -euo pipefail
          status=0
          for proj in src/HouseFlow.API src/HouseFlow.Web src/HouseFlow.Infrastructure src/HouseFlow.Application src/HouseFlow.Core; do
            dotnet list "$proj" package --vulnerable > "/tmp/vuln-$(basename "$proj").txt" 2>&1 || true
            if grep -qiE '\b(High|Critical)\b' "/tmp/vuln-$(basename "$proj").txt"; then
              echo "::error::High/Critical vulnerability in a direct package of $proj"
              cat "/tmp/vuln-$(basename "$proj").txt"
              status=1
            fi
          done
          exit $status

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: npm audit (frontend tooling + E2E)
        run: |
          {
            echo "## npm audit"
            echo '```'
            (cd src/HouseFlow.Web && npm ci --ignore-scripts --no-audit --no-fund >/dev/null && npm audit --audit-level=high) || echo "npm audit (web) reported findings — see above"
            (cd e2e && npm ci --ignore-scripts --no-audit --no-fund >/dev/null && npm audit --audit-level=high) || echo "npm audit (e2e) reported findings — see above"
            echo '```'
          } | tee -a "$GITHUB_STEP_SUMMARY"

  # ============================================================================
  # Web (Blazor WASM): Tailwind CSS + build
  # ============================================================================
  web-checks:
    name: Web Checks (Blazor)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: src/HouseFlow.Web/package-lock.json

      # Tailwind CSS is compiled by the BuildTailwindCss MSBuild target in
      # HouseFlow.Web.csproj as part of the build below (Node is on PATH via
      # setup-node above), so no separate npm build step is needed.
      - name: Build Blazor WASM
        run: dotnet build src/HouseFlow.Web/HouseFlow.Web.csproj -c Release

  # ============================================================================
  # Docker images: same build as deploy.yml, without the push. Catches a broken
  # Dockerfile/build context in the PR instead of on the first deploy from main
  # (issue #155: the frontend image pointed at a deleted directory for weeks).
  # ============================================================================
  docker-images:
    name: Docker Images (API + Frontend)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Build API image
        run: docker build -t api:pr -f src/HouseFlow.API/Dockerfile .

      - name: Build Frontend image (Blazor WASM + WebHost)
        run: docker build -t frontend:pr -f src/HouseFlow.WebHost/Dockerfile .

      - name: Smoke test frontend image
        run: |
          docker run -d --rm --name frontend -p 3000:3000 -e API_BASE_URL=https://api.example.test frontend:pr
          for i in $(seq 1 20); do curl -sf http://localhost:3000/ >/dev/null && break; sleep 2; done
          curl -sf http://localhost:3000/ | grep -q '<script type="importmap">{' || { echo "::error::index.html placeholders not resolved"; docker logs frontend; exit 1; }
          curl -sf http://localhost:3000/appsettings.json | grep -q '"ApiBaseUrl":"https://api.example.test"' || { echo "::error::/appsettings.json does not reflect API_BASE_URL"; exit 1; }
          docker stop frontend

  # ============================================================================
  # E2E Tests (Playwright) — API + Blazor WASM dev server as direct processes
  # (mirrors scripts/verify-e2e.sh; the WASM dev server serves _framework, which
  # the thin WebHost used by Aspire does not in a plain `dotnet run`).
  # ============================================================================
  e2e-tests:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: [backend-unit-tests, backend-integration-tests, web-checks]
    if: ${{ !cancelled() }}

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: houseflow
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Setup .NET
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Aspire workload
        run: dotnet workload install aspire

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore .NET
        run: dotnet restore

      # Tailwind CSS is compiled by the BuildTailwindCss MSBuild target in
      # HouseFlow.Web.csproj as part of the Web build below (Node is on PATH via
      # setup-node above). DEMO_MODE is set here because the Web build's
      # WriteRuntimeConfig target bakes it into wwwroot/appsettings.json, and the
      # dev server is later started with --no-build (which would not regenerate it):
      # without this the demo-login button stays hidden and its E2E test fails.
      - name: Build API + Web
        env:
          DEMO_MODE: "true"
        run: |
          dotnet build src/HouseFlow.API/HouseFlow.API.csproj -c Debug --no-restore
          dotnet build src/HouseFlow.Web/HouseFlow.Web.csproj -c Debug --no-restore

      - name: Start API (:5203)
        run: |
          ConnectionStrings__houseflow="Host=localhost;Port=5432;Database=houseflow;Username=postgres;Password=postgres" \
          ASPNETCORE_URLS="http://0.0.0.0:5203" \
          ASPNETCORE_ENVIRONMENT="CI" \
          DEMO_MODE="true" \
          Admin__BootstrapEmails__1="e2e-admin@houseflow.test" \
          dotnet run --project src/HouseFlow.API --no-build > /tmp/api.log 2>&1 &
          echo "API starting..."

      - name: Start Blazor WASM dev server (:3000)
        run: |
          DEMO_MODE="true" dotnet run --project src/HouseFlow.Web --no-build --urls http://0.0.0.0:3000 > /tmp/web.log 2>&1 &
          echo "Web starting..."

      - name: Wait for services
        run: |
          for i in $(seq 1 60); do curl -sf http://localhost:5203/swagger/index.html >/dev/null 2>&1 && break; sleep 3; done
          for i in $(seq 1 60); do curl -sf http://localhost:3000/_framework/dotnet.js >/dev/null 2>&1 && break; sleep 3; done
          if ! curl -sf http://localhost:5203/swagger/index.html >/dev/null 2>&1; then
            echo "::error::API failed to start"; tail -150 /tmp/api.log; exit 1
          fi
          if ! curl -sf http://localhost:3000/_framework/dotnet.js >/dev/null 2>&1; then
            echo "::error::Blazor frontend failed to start"; tail -150 /tmp/web.log; exit 1
          fi
          echo "API and frontend are ready."

      - name: Install Playwright (repo-root e2e/)
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: e2e
        run: CI=1 PLAYWRIGHT_JUNIT_OUTPUT_NAME=test-results/e2e-junit.xml npx playwright test --project=chromium --reporter=list,junit

      - name: E2E Test Report
        uses: dorny/test-reporter@df6247429542221bc30d46a036ee47af1102c451 # v2
        if: always() && (success() || failure())
        with:
          name: E2E Test Results (Playwright)
          path: e2e/test-results/e2e-junit.xml
          reporter: java-junit
          fail-on-error: 'false'
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Playwright report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: playwright-report
          path: e2e/playwright-report/
          retention-days: 30

      - name: Upload service logs
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: service-logs
          path: |
            /tmp/api.log
            /tmp/web.log
          retention-days: 7
