name: One-shot purge of GHCR pr-* tags (#353)

# TEMPORAIRE : n'existe que dans un commit intermédiaire de la PR de #353. Supprime les versions
# `pr-<n>` (et seulement elles : jamais une version sans tag ni un tag de production) des paquets
# `houseflow-api` et `houseflow-dbtools`, que l'ancienne preview Azure alimentait.
on:
  push:
    branches: [feature/353-remove-azure-pr-preview]
    paths: [.github/workflows/oneshot-purge-ghcr.yml]

permissions:
  contents: read
  packages: write

jobs:
  purge:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Purge
        run: |
          python3 - <<'PY'
          import json, subprocess, sys, re, datetime
          apply = True
          def gh(*a):
              return subprocess.run(["gh", *a], capture_output=True, text=True)
          prs = {}
          def state(n):
              if n not in prs:
                  r = gh("api", f"repos/BarbeRouss/HouseFlow/pulls/{n}", "--jq", ".state")
                  prs[n] = r.stdout.strip() or "unknown"
              return prs[n]
          tot = 0
          for pkg in ["houseflow-api", "houseflow-dbtools"]:
              r = gh("api", "--paginate", f"users/barberouss/packages/container/{pkg}/versions?per_page=100")
              # --paginate concatenates JSON arrays
              txt = r.stdout.replace("][", ",")
              vs = json.loads(txt)
              for v in vs:
                  v["t"] = datetime.datetime.fromisoformat(v["updated_at"].replace("Z", "+00:00")).timestamp()
                  v["tags"] = v["metadata"]["container"]["tags"]
              vs.sort(key=lambda v: v["t"])
              for v in vs:
                  tags = v["tags"]
                  if not tags or not all(re.fullmatch(r"pr-\d+", t) for t in tags):
                      continue
                  st = [state(int(t[3:])) for t in tags]
                  print(pkg, v["id"], tags, st)
                  if apply:
                      r = gh("api", "-X", "DELETE", f"users/barberouss/packages/container/{pkg}/versions/{v['id']}")
                      print("   del rc", r.returncode, r.stderr.strip()[:150])
                      tot += r.returncode == 0
          print("deleted", tot)
          PY
