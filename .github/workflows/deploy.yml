name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

# Pas de groupe de concurrence au niveau du workflow : un run en attente
# d'approbation prod occuperait le groupe, le run suivant ne démarrerait jamais
# et son job `cancel-stale-pending` (qui annule justement ce run en attente) ne
# s'exécuterait pas — interblocage constaté à trois reprises. Les applies
# Terraform restent sérialisés par les groupes des jobs deploy-preprod / deploy-prod.

env:
  REGISTRY: ghcr.io

permissions:
  id-token: write
  contents: write
  packages: write
  actions: write

jobs:
  # ── Job 0: Cancel runs waiting for prod approval ────
  cancel-stale-pending:
    name: Cancel Pending Reviews
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Cancel workflow runs waiting for approval
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea # v7
        with:
          script: |
            const { data: { workflow_runs } } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'deploy.yml',
              status: 'waiting',
            });
            for (const run of workflow_runs) {
              if (run.id === context.runId) continue;
              console.log(`Cancelling run #${run.id} (${run.display_title})`);
              await github.rest.actions.cancelWorkflowRun({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: run.id,
              });
            }

  # ── Job 1: Build & Push ──────────────────────────────
  build:
    name: Build & Push Images
    needs: cancel-stale-pending
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.version.outputs.tag }}

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          fetch-depth: 0

      - name: Set image names
        id: images
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "api=ghcr.io/${OWNER}/houseflow-api" >> "$GITHUB_OUTPUT"
          echo "web=ghcr.io/${OWNER}/houseflow-frontend" >> "$GITHUB_OUTPUT"

      - name: Reserve CalVer tag
        id: version
        run: |
          set -euo pipefail
          # Le tag est réservé AVANT de construire les images, et c'est le push
          # vers le remote qui arbitre : deux runs concurrents ne peuvent pas
          # choisir le même numéro (l'un des deux est rejeté et passe au suivant).
          git fetch --tags --quiet origin
          BASE_TAG=$(date +%Y.%m.%d)
          COUNTER=1
          TAG=$BASE_TAG
          while :; do
            if ! git tag -l "$TAG" | grep -q . && git tag "$TAG" && git push --quiet origin "$TAG" 2>/dev/null; then
              break
            fi
            git tag -d "$TAG" >/dev/null 2>&1 || true
            COUNTER=$((COUNTER + 1))
            TAG="${BASE_TAG}-${COUNTER}"
            if [ "$COUNTER" -gt 50 ]; then
              echo "::error::Impossible de réserver un tag CalVer pour $BASE_TAG"
              exit 1
            fi
          done
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Version: $TAG"

      - name: Login to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build API image
        run: docker build -t api:latest -f src/HouseFlow.API/Dockerfile .

      - name: Build Frontend image (Blazor WASM + WebHost)
        run: docker build -t frontend:latest -f src/HouseFlow.WebHost/Dockerfile .

      - name: Tag & push images
        env:
          VERSION: ${{ steps.version.outputs.tag }}
          API_IMAGE: ${{ steps.images.outputs.api }}
          WEB_IMAGE: ${{ steps.images.outputs.web }}
        run: |
          docker tag api:latest "$API_IMAGE:$VERSION"
          docker push "$API_IMAGE:$VERSION"
          docker tag api:latest "$API_IMAGE:latest"
          docker push "$API_IMAGE:latest"

          docker tag frontend:latest "$WEB_IMAGE:$VERSION"
          docker push "$WEB_IMAGE:$VERSION"
          docker tag frontend:latest "$WEB_IMAGE:latest"
          docker push "$WEB_IMAGE:latest"

  # ── Job 2: Deploy Preprod ────────────────────────────
  deploy-preprod:
    name: Deploy Preprod
    needs: build
    runs-on: ubuntu-latest
    environment: preprod
    # Large : inclut l'attente d'un éventuel run Infrastructure/Certificate du
    # même commit, qui peut rester longtemps en file d'attente GitHub.
    timeout-minutes: 180
    concurrency:
      group: terraform-deploy-preprod
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - name: Attendre le workflow Infrastructure sur ce commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/wait-infrastructure.sh

      - name: Terraform Init
        working-directory: infrastructure/terraform/deploy-preprod
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
        run: terraform init

      - name: Terraform Apply
        working-directory: infrastructure/terraform/deploy-preprod
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_ghcr_pat: ${{ secrets.GHCR_PAT }}
          TF_VAR_jwt_key: ${{ secrets.JWT_KEY }}
          TF_VAR_api_image_tag: ${{ needs.build.outputs.version }}
          TF_VAR_frontend_image_tag: ${{ needs.build.outputs.version }}
        run: |
          OUTPUT=$(terraform apply -auto-approve 2>&1) && { echo "$OUTPUT"; exit 0; } || true
          LOCK_ID=$(echo "$OUTPUT" | grep -oP 'ID:\s+\K[a-f0-9-]+' | head -1)
          if [ -n "$LOCK_ID" ]; then
            echo "State locked ($LOCK_ID) — force-unlocking..."
            terraform force-unlock -force "$LOCK_ID"
            terraform apply -auto-approve
          else
            echo "$OUTPUT"
            exit 1
          fi

      - name: Health Check
        working-directory: infrastructure/terraform/deploy-preprod
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
        run: |
          check() {
            local name=$1 url=$2
            echo "Checking $name at $url..."
            for i in $(seq 1 30); do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 "$url" 2>/dev/null || echo "000")
              if [ "$HTTP_CODE" = "200" ]; then
                echo "Preprod $name is healthy! (HTTP $HTTP_CODE)"
                return 0
              fi
              echo "Attempt $i/30 — HTTP $HTTP_CODE — waiting 10s..."
              sleep 10
            done
            echo "::warning::Preprod $name health check failed after 5 minutes"
            return 1
          }
          check "API" "$(terraform output -raw api_preprod_url)/alive"
          check "frontend" "$(terraform output -raw frontend_preprod_url)/"

  # ── Job 3: Deploy Prod (manual approval) ─────────────
  deploy-prod:
    name: Deploy Production
    needs: [build, deploy-preprod]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # TEMPORAIRE (lot certificats, #203) : gate d'approbation levée pour
    # enchaîner les déploiements prod sans clic — les secrets sont au niveau du
    # dépôt, l'environnement ne change que la protection. Remettre
    # `environment: prod` à la fin du lot.
    environment: preprod
    timeout-minutes: 180
    concurrency:
      group: terraform-deploy-prod
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9"

      - name: Attendre le workflow Infrastructure sur ce commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/ci/wait-infrastructure.sh

      - name: Terraform Init
        working-directory: infrastructure/terraform/deploy-prod
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
        run: terraform init

      - name: Terraform Apply
        working-directory: infrastructure/terraform/deploy-prod
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
          TF_VAR_subscription_id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          TF_VAR_ghcr_pat: ${{ secrets.GHCR_PAT }}
          TF_VAR_jwt_key: ${{ secrets.JWT_KEY }}
          TF_VAR_api_image_tag: ${{ needs.build.outputs.version }}
          TF_VAR_frontend_image_tag: ${{ needs.build.outputs.version }}
        run: |
          OUTPUT=$(terraform apply -auto-approve 2>&1) && { echo "$OUTPUT"; exit 0; } || true
          LOCK_ID=$(echo "$OUTPUT" | grep -oP 'ID:\s+\K[a-f0-9-]+' | head -1)
          if [ -n "$LOCK_ID" ]; then
            echo "State locked ($LOCK_ID) — force-unlocking..."
            terraform force-unlock -force "$LOCK_ID"
            terraform apply -auto-approve
          else
            echo "$OUTPUT"
            exit 1
          fi

      - name: Health Check
        working-directory: infrastructure/terraform/deploy-prod
        env:
          ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          ARM_USE_OIDC: "true"
        run: |
          check() {
            local name=$1 url=$2
            echo "Checking $name at $url..."
            for i in $(seq 1 30); do
              HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --connect-timeout 10 --max-time 30 "$url" 2>/dev/null || echo "000")
              if [ "$HTTP_CODE" = "200" ]; then
                echo "Production $name is healthy! (HTTP $HTTP_CODE)"
                return 0
              fi
              echo "Attempt $i/30 — HTTP $HTTP_CODE — waiting 10s..."
              sleep 10
            done
            echo "::error::Production $name health check failed after 5 minutes"
            return 1
          }
          check "API" "$(terraform output -raw api_prod_url)/alive"
          check "frontend" "$(terraform output -raw frontend_prod_url)/"
