name: Claude on issues

# Poser le label `claude` sur une issue démarre une session Claude Code web
# (routine « Correction issue HouseFlow », déclencheur API) avec pour consigne
# de traiter l'issue #n en suivant CLAUDE.md. Tout le processus (issue
# auto-documentée, checklist, PR, suivi CI) vit déjà dans le repo — rien à
# installer ici, la session tourne dans l'environnement cloud.
#
# Chaque déclenchement démarre une session NEUVE (pas de session reprise) :
# elle relit l'issue et ses commentaires à chaque fois, donc une réponse à une
# question de Claude fait repartir le travail de là où il s'était arrêté,
# même si techniquement c'est une nouvelle conversation.
#
# Deux déclencheurs :
#   - `issues: labeled` — premier lancement, quand le label `claude` est posé
#     à la main après relecture de l'issue (validation humaine avant de
#     lancer un agent avec droits d'écriture).
#   - `issue_comment: created` — reprise après une question ou un blocage :
#     si l'issue porte toujours le label `claude` et que le nouveau
#     commentaire n'est pas un commentaire automatisé, on redéclenche. Sans
#     cette garde, le compte-rendu de Claude re-déclencherait indéfiniment
#     puisqu'il poste sous l'identité GitHub du propriétaire de la routine,
#     indiscernable d'une réponse humaine par le seul auteur du commentaire.
#
#     Deux signaux marquent un commentaire automatisé, l'un ou l'autre suffit :
#       - `<!-- claude-routine:auto -->` — marqueur explicite, posé par ce
#         workflow et par la session sur ses propres commentaires (règle dans
#         CLAUDE.md, section Taxonomie) ;
#       - `Generated by [Claude Code]` — footer d'attribution apposé
#         systématiquement aux commentaires de l'agent. Filet de sécurité pour
#         le cas où la session oublie le marqueur : c'est exactement ce qui
#         s'est produit sur #204, où six sessions se sont enchaînées, chacune
#         relancée par le commentaire de blocage de la précédente.
#
#     Contrepartie du second signal : répondre à Claude avec « Quote reply »
#     recopie le footer dans la réponse, qui sera donc ignorée. Pour relancer
#     une session, répondre sans citer (ou reposer le label `claude`).
#
# Le payload envoyé à la routine ne contient que le numéro d'issue, jamais son
# corps ni ses commentaires — la session les relit elle-même avec `gh`.
#
# Prérequis (une seule fois), sur https://claude.ai/code/routines :
#   - la routine doit avoir BarbeRouss/HouseFlow dans ses dépôts
#   - ajouter un déclencheur « API », générer le jeton et le stocker dans le
#     secret GitHub CLAUDE_ROUTINE_TOKEN
#   - son modèle est Opus (claude-opus-5-5) ; l'escalade vers Fable est une
#     passation décrite dans CLAUDE.md (« Choix des modèles »)
#   - son prompt doit poster ses commentaires (questions, blocage,
#     compte-rendu final) préfixés par `<!-- claude-routine:auto -->`

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

concurrency:
  group: claude-issue-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  issues: write

jobs:
  fire:
    name: Démarrer une session Claude Code
    if: >-
      (github.event_name == 'issues' && github.event.label.name == 'claude') ||
      (github.event_name == 'issue_comment' &&
        github.event.issue.state == 'open' &&
        !github.event.issue.pull_request &&
        contains(github.event.issue.labels.*.name, 'claude') &&
        !contains(github.event.comment.body, '<!-- claude-routine:auto -->') &&
        !contains(github.event.comment.body, 'Generated by [Claude Code]'))
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      ROUTINE_ID: trig_017zpGmaCX8P9nKNdqqkni8h

    steps:
      - name: Fire the routine
        id: fire
        env:
          CLAUDE_ROUTINE_TOKEN: ${{ secrets.CLAUDE_ROUTINE_TOKEN }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          if [ -z "$CLAUDE_ROUTINE_TOKEN" ]; then
            echo "::error::Secret CLAUDE_ROUTINE_TOKEN manquant — jeton API de la routine, à générer sur https://claude.ai/code/routines"
            exit 1
          fi
          if ! response=$(curl -sS --fail-with-body -X POST \
              "https://api.anthropic.com/v1/claude_code/routines/${ROUTINE_ID}/fire" \
              -H "Authorization: Bearer ${CLAUDE_ROUTINE_TOKEN}" \
              -H "anthropic-beta: experimental-cc-routine-2026-04-01" \
              -H "anthropic-version: 2023-06-01" \
              -H "Content-Type: application/json" \
              -d "{\"text\": \"issue=${ISSUE_NUMBER}\"}"); then
            echo "::error::Échec du déclenchement de la routine"
            echo "$response"
            exit 1
          fi
          echo "$response"
          echo "session_url=$(echo "$response" | jq -r '.claude_code_session_url // empty')" >> "$GITHUB_OUTPUT"

      - name: Comment the session link on the issue
        if: steps.fire.outputs.session_url != ''
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          SESSION_URL: ${{ steps.fire.outputs.session_url }}
        run: |
          gh issue comment "$ISSUE_NUMBER" --repo "$GITHUB_REPOSITORY" \
            --body "<!-- claude-routine:auto -->
          🤖 Session Claude Code démarrée pour cette issue : $SESSION_URL"
