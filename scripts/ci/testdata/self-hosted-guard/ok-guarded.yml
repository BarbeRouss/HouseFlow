# Conforme : pull_request, condition de même dépôt sur le job auto-hébergé.
name: ok-guarded
on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  workflow_dispatch:
jobs:
  deploy:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository
      && github.event.pull_request.user.login != 'dependabot[bot]'
    runs-on: houseflow-preview
    steps:
      - run: echo ok
