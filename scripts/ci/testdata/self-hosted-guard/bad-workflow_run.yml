# Fautif : déclencheur workflow_run sur un workflow qui contient un job auto-hébergé, même gardé.
name: bad-workflow_run
on:
  workflow_run:
    types: [opened]
jobs:
  deploy:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: houseflow-preview
    steps:
      - run: echo pwned
