openapi: 3.0.3
info:
  title: HouseFlow API
  description: |
    API pour l'application HouseFlow - Suivi d'entretien de maison.

    ## MVP Features
    - Authentification (inscription, connexion, déconnexion)
    - Gestion des maisons (CRUD)
    - Gestion des appareils (CRUD)
    - Gestion des types d'entretien (CRUD)
    - Logging des entretiens effectués
    - Calcul des scores de progression
  version: 1.0.0
  contact:
    name: HouseFlow Team

servers:
  - url: http://localhost:5203/api/v1
    description: Local Development Server
  - url: https://api.houseflow.app/v1
    description: Production Server

tags:
  - name: Auth
    description: Authentification et gestion de compte
  - name: Houses
    description: Gestion des maisons
  - name: Devices
    description: Gestion des appareils
  - name: MaintenanceTypes
    description: Définition des types d'entretien récurrents
  - name: MaintenanceInstances
    description: Historique des entretiens effectués
  - name: ApiKeys
    description: Gestion des clés API pour intégration externe
  - name: Admin
    description: Administration de la plateforme (réservée aux administrateurs)

paths:
  # ============================================================================
  # AUTHENTICATION (US-001 (#165), US-002 (#166), US-003 (#167))
  # ============================================================================
  /auth/register:
    post:
      operationId: register
      summary: Inscription d'un nouvel utilisateur
      description: |
        Crée un compte utilisateur et une première maison "Ma maison" automatiquement.
        Retourne un token JWT pour authentification immédiate.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              firstName: "Jean"
              lastName: "Dupont"
              email: "jean.dupont@example.com"
              password: "MonMotDePasse123!"
      responses:
        '201':
          description: Inscription réussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Données invalides
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email déjà utilisé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/login:
    post:
      operationId: login
      summary: Connexion
      description: Authentifie un utilisateur et retourne un token JWT.
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: "jean.dupont@example.com"
              password: "MonMotDePasse123!"
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Identifiants incorrects
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/refresh:
    post:
      operationId: refreshToken
      summary: Rafraîchir le token
      description: >-
        Échange le refresh token (cookie HttpOnly `refreshToken`) contre un nouveau
        access token. Le refresh token est tourné à chaque appel ; présenter un token
        déjà tourné (hors fenêtre de grâce de 30 s) révoque toute la famille de tokens
        issue du même login (détection de vol).
      tags: [Auth]
      responses:
        '200':
          description: Token rafraîchi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Refresh token absent, invalide, expiré ou réutilisé

  /auth/logout:
    post:
      operationId: logout
      summary: Déconnexion
      description: Révoque le refresh token actuel.
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Déconnexion réussie

  # ============================================================================
  # HOUSES (US-010 (#168), US-011 (#169), US-012 (#170), US-020 (#171), US-023 (#174), US-024 (#175))
  # ============================================================================
  /houses:
    get:
      operationId: getHouses
      summary: Liste des maisons
      description: |
        Retourne toutes les maisons de l'utilisateur avec leur score de progression.
        Utilisé pour le dashboard principal.
      tags: [Houses]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Liste des maisons avec scores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HousesListResponse'

    post:
      operationId: createHouse
      summary: Créer une maison
      description: Crée une nouvelle maison pour l'utilisateur connecté.
      tags: [Houses]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHouseRequest'
            example:
              name: "Maison de campagne"
              address: "123 Rue des Champs"
              zipCode: "75001"
              city: "Paris"
      responses:
        '201':
          description: Maison créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/House'
        '400':
          description: Données invalides

  /houses/{houseId}:
    parameters:
      - $ref: '#/components/parameters/houseId'

    get:
      operationId: getHouse
      summary: Détail d'une maison
      description: |
        Retourne les détails d'une maison avec la liste de ses appareils et leurs scores.
      tags: [Houses]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Détail de la maison
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseDetail'
        '404':
          description: Maison non trouvée

    put:
      operationId: updateHouse
      summary: Modifier une maison
      description: Met à jour les informations d'une maison.
      tags: [Houses]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHouseRequest'
      responses:
        '200':
          description: Maison modifiée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/House'
        '404':
          description: Maison non trouvée

    delete:
      operationId: deleteHouse
      summary: Supprimer une maison
      description: |
        Supprime une maison et tous ses appareils/entretiens (cascade).
      tags: [Houses]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Maison supprimée
        '404':
          description: Maison non trouvée

  # ============================================================================
  # DEVICES (US-021 (#172), US-022 (#173), US-030 (#176), US-035 (#181), US-036 (#182))
  # ============================================================================
  /houses/{houseId}/devices:
    parameters:
      - $ref: '#/components/parameters/houseId'

    get:
      operationId: getDevices
      summary: Liste des appareils d'une maison
      description: Retourne tous les appareils d'une maison avec leur statut.
      tags: [Devices]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Liste des appareils
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceSummary'

    post:
      operationId: createDevice
      summary: Ajouter un appareil
      description: Ajoute un nouvel appareil à une maison.
      tags: [Devices]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeviceRequest'
            example:
              name: "Chaudière gaz"
              type: "heating"
              brand: "Viessmann"
              model: "Vitodens 200"
              installDate: "2019-03-15"
      responses:
        '201':
          description: Appareil créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          description: Données invalides

  /devices/{deviceId}:
    parameters:
      - $ref: '#/components/parameters/deviceId'

    get:
      operationId: getDevice
      summary: Détail d'un appareil
      description: |
        Retourne les détails d'un appareil avec ses types d'entretien et leur statut.
      tags: [Devices]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Détail de l'appareil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDetail'
        '404':
          description: Appareil non trouvé

    put:
      operationId: updateDevice
      summary: Modifier un appareil
      description: Met à jour les informations d'un appareil.
      tags: [Devices]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeviceRequest'
      responses:
        '200':
          description: Appareil modifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '404':
          description: Appareil non trouvé

    delete:
      operationId: deleteDevice
      summary: Supprimer un appareil
      description: |
        Supprime un appareil et tous ses entretiens (cascade).
      tags: [Devices]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Appareil supprimé
        '404':
          description: Appareil non trouvé

  # ============================================================================
  # MAINTENANCE TYPES (US-031 (#177), US-032 (#178))
  # ============================================================================
  /devices/{deviceId}/maintenance-types:
    parameters:
      - $ref: '#/components/parameters/deviceId'

    get:
      operationId: getMaintenanceTypes
      summary: Liste des types d'entretien
      description: Retourne les types d'entretien définis pour un appareil.
      tags: [MaintenanceTypes]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Liste des types d'entretien
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MaintenanceTypeWithStatus'

    post:
      operationId: createMaintenanceType
      summary: Ajouter un type d'entretien
      description: Définit un nouveau type d'entretien récurrent pour un appareil.
      tags: [MaintenanceTypes]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMaintenanceTypeRequest'
            example:
              name: "Entretien annuel"
              periodicity: "annual"
      responses:
        '201':
          description: Type d'entretien créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceType'
        '400':
          description: Données invalides

  /maintenance-types/{typeId}:
    parameters:
      - $ref: '#/components/parameters/typeId'

    put:
      operationId: updateMaintenanceType
      summary: Modifier un type d'entretien
      tags: [MaintenanceTypes]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMaintenanceTypeRequest'
      responses:
        '200':
          description: Type modifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceType'
        '404':
          description: Type non trouvé

    delete:
      operationId: deleteMaintenanceType
      summary: Supprimer un type d'entretien
      description: Supprime un type et son historique (cascade).
      tags: [MaintenanceTypes]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Type supprimé
        '404':
          description: Type non trouvé

  # ============================================================================
  # MAINTENANCE INSTANCES (US-033 (#179), US-034 (#180))
  # ============================================================================
  /maintenance-types/{typeId}/instances:
    parameters:
      - $ref: '#/components/parameters/typeId'

    post:
      operationId: logMaintenance
      summary: Logger un entretien
      description: |
        Enregistre qu'un entretien a été effectué.
        Met automatiquement à jour le statut du type et calcule la prochaine échéance.
      tags: [MaintenanceInstances]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogMaintenanceRequest'
            example:
              date: "2024-10-12"
              cost: 95.00
              provider: "Ramoneur Express"
              notes: "RAS, conduit en bon état"
      responses:
        '201':
          description: Entretien loggé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceInstance'
        '400':
          description: Données invalides

  # ============================================================================
  # UPCOMING TASKS
  # ============================================================================
  /upcoming-tasks:
    get:
      operationId: getUpcomingTasks
      summary: Liste des tâches d'entretien à venir
      description: |
        Retourne toutes les tâches d'entretien en attente ou en retard
        pour l'ensemble des maisons et appareils de l'utilisateur.
        Triées par urgence: tâches jamais effectuées en premier, puis en retard, puis en attente.
      tags: [MaintenanceTypes]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Nombre maximum de tâches à retourner
          required: false
          schema:
            type: integer
            minimum: 1
            example: 5
      responses:
        '200':
          description: Liste des tâches à venir
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpcomingTasksResponse'

  /devices/{deviceId}/maintenance-history:
    parameters:
      - $ref: '#/components/parameters/deviceId'

    get:
      operationId: getMaintenanceHistory
      summary: Historique des entretiens
      description: |
        Retourne l'historique de tous les entretiens d'un appareil,
        triés par date décroissante (plus récent en premier).
      tags: [MaintenanceInstances]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Historique des entretiens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceHistoryResponse'

  # ============================================================================
  # API KEYS (US-300 (#188), US-301 (#189), US-302 (#190))
  # ============================================================================
  /users/api-keys:
    post:
      operationId: createApiKey
      summary: Créer une clé API
      description: |
        Génère une nouvelle clé API pour l'utilisateur.
        La clé complète n'est retournée qu'une seule fois dans la réponse.
        Maximum 5 clés actives par utilisateur.
      tags: [ApiKeys]
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '201':
          description: Clé API créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateApiKeyResponse'
        '400':
          description: Données invalides ou limite de clés atteinte
        '401':
          description: Non authentifié
    get:
      operationId: listApiKeys
      summary: Lister les clés API
      description: Retourne la liste des clés API actives de l'utilisateur (sans la clé complète).
      tags: [ApiKeys]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Liste des clés API
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKeyDto'
        '401':
          description: Non authentifié

  /users/api-keys/{id}:
    delete:
      operationId: revokeApiKey
      summary: Révoquer une clé API
      description: Révoque définitivement une clé API. Les requêtes utilisant cette clé recevront une erreur 401.
      tags: [ApiKeys]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Clé révoquée
        '401':
          description: Non authentifié
        '404':
          description: Clé non trouvée

  # ============================================================================
  # ADMIN (US-400 (#191))
  # ============================================================================
  /admin/stats:
    get:
      operationId: getAdminStats
      summary: Statistiques globales de la plateforme
      description: Compteurs globaux (utilisateurs, administrateurs, maisons, appareils, entretiens). Réservé aux administrateurs.
      tags: [Admin]
      security:
        - BearerAuth: []
      responses:
        '200':
          description: Statistiques
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStats'
        '401':
          description: Non authentifié
        '403':
          description: Non administrateur

  /admin/users:
    get:
      operationId: listAdminUsers
      summary: Lister les utilisateurs
      description: Liste paginée de tous les comptes, avec recherche par email / prénom / nom. Réservé aux administrateurs.
      tags: [Admin]
      security:
        - BearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Filtre (sous-chaîne, insensible à la casse) sur l'email, le prénom ou le nom
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Page d'utilisateurs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUsersPage'
        '401':
          description: Non authentifié
        '403':
          description: Non administrateur

  /admin/users/{id}/admin:
    put:
      operationId: setUserAdmin
      summary: Accorder ou retirer les droits administrateur
      description: |
        Promeut un utilisateur administrateur ou lui retire ce rôle.
        Un administrateur ne peut pas se retirer ses propres droits.
        Le changement prend effet à la prochaine connexion (ou au prochain renouvellement du JWT) de l'utilisateur concerné.
      tags: [Admin]
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetUserAdminRequest'
      responses:
        '200':
          description: Utilisateur mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          description: Un administrateur ne peut pas se retirer ses propres droits
        '401':
          description: Non authentifié
        '403':
          description: Non administrateur
        '404':
          description: Utilisateur non trouvé

# ==============================================================================
# COMPONENTS
# ==============================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT obtenu via /auth/login ou /auth/register
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Clé API générée depuis les paramètres utilisateur

  parameters:
    houseId:
      name: houseId
      in: path
      required: true
      description: ID de la maison (UUID)
      schema:
        type: string
        format: uuid

    deviceId:
      name: deviceId
      in: path
      required: true
      description: ID de l'appareil (UUID)
      schema:
        type: string
        format: uuid

    typeId:
      name: typeId
      in: path
      required: true
      description: ID du type d'entretien (UUID)
      schema:
        type: string
        format: uuid

  schemas:
    # ==========================================================================
    # ERROR
    # ==========================================================================
    ErrorResponse:
      type: object
      properties:
        error:
          type: string
          description: Code d'erreur
        message:
          type: string
          description: Message d'erreur lisible
        details:
          type: object
          description: Détails supplémentaires (validation, etc.)

    # ==========================================================================
    # AUTH
    # ==========================================================================
    RegisterRequest:
      type: object
      required: [firstName, lastName, email, password]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
          example: "Jean"
        lastName:
          type: string
          minLength: 1
          maxLength: 100
          example: "Dupont"
        email:
          type: string
          format: email
          minLength: 1
          example: "jean.dupont@example.com"
        password:
          type: string
          minLength: 8
          pattern: "^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d)(?=.*[^A-Za-z0-9]).{8,}$"
          description: Minimum 8 caractères, avec au moins une majuscule, une minuscule, un chiffre et un caractère spécial
          example: "MonMotDePasse123!"

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
        rememberMe:
          type: boolean
          default: false
          description: >-
            Session persistante : le cookie de refresh token est conservé 365 jours
            (renouvelés à chaque refresh). Sinon, cookie de session (24 h côté serveur),
            supprimé à la fermeture du navigateur.

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token
        refreshToken:
          type: string
          description: Token pour rafraîchir l'access token
        expiresIn:
          type: integer
          description: Durée de validité en secondes
        user:
          $ref: '#/components/schemas/User'

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        theme:
          type: string
          enum: [light, dark, system]
          default: system
          description: Préférence de thème utilisateur
        language:
          type: string
          enum: [fr, en]
          default: fr
          description: Langue préférée de l'utilisateur
        isAdmin:
          type: boolean
          default: false
          description: Administrateur de la plateforme (accès à l'interface d'administration)

    # ==========================================================================
    # HOUSES
    # ==========================================================================
    CreateHouseRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        address:
          type: string
          maxLength: 500
          nullable: true
        zipCode:
          type: string
          maxLength: 20
          nullable: true
        city:
          type: string
          maxLength: 200
          nullable: true

    UpdateHouseRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        address:
          type: string
          maxLength: 500
          nullable: true
        zipCode:
          type: string
          maxLength: 20
          nullable: true
        city:
          type: string
          maxLength: 200
          nullable: true

    House:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
          nullable: true
        zipCode:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time

    HouseSummary:
      description: Maison avec score pour le dashboard
      allOf:
        - $ref: '#/components/schemas/House'
        - type: object
          properties:
            score:
              type: integer
              minimum: 0
              maximum: 100
              description: Pourcentage d'entretiens à jour
            devicesCount:
              type: integer
              description: Nombre d'appareils
            pendingCount:
              type: integer
              description: Nombre d'entretiens à faire
            overdueCount:
              type: integer
              description: Nombre d'entretiens en retard
            userRole:
              type: string
              nullable: true
              description: Rôle de l'utilisateur dans cette maison

    HousesListResponse:
      type: object
      properties:
        houses:
          type: array
          items:
            $ref: '#/components/schemas/HouseSummary'
        globalScore:
          type: integer
          minimum: 0
          maximum: 100
          description: Score global (moyenne de toutes les maisons)

    HouseDetail:
      description: Détail d'une maison avec ses appareils
      allOf:
        - $ref: '#/components/schemas/HouseSummary'
        - type: object
          properties:
            devices:
              type: array
              items:
                $ref: '#/components/schemas/DeviceSummary'

    # ==========================================================================
    # DEVICES
    # ==========================================================================
    CreateDeviceRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        type:
          type: string
          minLength: 1
          description: Type d'appareil (heating, cooling, appliance, etc.)
        brand:
          type: string
          maxLength: 200
          nullable: true
        model:
          type: string
          maxLength: 200
          nullable: true
        installDate:
          type: string
          format: date
          nullable: true

    UpdateDeviceRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        type:
          type: string
        brand:
          type: string
          maxLength: 200
          nullable: true
        model:
          type: string
          maxLength: 200
          nullable: true
        installDate:
          type: string
          format: date
          nullable: true

    Device:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
        brand:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        installDate:
          type: string
          format: date
          nullable: true
        houseId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    DeviceSummary:
      description: Appareil avec score pour la liste
      allOf:
        - $ref: '#/components/schemas/Device'
        - type: object
          properties:
            score:
              type: integer
              minimum: 0
              maximum: 100
              description: Pourcentage d'entretiens à jour
            status:
              type: string
              enum: [up_to_date, pending, overdue]
              description: |
                - up_to_date: Tous les entretiens sont à jour
                - pending: Au moins un entretien à faire
                - overdue: Au moins un entretien en retard
            pendingCount:
              type: integer
              description: Nombre d'entretiens à faire
            maintenanceTypesCount:
              type: integer
              description: Nombre de types d'entretien définis

    DeviceDetail:
      description: Détail d'un appareil avec ses types d'entretien
      allOf:
        - $ref: '#/components/schemas/DeviceSummary'
        - type: object
          properties:
            maintenanceTypes:
              type: array
              items:
                $ref: '#/components/schemas/MaintenanceTypeWithStatus'
            totalSpent:
              type: number
              format: decimal
              description: Total dépensé en entretiens
            maintenanceCount:
              type: integer
              description: Nombre total d'entretiens loggés

    # ==========================================================================
    # MAINTENANCE TYPES
    # ==========================================================================
    CreateMaintenanceTypeRequest:
      type: object
      required: [name, periodicity]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        periodicity:
          $ref: '#/components/schemas/Periodicity'
        customDays:
          type: integer
          minimum: 1
          description: Nombre de jours (requis si periodicity = custom)

    UpdateMaintenanceTypeRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        periodicity:
          $ref: '#/components/schemas/Periodicity'
        customDays:
          type: integer
          minimum: 1

    Periodicity:
      type: string
      enum: [annual, semestrial, quarterly, monthly, custom]
      description: |
        - annual: Tous les ans (365 jours)
        - semestrial: Tous les 6 mois (182 jours)
        - quarterly: Tous les 3 mois (91 jours)
        - monthly: Tous les mois (30 jours)
        - custom: Personnalisé (voir customDays)

    MaintenanceType:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        periodicity:
          $ref: '#/components/schemas/Periodicity'
        customDays:
          type: integer
          nullable: true
        deviceId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    MaintenanceTypeWithStatus:
      description: Type d'entretien avec son statut actuel
      allOf:
        - $ref: '#/components/schemas/MaintenanceType'
        - type: object
          properties:
            status:
              type: string
              enum: [up_to_date, pending, overdue]
            lastMaintenanceDate:
              type: string
              format: date
              nullable: true
              description: Date du dernier entretien
            nextDueDate:
              type: string
              format: date
              nullable: true
              description: Date du prochain entretien prévu

    # ==========================================================================
    # MAINTENANCE INSTANCES
    # ==========================================================================
    LogMaintenanceRequest:
      type: object
      required: [date]
      properties:
        date:
          type: string
          format: date
          description: Date de l'entretien effectué
        cost:
          type: number
          format: decimal
          minimum: 0
          nullable: true
          description: Coût de l'entretien en euros
        provider:
          type: string
          maxLength: 200
          nullable: true
          description: Nom du prestataire
        notes:
          type: string
          maxLength: 2000
          nullable: true
          description: Notes et observations

    MaintenanceInstance:
      type: object
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date
        cost:
          type: number
          format: decimal
          nullable: true
        provider:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        maintenanceTypeId:
          type: string
          format: uuid
        maintenanceTypeName:
          type: string
          description: Nom du type (pour affichage dans historique)
        createdAt:
          type: string
          format: date-time

    MaintenanceHistoryResponse:
      type: object
      properties:
        instances:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceInstance'
        totalSpent:
          type: number
          format: decimal
          description: Total des coûts
        count:
          type: integer
          description: Nombre total d'entretiens

    # ==========================================================================
    # UPCOMING TASKS
    # ==========================================================================
    UpcomingTask:
      type: object
      properties:
        maintenanceTypeId:
          type: string
          format: uuid
        maintenanceTypeName:
          type: string
        deviceId:
          type: string
          format: uuid
        deviceName:
          type: string
        deviceType:
          type: string
        houseId:
          type: string
          format: uuid
        houseName:
          type: string
        status:
          type: string
          enum: [pending, overdue]
        nextDueDate:
          type: string
          format: date
          nullable: true
        lastMaintenanceDate:
          type: string
          format: date
          nullable: true
        periodicity:
          type: string

    UpcomingTasksResponse:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/UpcomingTask'
        overdueCount:
          type: integer
          description: Nombre de tâches en retard
        pendingCount:
          type: integer
          description: Nombre de tâches en attente

    # ==========================================================================
    # API Keys (US-300 (#188), US-301 (#189), US-302 (#190))
    # ==========================================================================
    CreateApiKeyRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 100
          description: Nom descriptif de la clé (ex. "Home Assistant")
        scope:
          type: string
          enum: [ReadOnly, ReadWrite]
          default: ReadWrite
          description: Niveau d'accès de la clé

    CreateApiKeyResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        key:
          type: string
          description: Clé API complète (affichée une seule fois)
        prefix:
          type: string
          description: Préfixe de la clé pour identification (ex. "hf_Ab3xK9mQ")
        scope:
          type: string
          enum: [ReadOnly, ReadWrite]
        createdAt:
          type: string
          format: date-time

    ApiKeyDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
        scope:
          type: string
          enum: [ReadOnly, ReadWrite]
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true

    # ==========================================================================
    # ADMIN
    # ==========================================================================
    AdminStats:
      type: object
      properties:
        users:
          type: integer
          description: Nombre total de comptes
        admins:
          type: integer
          description: Nombre d'administrateurs
        houses:
          type: integer
        devices:
          type: integer
        maintenanceInstances:
          type: integer
          description: Nombre d'entretiens loggés

    AdminUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        isAdmin:
          type: boolean
        createdAt:
          type: string
          format: date-time
        housesCount:
          type: integer
          description: Nombre de maisons dont l'utilisateur est propriétaire

    AdminUsersPage:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        total:
          type: integer
          description: Nombre total d'utilisateurs correspondant au filtre
        page:
          type: integer
        pageSize:
          type: integer

    SetUserAdminRequest:
      type: object
      required:
        - isAdmin
      properties:
        isAdmin:
          type: boolean
          description: true pour accorder les droits administrateur, false pour les retirer
