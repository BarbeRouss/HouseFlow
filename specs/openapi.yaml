openapi: 3.0.3
info:
  title: HouseFlow API
  description: |
    API pour l'application HouseFlow - Suivi d'entretien de maison.

    ## MVP Features
    - Authentification (inscription, connexion, déconnexion)
    - Gestion des maisons (CRUD)
    - Gestion des appareils (CRUD)
    - Gestion des types d'entretien (CRUD)
    - Logging des entretiens effectués
    - Calcul des scores de progression

    ## Conventions
    - **Erreurs** : ProblemDetails (`application/problem+json`, schéma `ErrorResponse`) avec un
      `code` machine quand l'interface doit réagir (voir `ErrorResponse.code`).
    - **403 / 404** : 404 (`not_found`) si la ressource — ou la maison qui la contient — n'existe
      pas ; 403 (`forbidden`) si elle existe mais que l'appelant n'a pas le rôle requis (R5).
    - **Dates calendaires** (date d'entretien, échéance, date d'installation) : un jour du
      calendrier Europe/Paris, transporté comme **minuit UTC de ce jour**
      (`yyyy-MM-ddT00:00:00Z`). Les réponses l'envoient toujours sous cette forme
      (`format: date-time`) ; les requêtes acceptent `yyyy-MM-dd` ou `yyyy-MM-ddT00:00:00Z`
      (`format: date`) — seule la partie date est prise en compte, jamais un instant local.
  version: 1.0.0
  contact:
    name: HouseFlow Team

servers:
  - url: http://localhost:5203/api/v1
    description: Local Development Server
  - url: https://api.houseflow.app/v1
    description: Production Server

tags:
  - name: Auth
    description: Authentification et gestion de compte
  - name: Houses
    description: Gestion des maisons
  - name: Devices
    description: Gestion des appareils
  - name: MaintenanceTypes
    description: Définition des types d'entretien récurrents
  - name: MaintenanceInstances
    description: Historique des entretiens effectués
  - name: Members
    description: Membres d'une maison et rôles (R5)
  - name: Invitations
    description: Invitations à rejoindre une maison (lien partageable, aucun email envoyé)
  - name: ApiKeys
    description: Gestion des clés API pour intégration externe
  - name: OAuth
    description: |
      Autorisation d'applications tierces (Claude via MCP, issue #304) par le serveur
      d'autorisation OAuth 2.1 embarqué (OpenIddict). Les endpoints protocolaires sont hors
      `/api/v1`, à la racine de l'API, et suivent les RFC (erreurs `{ error, error_description }`,
      pas de ProblemDetails) :
      - `GET /.well-known/oauth-authorization-server` (RFC 8414), même document sous
        `/.well-known/openid-configuration` ; annonce `registration_endpoint` ;
      - `GET|POST /connect/authorize` : code d'autorisation, PKCE `S256` obligatoire (`plain`
        refusé). Sans cookie `oauthSession` valide → 302 `{front}/oauth/authorize?returnUrl=…` ;
        consentement requis (ou `prompt=consent`) → 302 `{front}/oauth/consent?returnUrl=…` ;
        consentement existant → 302 `{redirect_uri}?code=…&state=…` ; paramètre
        `houseflow_consent=denied` (« Refuser » ; toute occurrence de `houseflow_consent`, quelles
        que soient la casse, la valeur et le nombre, vaut refus) → `error=access_denied`.
        `resource` (RFC 8707) : la ressource
        MCP uniquement, sinon 400 JSON `{ error: invalid_target, error_description }`, vérifié
        avant tout le reste et jamais redirigé vers le client (RFC 9700 §4.11.2) ;
      - `POST /connect/token` : `authorization_code` et `refresh_token` (rotation stricte, un
        refresh token déjà utilisé → `invalid_grant`). Access token chiffré (opaque), 15 min,
        audience = ressource MCP ; refresh token 30 jours glissants. 30 requêtes/min par client ;
      - `GET /connect/userinfo` : `{ sub, scope }` ; `POST /connect/revocation` (RFC 7009) ;
      - `POST /connect/register` : enregistrement dynamique anonyme (RFC 7591) de clients
        publics (`token_endpoint_auth_method: none`, jamais de secret), redirect URIs `https://`
        ou `http://` loopback (`127.0.0.1`, `[::1]`, `localhost`), sans fragment ; erreurs
        `invalid_redirect_uri` / `invalid_client_metadata`. 5 requêtes/min par client.

      Les endpoints ci-dessous servent les écrans du frontend (connexion, consentement,
      applications connectées). JWT de l'application uniquement : une clé API est refusée.
  - name: Users
    description: Compte utilisateur et droits RGPD (profil, export, suppression, consentement)
  - name: Admin
    description: Administration de la plateforme (réservée aux administrateurs)

paths:
  # ============================================================================
  # AUTHENTICATION (US-001 (#165), US-002 (#166), US-003 (#167))
  # ============================================================================
  /auth/register:
    post:
      operationId: register
      summary: Inscription d'un nouvel utilisateur
      description: |
        Crée un compte utilisateur. **Aucune maison n'est créée** : la première maison est
        créée par l'onboarding (`POST /houses`, écran P05).
        Retourne un token JWT pour authentification immédiate (refresh token en cookie HttpOnly).
        L'email est enregistré sous sa forme canonique (sans espaces autour, en minuscules) :
        l'unicité et la connexion ignorent la casse. Limité à 5 requêtes par minute et par
        client, avec la connexion (429). Efface le cookie de session OAuth `oauthSession` d'une
        identité précédente dans ce navigateur (voir `POST /oauth/session`).

        Avec `invitationToken` : l'email doit être celui de l'invitation, et l'invitation est
        acceptée automatiquement après la création du compte (`joinedHouseId` dans la réponse).
        Un token inconnu ou plus utilisable → 400 `invitation_invalid` ; un email différent →
        400 `invitation_email_mismatch`. Dans les deux cas, aucun compte n'est créé. La
        vérification et l'acceptation ont lieu dans la même transaction sérialisable que
        `POST /invitations/{token}/accept` : une invitation ne peut pas être consommée deux fois.
      tags: [Auth]
      parameters:
        - name: invitationToken
          in: query
          required: false
          description: Token d'invitation (lien `/invitations/{token}`) à accepter après l'inscription
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
            example:
              firstName: "Jean"
              lastName: "Dupont"
              email: "jean.dupont@example.com"
              password: "MonMotDePasse123!"
              consentAccepted: true
      responses:
        '200':
          description: Inscription réussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          description: Données invalides, CGU non acceptées, ou invitation invalide (`invitation_invalid`, `invitation_email_mismatch`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Email déjà utilisé (`email_taken`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/login:
    post:
      operationId: login
      summary: Connexion
      description: |
        Authentifie un utilisateur et retourne un token JWT. L'email ne tient compte ni de la
        casse ni des espaces autour (les adresses sont stockées en minuscules, sans espaces).
        Limité à 5 requêtes par minute et par client, avec l'inscription (429). Efface le cookie
        de session OAuth `oauthSession` d'une identité précédente dans ce navigateur (voir
        `POST /oauth/session`).
      tags: [Auth]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              email: "jean.dupont@example.com"
              password: "MonMotDePasse123!"
      responses:
        '200':
          description: Connexion réussie
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: |
            Connexion refusée. `code` :
            - `invalid_credentials` : email ou mot de passe incorrect (un seul message, sans distinguer les deux) ;
            - `account_restricted` : compte sous limitation du traitement (RGPD Art. 18).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/refresh:
    post:
      operationId: refreshToken
      summary: Rafraîchir le token
      description: >-
        Échange le refresh token (cookie HttpOnly `refreshToken`) contre un nouveau
        access token. Le refresh token est tourné à chaque appel ; présenter un token
        déjà tourné (hors fenêtre de grâce de 30 s) révoque toute la famille de tokens
        issue du même login (détection de vol). Deux présentations simultanées d'un même
        token actif n'en tournent qu'une : l'autre reçoit le jeton frère de la fenêtre de
        grâce. Limite propre à la session (60 requêtes par minute et par client, partagée
        avec logout et revoke), distincte de celle de login / register : un 429 est
        transitoire (réessayer après `Retry-After`), il ne signifie pas que la session est
        perdue — seul un 401 le signifie.
      tags: [Auth]
      responses:
        '200':
          description: Token rafraîchi
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: |
            Refresh token absent, invalide, expiré ou réutilisé (`invalid_refresh_token`), ou
            compte sous limitation du traitement, RGPD Art. 18 (`account_restricted`).
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/logout:
    post:
      operationId: logout
      summary: Déconnexion
      description: |
        Révoque la session du cookie `refreshToken` : toute la famille de tokens issue du même
        login (y compris un jeton frère de la fenêtre de grâce ou un remplaçant dont la réponse
        a été perdue), pas seulement le token présenté. Les autres appareils ne sont pas touchés.
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: |
            Déconnexion réussie (même si le refresh token est absent ou déjà révoqué). Les cookies
            `refreshToken` et `oauthSession` (session OAuth, voir `POST /oauth/session`) sont effacés.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/revoke:
    post:
      operationId: revokeRefreshToken
      summary: Révoquer le refresh token courant
      description: |
        Révoque la session du cookie `refreshToken` (toute sa famille de tokens, comme
        `/auth/logout`) et efface le cookie, ainsi que le cookie de session OAuth `oauthSession`.
        Contrairement à `/auth/logout`, échoue si le cookie est absent, le token inconnu ou sa
        session déjà entièrement révoquée.
      tags: [Auth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Token révoqué
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MessageResponse'
        '400':
          description: Cookie absent, token inconnu ou session déjà révoquée (`invalid_refresh_token`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================================================
  # HOUSES (US-010 (#168), US-011 (#169), US-012 (#170), US-020 (#171), US-023 (#174), US-024 (#175))
  # ============================================================================
  /houses:
    get:
      operationId: getHouses
      summary: Liste des maisons
      description: |
        Retourne toutes les maisons de l'utilisateur avec leur score de progression.
        Utilisé pour le dashboard principal.
      tags: [Houses]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Liste des maisons avec scores
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HousesListResponse'

    post:
      operationId: createHouse
      summary: Créer une maison
      description: |
        Crée une nouvelle maison pour l'utilisateur connecté. Sans `colorKey`, la couleur est attribuée
        en rotation (voir `HouseColorKey`) — c'est `nextColorKey` de `GET /houses`.
      tags: [Houses]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateHouseRequest'
            example:
              name: "Maison de campagne"
              address: "123 Rue des Champs"
              zipCode: "75001"
              city: "Paris"
      responses:
        '201':
          description: Maison créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/House'
        '400':
          description: Données invalides

  /houses/{houseId}:
    parameters:
      - $ref: '#/components/parameters/houseId'

    get:
      operationId: getHouse
      summary: Détail d'une maison
      description: |
        Retourne les détails d'une maison avec la liste de ses appareils, leurs statuts, le rôle
        de l'appelant et ses droits (`capabilities`, règle R5).
        Convention 403/404 (toute l'API) : 404 si la ressource n'existe pas, 403 si elle
        existe mais que l'appelant n'y a pas accès.
      tags: [Houses]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Détail de la maison
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      operationId: updateHouse
      summary: Modifier une maison
      description: Met à jour les informations d'une maison (propriétaire uniquement, R5).
      tags: [Houses]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateHouseRequest'
      responses:
        '200':
          description: Maison modifiée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/House'
        '400':
          description: Données invalides
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      operationId: deleteHouse
      summary: Supprimer une maison
      description: |
        Supprime une maison et tous ses appareils/entretiens (cascade).
      tags: [Houses]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Maison supprimée
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================================
  # DEVICES (US-021 (#172), US-022 (#173), US-030 (#176), US-035 (#181), US-036 (#182))
  # ============================================================================
  /houses/{houseId}/devices:
    parameters:
      - $ref: '#/components/parameters/houseId'

    get:
      operationId: getDevices
      summary: Liste des appareils d'une maison
      description: Retourne tous les appareils d'une maison avec leur statut.
      tags: [Devices]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Liste des appareils
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DeviceSummary'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      operationId: createDevice
      summary: Ajouter un appareil
      description: |
        Ajoute un nouvel appareil à une maison (propriétaire ou collaborateur RW).
        Avec `maintenanceType`, crée aussi son type d'entretien par défaut (catalogue M2/P06),
        dans la même transaction, en appliquant le « dernier entretien » (R2).
      tags: [Devices]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDeviceRequest'
            example:
              name: "Chaudière gaz"
              type: "Chaudière Gaz"
              brand: "Viessmann"
              model: "Vitodens 200"
              installDate: "2019-03-15"
              maintenanceType:
                name: "Entretien annuel"
                periodicity: "Annual"
                lastMaintenance:
                  kind: "Month"
                  year: 2026
                  month: 3
      responses:
        '201':
          description: Appareil créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          description: |
            Données invalides (dont `maintenanceType` invalide, ex. mois futur) : rien n'est créé,
            ni l'appareil ni son type d'entretien.
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /devices/{deviceId}:
    parameters:
      - $ref: '#/components/parameters/deviceId'

    get:
      operationId: getDevice
      summary: Détail d'un appareil
      description: |
        Retourne les détails d'un appareil avec ses types d'entretien et leur statut.
      tags: [Devices]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Détail de l'appareil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDetail'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    put:
      operationId: updateDevice
      summary: Modifier un appareil
      description: Met à jour les informations d'un appareil.
      tags: [Devices]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateDeviceRequest'
      responses:
        '200':
          description: Appareil modifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Device'
        '400':
          description: Données invalides
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      operationId: deleteDevice
      summary: Supprimer un appareil
      description: |
        Supprime un appareil et tous ses entretiens (cascade).
      tags: [Devices]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Appareil supprimé
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================================
  # MAINTENANCE TYPES (US-031 (#177), US-032 (#178))
  # ============================================================================
  /devices/{deviceId}/maintenance-types:
    parameters:
      - $ref: '#/components/parameters/deviceId'

    get:
      operationId: getMaintenanceTypes
      summary: Liste des types d'entretien
      description: Retourne les types d'entretien définis pour un appareil.
      tags: [MaintenanceTypes]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Liste des types d'entretien
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/MaintenanceTypeWithStatus'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    post:
      operationId: createMaintenanceType
      summary: Ajouter un type d'entretien
      description: |
        Définit un nouveau type d'entretien récurrent pour un appareil (propriétaire ou
        collaborateur RW). `lastMaintenance` applique la règle R2 (voir `LastMaintenance`).
      tags: [MaintenanceTypes]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMaintenanceTypeRequest'
            example:
              name: "Entretien annuel"
              periodicity: "Annual"
              lastMaintenance:
                kind: "Unknown"
      responses:
        '201':
          description: Type d'entretien créé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceType'
        '400':
          description: Données invalides (Custom sans intervalle, mois futur…)
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /maintenance-types/{typeId}:
    parameters:
      - $ref: '#/components/parameters/typeId'

    put:
      operationId: updateMaintenanceType
      summary: Modifier un type d'entretien
      description: |
        Mise à jour partielle. Changer la périodicité recalcule l'échéance depuis le dernier
        enregistrement (l'échéance est toujours dérivée, jamais stockée). Passer à une
        périodicité non `Custom` efface `customDays` / `customMonths`.
      tags: [MaintenanceTypes]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMaintenanceTypeRequest'
      responses:
        '200':
          description: Type modifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceType'
        '400':
          description: Données invalides (passage à Custom sans intervalle…)
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      operationId: deleteMaintenanceType
      summary: Supprimer un type d'entretien
      description: Supprime un type et son historique (cascade).
      tags: [MaintenanceTypes]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Type supprimé
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================================
  # MAINTENANCE INSTANCES (US-033 (#179), US-034 (#180))
  # ============================================================================
  /maintenance-types/{typeId}/instances:
    parameters:
      - $ref: '#/components/parameters/typeId'

    post:
      operationId: logMaintenance
      summary: Logger un entretien
      description: |
        Enregistre qu'un entretien a été effectué (propriétaire, collaborateur RW, locataire).
        Met automatiquement à jour le statut du type et calcule la prochaine échéance (R2 :
        date de réalisation + périodicité). La date ne peut pas être postérieure à la date du
        jour à Europe/Paris.
      tags: [MaintenanceInstances]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogMaintenanceRequest'
            example:
              date: "2024-10-12"
              cost: 95.00
              provider: "Ramoneur Express"
              notes: "RAS, conduit en bon état"
      responses:
        '201':
          description: Entretien loggé
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceInstance'
        '400':
          description: Données invalides (date future…)
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /maintenance-instances/{instanceId}:
    parameters:
      - name: instanceId
        in: path
        required: true
        description: ID de l'enregistrement d'entretien (UUID)
        schema:
          type: string
          format: uuid

    put:
      operationId: updateMaintenanceInstance
      summary: Modifier un enregistrement d'entretien
      description: |
        Modification (M3) : propriétaire, collaborateur RW ou
        locataire (R5). L'échéance du type est recalculée (R2).
      tags: [MaintenanceInstances]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMaintenanceInstanceRequest'
      responses:
        '200':
          description: Enregistrement modifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceInstance'
        '400':
          description: Données invalides (date future…)
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

    delete:
      operationId: deleteMaintenanceInstance
      summary: Supprimer un enregistrement d'entretien
      description: |
        Propriétaire ou collaborateur RW (pas le locataire, R5). Supprimer le dernier
        enregistrement recalcule l'échéance depuis le précédent, ou applique la règle « sans
        historique » s'il n'y en a plus (R2). Sert à « Annuler » dans le toast C5.
      tags: [MaintenanceInstances]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Enregistrement supprimé
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================================
  # DASHBOARD / UPCOMING TASKS
  # ============================================================================
  /dashboard:
    get:
      operationId: getDashboard
      summary: Accueil (P07) — entretiens à traiter et compteurs
      description: |
        Sur toutes les maisons visibles par l'utilisateur :
        - `tasks` : **tous** les entretiens « À traiter » (en retard + à faire dans les 30 jours,
          R1), sans limite, triés par échéance croissante (les retards d'abord) ;
        - compteurs R3 : `toHandleCount` (= badge de navigation), `overdueCount`,
          `pendingCount`, `upToDateCount`, `totalCount` (« {à jour}/{total} à jour ») ;
        - `nextTask` : le prochain entretien à jour (échéance la plus proche), pour l'état
          « Tout est à jour · Prochain : … » ; null s'il n'y en a aucun.
      tags: [MaintenanceTypes]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Données de l'accueil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dashboard'

  /upcoming-tasks:
    get:
      operationId: getUpcomingTasks
      summary: Liste des tâches d'entretien à venir
      description: |
        Retourne toutes les tâches d'entretien à faire (30 jours) ou en retard
        pour l'ensemble des maisons et appareils de l'utilisateur, triées par échéance
        croissante (les retards d'abord). Préférer `GET /dashboard` pour l'accueil.
      tags: [MaintenanceTypes]
      security:
        - bearerAuth: []
      parameters:
        - name: limit
          in: query
          description: Nombre maximum de tâches à retourner
          required: false
          schema:
            type: integer
            minimum: 1
            example: 5
      responses:
        '200':
          description: Liste des tâches à venir
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpcomingTasksResponse'

  /devices/{deviceId}/maintenance-history:
    parameters:
      - $ref: '#/components/parameters/deviceId'

    get:
      operationId: getMaintenanceHistory
      summary: Historique des entretiens
      description: |
        Retourne l'historique de tous les entretiens d'un appareil,
        triés par date décroissante (plus récent en premier).
      tags: [MaintenanceInstances]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Historique des entretiens
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MaintenanceHistoryResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  # ============================================================================
  # MEMBERS & INVITATIONS (M5, P03, P04) — gestion réservée au propriétaire, sauf invitation d'un locataire (RW, R5)
  # ============================================================================
  /houses/{houseId}/members:
    parameters:
      - $ref: '#/components/parameters/houseId'
    get:
      operationId: getHouseMembers
      summary: Membres d'une maison
      description: Visible par tout membre de la maison (le propriétaire inclus, rôle `Owner`).
      tags: [Members]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Membres
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/HouseMember'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /members/{memberId}/role:
    parameters:
      - $ref: '#/components/parameters/memberId'
    put:
      operationId: updateMemberRole
      summary: Changer le rôle d'un membre (propriétaire uniquement)
      tags: [Members]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberRoleRequest'
      responses:
        '200':
          description: Membre modifié
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HouseMember'
        '400':
          description: Rôle inconnu (seuls les noms `CollaboratorRW`, `CollaboratorRO`, `Tenant` sont acceptés), ou rôle du propriétaire
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /members/{memberId}/permissions:
    parameters:
      - $ref: '#/components/parameters/memberId'
    put:
      operationId: updateMemberPermissions
      summary: Droits fins d'un locataire (propriétaire uniquement)
      tags: [Members]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMemberPermissionsRequest'
      responses:
        '204':
          description: Droits modifiés
        '400':
          description: Le membre n'est pas locataire
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /members/{memberId}:
    parameters:
      - $ref: '#/components/parameters/memberId'
    delete:
      operationId: removeMember
      summary: Retirer un membre (propriétaire uniquement)
      tags: [Members]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Membre retiré
        '400':
          description: Le propriétaire ne peut pas se retirer lui-même
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /collaborators:
    get:
      operationId: getAllCollaborators
      summary: Collaborateurs de toutes les maisons possédées
      description: |
        Pour chaque maison dont l'appelant est propriétaire : ses membres (hors propriétaire) et
        ses invitations en attente non expirées. Maisons partagées avec l'appelant non incluses.
      tags: [Members]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Collaborateurs par maison
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AllCollaboratorsResponse'

  /houses/{houseId}/invitations:
    parameters:
      - $ref: '#/components/parameters/houseId'
    post:
      operationId: createInvitation
      summary: Inviter quelqu'un (propriétaire ; collaborateur RW pour un locataire)
      description: |
        Crée une invitation pour `email` avec `role` (hors `Owner`), valable 7 jours, 20 au
        maximum en attente par maison. Le propriétaire invite tout rôle ; un collaborateur RW
        ne peut inviter qu'un locataire (`Tenant`), tout autre rôle renvoie 403 `forbidden`.
        **Aucun email n'est envoyé** : l'invitant copie le
        lien `/invitations/{token}` et le transmet lui-même. L'email est conservé (donnée
        personnelle d'un tiers, voir docs/gdpr/processing-register.md) : il verrouille
        l'inscription par ce lien et est purgé avec l'invitation.
      tags: [Invitations]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInvitationRequest'
      responses:
        '201':
          description: Invitation créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '400':
          description: |
            Rôle ou email invalide, ou limite de 20 invitations en attente atteinte
            (`invitation_limit_reached`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: |
            `already_member` (cet email est déjà membre de la maison) ou
            `invitation_already_pending` (une invitation est déjà en attente pour cet email)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      operationId: getHouseInvitations
      summary: Invitations en attente (propriétaire ; collaborateur RW pour les locataires)
      description: |
        Invitations non acceptées, non refusées et non annulées, y compris celles dont le
        délai est dépassé (`isExpired`, « Renvoyer » les relance), les plus récentes d'abord.
        Le propriétaire les voit toutes ; un collaborateur RW ne voit que les invitations de
        locataire.
      tags: [Invitations]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Invitations
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /invitations/{token}:
    parameters:
      - $ref: '#/components/parameters/invitationToken'
    get:
      operationId: getInvitationInfo
      summary: Informations publiques d'une invitation (P04)
      description: |
        Accessible sans authentification. Avec un JWT, `isAlreadyMember` indique si l'appelant
        est déjà membre de la maison (P04 redirige alors vers P09) ; sans JWT il vaut null.
        `email` n'est renvoyé que tant que l'invitation est utilisable (en attente et non
        expirée) ; il vaut null une fois l'invitation acceptée, refusée, annulée ou expirée
        (minimisation, RGPD art. 5-1-c).
      tags: [Invitations]
      security: []
      responses:
        '200':
          description: Invitation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationInfo'
        '404':
          $ref: '#/components/responses/NotFound'

  /invitations/{token}/accept:
    parameters:
      - $ref: '#/components/parameters/invitationToken'
    post:
      operationId: acceptInvitation
      summary: Rejoindre la maison (P04 état B)
      description: |
        Réservé au compte dont l'adresse e-mail est celle de l'invitation (insensible à la casse ;
        les invitations antérieures au champ `email` ne sont pas contrôlées).
      tags: [Invitations]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Invitation acceptée (idempotent pour le même utilisateur)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AcceptInvitationResponse'
        '400':
          description: '`invitation_invalid` (expirée, refusée, annulée, déjà utilisée), `own_invitation`, `already_member`, `invitation_email_mismatch` (le compte connecté n''a pas l''adresse e-mail de l''invitation)'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'

  /invitations/{token}/decline:
    parameters:
      - $ref: '#/components/parameters/invitationToken'
    post:
      operationId: declineInvitation
      summary: Refuser une invitation (P04 état B, « Refuser »)
      description: |
        L'invitation passe au statut `Declined` et ne peut plus être utilisée. Comme l'acceptation,
        réservé au compte dont l'adresse e-mail est celle de l'invitation.
      tags: [Invitations]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Invitation refusée
        '400':
          description: '`invitation_invalid`, `own_invitation`, `invitation_email_mismatch`'
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'

  /invitations/{invitationId}:
    parameters:
      - $ref: '#/components/parameters/invitationId'
    delete:
      operationId: cancelInvitation
      summary: Annuler une invitation en attente (propriétaire ; collaborateur RW pour un locataire)
      tags: [Invitations]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Invitation annulée (statut `Revoked`)
        '400':
          description: L'invitation n'est plus en attente (`invitation_invalid`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /invitations/{invitationId}/resend:
    parameters:
      - $ref: '#/components/parameters/invitationId'
    post:
      operationId: resendInvitation
      summary: Renvoyer une invitation (propriétaire ; collaborateur RW pour un locataire)
      description: |
        Génère un **nouveau token** (l'ancien lien cesse de fonctionner) et repousse
        l'expiration à 7 jours. Aucun email n'est envoyé : le nouveau lien est à copier.
        Relancer une invitation expirée la remet en attente : la limite de 20 invitations en
        attente par maison s'applique, ainsi que l'unicité d'une invitation en attente par email.
      tags: [Invitations]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Invitation relancée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '400':
          description: L'invitation a été acceptée, refusée ou annulée (`invitation_invalid`), ou limite de 20 invitations en attente atteinte (`invitation_limit_reached`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Une autre invitation est déjà en attente pour cet email (`invitation_already_pending`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  # ============================================================================
  # API KEYS (US-300 (#188), US-301 (#189), US-302 (#190))
  # ============================================================================
  /users/api-keys:
    post:
      operationId: createApiKey
      summary: Créer une clé API
      description: |
        Génère une nouvelle clé API pour l'utilisateur.
        La clé complète n'est retournée qu'une seule fois dans la réponse.
        Maximum 5 clés actives par utilisateur.
      tags: [ApiKeys]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
      responses:
        '201':
          description: Clé API créée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreateApiKeyResponse'
        '400':
          description: Données invalides ou limite de clés atteinte
        '401':
          $ref: '#/components/responses/Unauthorized'
    get:
      operationId: listApiKeys
      summary: Lister les clés API
      description: Retourne la liste des clés API actives de l'utilisateur (sans la clé complète).
      tags: [ApiKeys]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Liste des clés API
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ApiKeyDto'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/api-keys/{id}:
    delete:
      operationId: revokeApiKey
      summary: Révoquer une clé API
      description: Révoque définitivement une clé API. Les requêtes utilisant cette clé recevront une erreur 401.
      tags: [ApiKeys]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Clé révoquée
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Clé non trouvée

  # ============================================================================
  # OAUTH 2.1 — APPLICATIONS TIERCES (issue #304)
  # ============================================================================
  /oauth/session:
    post:
      operationId: createOAuthSession
      summary: Ouvrir la session OAuth du navigateur
      description: |
        Pose le cookie HttpOnly `oauthSession` qui identifie l'utilisateur sur
        `GET /connect/authorize` : `Path=/connect`, `SameSite` comme le cookie de refresh,
        `Secure` hors développement. Cookie de session (ni `Max-Age` ni `Expires`) : le JWT
        qu'il porte expire au bout de 10 minutes. Appelé par l'écran `/oauth/authorize` du
        frontend avant de renvoyer le navigateur vers l'URL d'autorisation (`returnUrl`). Le
        cookie est un JWT signé d'audience distincte : il n'est jamais accepté comme access
        token de l'API, et un access token de l'API n'est jamais accepté comme cookie. Effacé
        à la connexion, à l'inscription, à la déconnexion et à la suppression du compte.
      tags: [OAuth]
      security:
        - bearerAuth: []
      responses:
        '204':
          description: Cookie `oauthSession` posé (en-tête `Set-Cookie`)
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /oauth/clients/{clientId}:
    get:
      operationId: getOAuthClient
      summary: Application cliente OAuth (écran de consentement)
      description: |
        Nom déclaré par le client, hôtes de ses redirect URIs (là où l'utilisateur sera
        renvoyé — la seule identité vérifiable d'un client enregistré dynamiquement) et scopes
        qu'il a le droit de demander.
      tags: [OAuth]
      security:
        - bearerAuth: []
      parameters:
        - name: clientId
          in: path
          required: true
          description: Identifiant OAuth du client (`client_id`, 32 caractères hexadécimaux)
          schema:
            type: string
      responses:
        '200':
          description: Application cliente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthClientInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /oauth/authorizations:
    get:
      operationId: listOAuthAuthorizations
      summary: Applications connectées
      description: Consentements valides de l'utilisateur, les plus récents d'abord.
      tags: [OAuth]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Applications autorisées
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/OAuthAuthorization'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
    post:
      operationId: grantOAuthAuthorization
      summary: Autoriser une application (consentement)
      description: |
        « Autoriser » sur l'écran de consentement. Enregistre les scopes cochés : ils
        remplacent ceux d'un consentement existant pour la même application (il n'y en a
        jamais deux). Si un scope précédemment accordé n'est plus coché, tous les jetons émis
        sous ce consentement sont révoqués : l'application doit redemander un code, limité au
        périmètre réduit. Rafraîchit le cookie `oauthSession` pour le retour vers
        `/connect/authorize`, qui émet alors le code sans redemander le consentement.
      tags: [OAuth]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/GrantOAuthAuthorizationRequest'
      responses:
        '201':
          description: Consentement enregistré (cookie `oauthSession` rafraîchi)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OAuthAuthorization'
        '400':
          description: Scopes vides, inconnus ou non autorisés pour ce client (`validation_failed`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /oauth/authorizations/{id}:
    delete:
      operationId: revokeOAuthAuthorization
      summary: Révoquer une application connectée
      description: |
        Révoque le consentement et tous les tokens émis sous lui : l'access token en cours
        cesse de fonctionner immédiatement, le refresh token est refusé (`invalid_grant`).
      tags: [OAuth]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Identifiant du consentement (`OAuthAuthorization.id`)
          schema:
            type: string
      responses:
        '204':
          description: Application révoquée
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Consentement inconnu ou appartenant à un autre utilisateur (`not_found`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ============================================================================
  # USER ACCOUNT & RGPD (issues #132, #133, #135)
  # ============================================================================
  /users/me:
    get:
      operationId: getMyProfile
      summary: Profil de l'utilisateur connecté
      description: |
        Retourne le profil de l'utilisateur authentifié, y compris l'état de son
        consentement (RGPD Art. 15 — droit d'accès, données de profil).
      tags: [Users]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Profil utilisateur
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: updateMyProfile
      summary: Modifier son profil (droit de rectification)
      description: |
        RGPD Art. 16 — permet à l'utilisateur de rectifier ses données d'identité
        (prénom, nom, email). L'email doit rester unique.
      tags: [Users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profil mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserProfile'
        '400':
          description: Données invalides
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: Email déjà utilisé par un autre compte (`email_taken`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    delete:
      operationId: deleteMyAccount
      summary: Supprimer son compte (droit à l'effacement)
      description: |
        RGPD Art. 17 — suppression définitive et immédiate du compte et de toutes les
        données personnelles associées :
        - maisons dont l'utilisateur est propriétaire : transférées au collaborateur
          non-locataire le plus ancien (CollaboratorRW, sinon CollaboratorRO) s'il en
          existe un, sinon supprimées avec tout leur contenu (appareils, entretiens,
          membres, invitations en cascade) ;
        - adhésions aux maisons d'autres utilisateurs (retrait du membre uniquement) ;
        - refresh tokens et clés API (révocation immédiate de toutes les sessions) ;
        - invitations créées par l'utilisateur ;
        - journaux d'audit : anonymisés (userId → null, username → "deleted-user",
          identifiant du compte → "deleted", IP/user agent/valeurs → supprimés) et
          conservés pour la traçabilité. Une fois le lien avec la personne rompu,
          l'enregistrement n'est plus une donnée personnelle (considérant 26 ; avis
          WP216) ; la finalité de sécurité repose sur l'Art. 6(1)(f).
        Confirmation par ressaisie du mot de passe obligatoire.
      tags: [Users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
      responses:
        '204':
          description: Compte supprimé. Les cookies `refreshToken` et `oauthSession` sont effacés.
        '400':
          description: Mot de passe incorrect (`wrong_password`) ou requête invalide (`validation_failed`)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/me/export:
    get:
      operationId: exportMyData
      summary: Exporter toutes ses données (droit d'accès et portabilité)
      description: |
        RGPD Art. 15 (accès) et Art. 20 (portabilité) — retourne une copie complète
        des données personnelles de l'utilisateur dans un format structuré, couramment
        utilisé et lisible par machine.
        - `format=json` (défaut) : un document JSON (`UserDataExport`),
          `Content-Disposition: attachment; filename="houseflow-data-export-{yyyy-MM-dd}.json"`
          (`{yyyy-MM-dd}` : la date du jour à Europe/Paris, R1).
        - `format=csv` : une archive ZIP contenant un fichier CSV (UTF-8, séparateur `,`)
          par catégorie (profile, houses, devices, maintenance_types, maintenance_instances,
          memberships, invitations, api_keys, sessions, audit_logs),
          `Content-Disposition: attachment; filename="houseflow-data-export-{yyyy-MM-dd}.zip"`.
        Les secrets techniques (hash du mot de passe, valeurs des tokens, hash des clés API)
        ne sont jamais exportés. Limité à 1 export par heure et par utilisateur (429).
        Chaque export est journalisé (audit "DataExport").
      tags: [Users]
      security:
        - bearerAuth: []
      parameters:
        - name: format
          in: query
          required: false
          description: "`json` (défaut) ou `csv`"
          schema:
            type: string
            default: json
      responses:
        '200':
          description: Export des données
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserDataExport'
            application/zip:
              schema:
                type: string
                format: binary
        '400':
          description: Format non pris en charge (ni `json` ni `csv`) — le quota horaire n'est pas consommé
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          description: Un export a déjà été effectué il y a moins d'une heure (`export_rate_limited`, header Retry-After)
          content:
            application/problem+json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /users/me/consent:
    get:
      operationId: getConsentStatus
      summary: Statut d'acceptation des CGU / de la politique de confidentialité
      description: |
        Renvoie la date et la version acceptées par l'utilisateur courant, la version
        en vigueur, et si une (ré)acceptation est nécessaire (bannière frontend).
      tags: [Users]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Statut d'acceptation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentStatus'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      operationId: recordConsent
      summary: Enregistrer l'acceptation des CGU et la prise de connaissance de la politique
      description: |
        Enregistre (avec date, IP et version) l'acceptation par un utilisateur existant des
        Conditions générales d'utilisation en vigueur et sa prise de connaissance de la
        politique de confidentialité (bannière de ré-acceptation). `accepted` doit être `true`.

        Ce n'est PAS un consentement au sens de l'Art. 7 : la base légale du compte est
        l'exécution du contrat (Art. 6(1)(b)) et l'information relative à la politique relève
        de l'Art. 13. Le nommage `consent` est historique.
      tags: [Users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConsentRequest'
      responses:
        '200':
          description: Acceptation enregistrée
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConsentStatus'
        '400':
          description: Acceptation refusée (`accepted` false) ou version de politique inconnue
        '401':
          $ref: '#/components/responses/Unauthorized'

  /users/settings:
    get:
      operationId: getUserSettings
      summary: Préférences d'affichage (thème, langue)
      tags: [Users]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Préférences
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      operationId: updateUserSettings
      summary: Modifier ses préférences d'affichage (/settings, section Préférences)
      tags: [Users]
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserSettings'
      responses:
        '200':
          description: Préférences enregistrées
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSettings'
        '400':
          description: Thème ou langue invalide
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ============================================================================
  # ADMIN (issue #160)
  # ============================================================================
  /admin/stats:
    get:
      operationId: getAdminStats
      summary: Statistiques globales de la plateforme
      description: Compteurs globaux (utilisateurs, administrateurs, maisons, appareils, entretiens). Réservé aux administrateurs.
      tags: [Admin]
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Statistiques
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminStats'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Non administrateur

  /admin/users:
    get:
      operationId: listAdminUsers
      summary: Lister les utilisateurs
      description: Liste paginée de tous les comptes, avec recherche par email / prénom / nom. Réservé aux administrateurs.
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - name: search
          in: query
          required: false
          schema:
            type: string
          description: Filtre (sous-chaîne, insensible à la casse) sur l'email, le prénom ou le nom
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Page d'utilisateurs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUsersPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Non administrateur

  /admin/users/{id}/admin:
    put:
      operationId: setUserAdmin
      summary: Accorder ou retirer les droits administrateur
      description: |
        Promeut un utilisateur administrateur ou lui retire ce rôle.
        Un administrateur ne peut pas se retirer ses propres droits.
        Le changement prend effet à la prochaine connexion (ou au prochain renouvellement du JWT) de l'utilisateur concerné.
      tags: [Admin]
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetUserAdminRequest'
      responses:
        '200':
          description: Utilisateur mis à jour
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUser'
        '400':
          description: Un administrateur ne peut pas se retirer ses propres droits
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          description: Non administrateur
        '404':
          description: Utilisateur non trouvé

# ==============================================================================
# COMPONENTS
# ==============================================================================
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Token JWT obtenu via /auth/login ou /auth/register
    ApiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: Clé API générée depuis les paramètres utilisateur

  parameters:
    houseId:
      name: houseId
      in: path
      required: true
      description: ID de la maison (UUID)
      schema:
        type: string
        format: uuid

    deviceId:
      name: deviceId
      in: path
      required: true
      description: ID de l'appareil (UUID)
      schema:
        type: string
        format: uuid

    typeId:
      name: typeId
      in: path
      required: true
      description: ID du type d'entretien (UUID)
      schema:
        type: string
        format: uuid

    memberId:
      name: memberId
      in: path
      required: true
      description: ID de l'adhésion (HouseMember.id, UUID)
      schema:
        type: string
        format: uuid

    invitationId:
      name: invitationId
      in: path
      required: true
      description: ID de l'invitation (UUID)
      schema:
        type: string
        format: uuid

    invitationToken:
      name: token
      in: path
      required: true
      description: Token secret de l'invitation (64 caractères hexadécimaux)
      schema:
        type: string

  responses:
    Forbidden:
      description: La ressource existe mais l'appelant n'a pas le rôle requis (`forbidden`, R5)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Ressource inconnue, ou maison inexistante (`not_found`)
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ServiceUnavailable:
      description: Échec transitoire de la base de données après nouvelles tentatives — réessayer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: |
        Non authentifié (`unauthorized`) : access token absent, invalide ou expiré, ou compte
        de l'appelant supprimé entre-temps (son access token, sans état, reste valide jusqu'à
        15 min). Le client rafraîchit la session, ou la ferme si le rafraîchissement échoue.
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: |
        Limite de débit atteinte (`rate_limited`), header `Retry-After` (secondes, exposé en CORS)
        repris dans le corps (`retryAfter`). Transitoire : réessayer après ce délai. Limites par client (adresse IP, /64 en IPv6) : login + register
        5/min, refresh + logout + revoke 60/min, `/oauth/*` 60/min, `/connect/token` 30/min,
        `/connect/register` 5/min, tout endpoint 200/min. Actives dans les environnements Azure
        (production, previews) uniquement.
      headers:
        Retry-After:
          description: Délai en secondes avant de réessayer
          schema:
            type: integer
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    MessageResponse:
      type: object
      properties:
        message:
          type: string

    # ==========================================================================
    # ERROR
    # ==========================================================================
    ErrorResponse:
      type: object
      description: |
        Erreur au format ProblemDetails (RFC 9457, `application/problem+json`). Le frontend
        branche sur `status` et `code`, jamais sur le texte (`detail` est en anglais, non
        destiné à l'affichage). Les 400 de validation de modèle ajoutent `errors`. Toute
        erreur 400 / 401 / 403 / 404 / 429 porte un `code` (le code générique du statut à
        défaut d'un code spécifique), y compris celles produites par le framework (validation
        de modèle, 401 d'authentification, 404 de route, 429 du limiteur de débit).
      properties:
        type:
          type: string
          nullable: true
        title:
          type: string
          nullable: true
        status:
          type: integer
        detail:
          type: string
          nullable: true
          description: Message technique (anglais)
        code:
          type: string
          nullable: true
          description: |
            Code machine stable. Codes spécifiques, quand l'interface doit réagir :
            `invalid_credentials`, `account_restricted`, `invalid_refresh_token`, `email_taken`,
            `export_rate_limited`, `invitation_invalid`, `invitation_email_mismatch`,
            `invitation_already_pending`, `invitation_limit_reached`, `already_member`,
            `own_invitation`, `wrong_password`. Codes génériques par statut : 400
            `validation_failed`, 401 `unauthorized`, 403 `forbidden`, 404 `not_found`,
            429 `rate_limited`. Absent sur les 5xx.
        errors:
          type: object
          nullable: true
          additionalProperties:
            type: array
            items:
              type: string
          description: Erreurs de validation par champ (400 de validation uniquement)
        retryAfter:
          type: integer
          nullable: true
          description: 429 uniquement — délai en secondes avant de réessayer, copie du header `Retry-After`

    # ==========================================================================
    # AUTH
    # ==========================================================================
    RegisterRequest:
      type: object
      required: [firstName, lastName, email, password, consentAccepted]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
          example: "Jean"
        lastName:
          type: string
          minLength: 1
          maxLength: 100
          example: "Dupont"
        email:
          type: string
          format: email
          minLength: 1
          example: "jean.dupont@example.com"
        password:
          type: string
          minLength: 8
          pattern: "^(?=.*[a-z])(?=.*[A-Z])(?=.*\\d)(?=.*[^A-Za-z0-9]).{8,}$"
          description: Minimum 8 caractères, avec au moins une majuscule, une minuscule, un chiffre et un caractère spécial
          example: "MonMotDePasse123!"
        consentAccepted:
          type: boolean
          description: |
            RGPD — l'utilisateur accepte les Conditions générales d'utilisation (base légale :
            exécution du contrat, Art. 6(1)(b)) et reconnaît avoir pris connaissance de la
            politique de confidentialité (information, Art. 13). Ce n'est PAS un consentement
            au sens de l'Art. 7 (le traitement des données de compte repose sur le contrat).
            Doit être `true`, sinon l'inscription est refusée (400). La date et la version de
            la politique acceptée sont enregistrées à titre de preuve (accountability, Art. 5(2)).
          example: true
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          minLength: 1
        rememberMe:
          type: boolean
          default: false
          description: >-
            Session persistante : le cookie de refresh token est conservé 365 jours
            (renouvelés à chaque refresh). Sinon, cookie de session (24 h côté serveur),
            supprimé à la fermeture du navigateur.

    AuthResponse:
      type: object
      properties:
        accessToken:
          type: string
          description: JWT access token
        refreshToken:
          type: string
          description: Token pour rafraîchir l'access token
        expiresIn:
          type: integer
          description: Durée de validité en secondes
        user:
          $ref: '#/components/schemas/User'
        joinedHouseId:
          type: string
          format: uuid
          nullable: true
          description: Inscription avec `invitationToken` uniquement — maison rejointe (P03 → P09)

    User:
      type: object
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        theme:
          type: string
          enum: [light, dark, system]
          default: system
          description: Préférence de thème utilisateur
        language:
          type: string
          enum: [fr, en]
          default: fr
          description: Langue préférée de l'utilisateur
        consentRequired:
          type: boolean
          default: false
          description: |
            RGPD — `true` si l'utilisateur doit (ré)accepter la politique de
            confidentialité / CGU en vigueur (compte créé avant l'introduction du
            consentement, ou nouvelle version de la politique). Le frontend affiche
            alors une bannière de re-consentement (POST /users/me/consent).
        isAdmin:
          type: boolean
          default: false
          description: Administrateur de la plateforme (accès à l'interface d'administration)

    # ==========================================================================
    # HOUSES
    # ==========================================================================
    CreateHouseRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        address:
          type: string
          maxLength: 500
          nullable: true
        zipCode:
          type: string
          maxLength: 20
          nullable: true
        city:
          type: string
          maxLength: 200
          nullable: true
        colorKey:
          $ref: '#/components/schemas/HouseColorKey'

    UpdateHouseRequest:
      type: object
      description: |
        Mise à jour partielle : un champ omis ou null conserve sa valeur ; une chaîne vide (ou
        blanche) efface `address`, `zipCode` ou `city` (M1 : vider l'adresse) — la réponse et les
        lectures renvoient alors `null`, comme pour une maison créée sans adresse. `colorKey` omis
        conserve la couleur.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        address:
          type: string
          maxLength: 500
          nullable: true
        zipCode:
          type: string
          maxLength: 20
          nullable: true
        city:
          type: string
          maxLength: 200
          nullable: true
        colorKey:
          $ref: '#/components/schemas/HouseColorKey'

    HouseColorKey:
      type: string
      enum: [indigo, orange, green, sky, yellow, pink]
      description: |
        Couleur de la maison (bandeau des cartes C4, de P09 et de l'invitation P04), dans l'ordre de la
        palette « Couleurs de maison » de `specs/ux/README.md` :
        indigo `#6366f1`, orange `#ea580c`, green `#16a34a`, sky `#0284c7`, yellow `#ca8a04`, pink `#db2777`.
        Attribution à la création (rotation, par propriétaire) : la couleur la moins utilisée parmi les
        maisons dont l'utilisateur est propriétaire, à égalité la première dans l'ordre de la palette.
        Une première maison est donc `indigo`, la deuxième `orange`, etc. ; une couleur libérée par une
        suppression est réutilisée en premier. Modifiable ensuite par le propriétaire (`PUT /houses/{id}`).

    House:
      type: object
      required: [colorKey]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        address:
          type: string
          nullable: true
        zipCode:
          type: string
          nullable: true
        city:
          type: string
          nullable: true
        createdAt:
          type: string
          format: date-time
        colorKey:
          $ref: '#/components/schemas/HouseColorKey'

    MaintenanceStatus:
      type: string
      enum: [overdue, pending, up_to_date, none]
      description: |
        Statut R1 (dates évaluées à Europe/Paris) :
        - overdue : En retard (`nextDueDate < aujourd'hui`)
        - pending : À faire (`aujourd'hui ≤ nextDueDate ≤ aujourd'hui + 30 j`)
        - up_to_date : À jour (`nextDueDate > aujourd'hui + 30 j`)
        - none : aucun type d'entretien (maison / appareil uniquement)
        Le statut d'un appareil ou d'une maison est celui de son entretien le plus urgent.

    HouseRole:
      type: string
      enum: [Owner, CollaboratorRW, CollaboratorRO, Tenant]

    Capabilities:
      type: object
      description: |
        Droits de l'appelant sur la maison (règle R5). Une action non autorisée est masquée.
      required: [canLogMaintenance, canEditDevices, canDelete, canManageHouse, canManageMembers, canInviteTenants, canViewCosts]
      properties:
        canLogMaintenance:
          type: boolean
          description: « C'est fait », enregistrer / modifier un enregistrement (propriétaire, RW, locataire)
        canEditDevices:
          type: boolean
          description: Ajouter / modifier un appareil ou un type d'entretien (propriétaire, RW)
        canDelete:
          type: boolean
          description: Supprimer un appareil, un type ou un enregistrement (propriétaire, RW)
        canManageHouse:
          type: boolean
          description: Modifier / supprimer la maison (propriétaire)
        canManageMembers:
          type: boolean
          description: Gérer membres (rôles, retrait) et toutes les invitations (propriétaire)
        canInviteTenants:
          type: boolean
          description: Inviter un locataire ; voir, renvoyer et annuler les invitations de locataire (propriétaire, RW)
        canViewCosts:
          type: boolean
          description: Voir coûts et prestataires (tous sauf locataire sans ce droit)

    HouseSummary:
      description: Maison avec statut pour l'accueil et la liste des maisons (C4)
      allOf:
        - $ref: '#/components/schemas/House'
        - type: object
          properties:
            score:
              type: integer
              minimum: 0
              maximum: 100
              description: Obsolète (pas de pourcentage à l'écran, R3) — pourcentage d'entretiens à jour
            devicesCount:
              type: integer
              description: Nombre d'appareils
            pendingCount:
              type: integer
              description: Nombre d'entretiens à faire (hors retards)
            overdueCount:
              type: integer
              description: Nombre d'entretiens en retard
            upToDateCount:
              type: integer
              description: Nombre d'entretiens à jour (« {upToDateCount}/{maintenanceTypesCount} à jour »)
            maintenanceTypesCount:
              type: integer
              description: Nombre total de types d'entretien de la maison
            status:
              $ref: '#/components/schemas/MaintenanceStatus'
            userRole:
              type: string
              nullable: true
              description: Rôle de l'utilisateur dans cette maison (`HouseRole`)
            deviceTypes:
              type: array
              items:
                type: string
              description: |
                Type (`Device.type`, valeur du catalogue) de chaque appareil de la maison, un élément par
                appareil (doublons possibles), dans l'ordre de création des appareils. Pastilles d'appareils
                du bandeau des cartes C4 (P07, P08) ; la liste est complète (sa longueur vaut `devicesCount`),
                la troncature éventuelle (« +n ») est faite à l'affichage.
            membersCount:
              type: integer
              minimum: 1
              description: |
                Nombre de personnes ayant accès à la maison : le propriétaire plus les membres ayant accepté
                une invitation (les invitations en attente ne comptent pas). Badge « Partagée » des cartes C4
                quand > 1 — vrai aussi pour toute maison dont l'appelant n'est pas propriétaire.

    HousesListResponse:
      type: object
      properties:
        houses:
          type: array
          items:
            $ref: '#/components/schemas/HouseSummary'
        globalScore:
          type: integer
          minimum: 0
          maximum: 100
          description: Score global (moyenne de toutes les maisons)
        nextColorKey:
          $ref: '#/components/schemas/HouseColorKey'

    HouseDetail:
      description: Détail d'une maison avec ses appareils
      allOf:
        - $ref: '#/components/schemas/HouseSummary'
        - type: object
          properties:
            devices:
              type: array
              items:
                $ref: '#/components/schemas/DeviceSummary'
            capabilities:
              $ref: '#/components/schemas/Capabilities'

    # ==========================================================================
    # DEVICES
    # ==========================================================================
    CreateDeviceRequest:
      type: object
      required: [name, type]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        type:
          type: string
          minLength: 1
          description: Type d'appareil — valeur du catalogue frontend (`DeviceCatalog`, ex. « Chaudière Gaz ») ou « Autre »
        brand:
          type: string
          maxLength: 200
          nullable: true
        model:
          type: string
          maxLength: 200
          nullable: true
        installDate:
          type: string
          format: date
          nullable: true
          description: Jour calendaire, `yyyy-MM-dd` ou `yyyy-MM-ddT00:00:00Z` (voir Conventions)
        maintenanceType:
          allOf:
            - $ref: '#/components/schemas/CreateMaintenanceTypeRequest'
          nullable: true
          description: |
            Type d'entretien par défaut à créer avec l'appareil (catalogue M2/P06, ex.
            « Entretien annuel », 12 mois). Omis pour « Autre » : l'appareil est créé sans entretien.

    UpdateDeviceRequest:
      type: object
      description: |
        Remplacement (M2 en modification) : `brand`, `model` et `installDate` prennent la valeur
        envoyée — omis ou null les efface. `name` et `type` (obligatoires sur l'appareil) omis ou null
        sont conservés.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        type:
          type: string
        brand:
          type: string
          maxLength: 200
          nullable: true
        model:
          type: string
          maxLength: 200
          nullable: true
        installDate:
          type: string
          format: date
          nullable: true
          description: Jour calendaire, `yyyy-MM-dd` ou `yyyy-MM-ddT00:00:00Z` (voir Conventions)

    Device:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
        brand:
          type: string
          nullable: true
        model:
          type: string
          nullable: true
        installDate:
          type: string
          format: date-time
          nullable: true
          description: Jour calendaire, minuit UTC (`yyyy-MM-ddT00:00:00Z`, voir Conventions)
        houseId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    DeviceSummary:
      description: Appareil avec statut pour la liste (C4)
      allOf:
        - $ref: '#/components/schemas/Device'
        - type: object
          properties:
            score:
              type: integer
              minimum: 0
              maximum: 100
              description: Obsolète (pas de pourcentage à l'écran, R3) — pourcentage d'entretiens à jour
            status:
              $ref: '#/components/schemas/MaintenanceStatus'
            pendingCount:
              type: integer
              description: Nombre d'entretiens à faire (hors retards)
            overdueCount:
              type: integer
              description: Nombre d'entretiens en retard
            upToDateCount:
              type: integer
              description: Nombre d'entretiens à jour (« {upToDateCount}/{maintenanceTypesCount} à jour »)
            maintenanceTypesCount:
              type: integer
              description: Nombre de types d'entretien définis
            nextDueDate:
              type: string
              format: date-time
              nullable: true
              description: Jour calendaire, minuit UTC. Échéance de l'entretien le plus urgent (ligne C4 de P09, R4) ; null sans type d'entretien
            nextMaintenanceName:
              type: string
              nullable: true
              description: Nom de l'entretien le plus urgent (sous-titre C4 si en retard / à faire) ; null sans type d'entretien

    DeviceDetail:
      description: Détail d'un appareil avec ses types d'entretien
      allOf:
        - $ref: '#/components/schemas/DeviceSummary'
        - type: object
          properties:
            houseName:
              type: string
              description: Nom de la maison (fil d'Ariane)
            userRole:
              $ref: '#/components/schemas/HouseRole'
            capabilities:
              $ref: '#/components/schemas/Capabilities'
            maintenanceTypes:
              type: array
              items:
                $ref: '#/components/schemas/MaintenanceTypeWithStatus'
            totalSpent:
              type: number
              format: decimal
              description: Total dépensé en entretiens (0 si `capabilities.canViewCosts` est faux)
            maintenanceCount:
              type: integer
              description: Nombre total d'entretiens loggés

    # ==========================================================================
    # MAINTENANCE TYPES
    # ==========================================================================
    CreateMaintenanceTypeRequest:
      type: object
      required: [name, periodicity]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        periodicity:
          $ref: '#/components/schemas/Periodicity'
        customDays:
          type: integer
          minimum: 1
          maximum: 3650
          nullable: true
          description: Intervalle en jours (Custom, historique) — exclusif de `customMonths`
        customMonths:
          type: integer
          minimum: 1
          maximum: 120
          nullable: true
          description: Intervalle en mois (Custom, « Tous les n mois / ans », n ans = 12n)
        lastMaintenance:
          allOf:
            - $ref: '#/components/schemas/LastMaintenance'
          nullable: true
          description: Dernier entretien connu (R2). Omis = `Unknown`.

    LastMaintenance:
      type: object
      description: |
        Choix « Dernier entretien » à la création d'un appareil ou d'un type (R2) :
        - `Month` (+ `year`, `month`) : un enregistrement est créé au 1er du mois choisi, avec la
          note « Date approximative (mois) » ; l'échéance en découle. Mois futur refusé (400).
        - `Unknown` (« Je ne sais pas ») : aucun enregistrement, échéance = création + 30 jours.
        - `Older` (« Plus ancien ») : aucun enregistrement, échéance = date de création.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [Unknown, Older, Month]
        year:
          type: integer
          minimum: 1900
          nullable: true
        month:
          type: integer
          minimum: 1
          maximum: 12
          nullable: true

    UpdateMaintenanceTypeRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          nullable: true
        periodicity:
          allOf:
            - $ref: '#/components/schemas/Periodicity'
          nullable: true
        customDays:
          type: integer
          minimum: 1
          maximum: 3650
          nullable: true
        customMonths:
          type: integer
          minimum: 1
          maximum: 120
          nullable: true

    Periodicity:
      type: string
      enum: [Annual, Semestrial, Quarterly, Monthly, Biennial, Custom]
      description: |
        Calcul en mois calendaires depuis la date du dernier entretien :
        - Annual : 1 an ; Semestrial : 6 mois ; Quarterly : 3 mois ; Monthly : 1 mois ;
          Biennial : 2 ans
        - Custom : `customMonths` mois, ou `customDays` jours (historique)

    MaintenanceType:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        periodicity:
          $ref: '#/components/schemas/Periodicity'
        customDays:
          type: integer
          nullable: true
        customMonths:
          type: integer
          nullable: true
        deviceId:
          type: string
          format: uuid
        createdAt:
          type: string
          format: date-time

    MaintenanceTypeWithStatus:
      description: Type d'entretien avec son statut actuel
      allOf:
        - $ref: '#/components/schemas/MaintenanceType'
        - type: object
          properties:
            status:
              type: string
              enum: [up_to_date, pending, overdue]
            lastMaintenanceDate:
              type: string
              format: date-time
              nullable: true
              description: Date du dernier entretien (null sans historique). Jour calendaire, minuit UTC (`yyyy-MM-ddT00:00:00Z`, voir Conventions)
            nextDueDate:
              type: string
              format: date-time
              description: |
                Jour calendaire, minuit UTC (`yyyy-MM-ddT00:00:00Z`, voir Conventions). Prochaine échéance, jamais nulle (R2) : dernier entretien + périodicité ; sans
                historique, création + 30 jours (« Je ne sais pas ») ou date de création
                (« Plus ancien »).

    # ==========================================================================
    # MAINTENANCE INSTANCES
    # ==========================================================================
    LogMaintenanceRequest:
      type: object
      description: |
        Un appelant qui ne voit pas les coûts (locataire sans `canViewCosts`) n'a pas la main sur
        `cost` / `provider` : envoyés, ils sont ignorés (ni enregistrés ni renvoyés), comme en
        modification.
      required: [date]
      properties:
        date:
          type: string
          format: date
          description: Date de l'entretien effectué, pas dans le futur (Europe/Paris). Jour calendaire, `yyyy-MM-dd` ou `yyyy-MM-ddT00:00:00Z` (voir Conventions)
        cost:
          type: number
          format: decimal
          minimum: 0
          nullable: true
          description: Coût de l'entretien en euros
        provider:
          type: string
          maxLength: 200
          nullable: true
          description: Nom du prestataire
        notes:
          type: string
          maxLength: 2000
          nullable: true
          description: Notes et observations

    UpdateMaintenanceInstanceRequest:
      type: object
      description: |
        Remplacement (M3 en modification) : `cost`, `provider` et `notes` prennent la valeur envoyée —
        omis ou null les efface. `date` (obligatoire sur l'enregistrement) omise ou null est conservée.
        Un appelant qui ne voit pas les coûts (locataire sans `canViewCosts`) ne peut ni lire ni
        modifier `cost` / `provider` : ces deux champs sont alors ignorés et conservés.
      properties:
        date:
          type: string
          format: date
          nullable: true
          description: Pas dans le futur (Europe/Paris). Omise ou null = conservée. Jour calendaire, `yyyy-MM-dd` ou `yyyy-MM-ddT00:00:00Z` (voir Conventions)
        cost:
          type: number
          format: decimal
          minimum: 0
          nullable: true
        provider:
          type: string
          maxLength: 200
          nullable: true
        notes:
          type: string
          maxLength: 2000
          nullable: true

    MaintenanceInstance:
      type: object
      properties:
        id:
          type: string
          format: uuid
        date:
          type: string
          format: date-time
          description: Jour calendaire, minuit UTC (`yyyy-MM-ddT00:00:00Z`, voir Conventions)
        cost:
          type: number
          format: decimal
          nullable: true
        provider:
          type: string
          nullable: true
        notes:
          type: string
          nullable: true
        maintenanceTypeId:
          type: string
          format: uuid
        maintenanceTypeName:
          type: string
          description: Nom du type (pour affichage dans historique)
        createdAt:
          type: string
          format: date-time

    MaintenanceHistoryResponse:
      type: object
      properties:
        instances:
          type: array
          items:
            $ref: '#/components/schemas/MaintenanceInstance'
        totalSpent:
          type: number
          format: decimal
          description: Total des coûts
        count:
          type: integer
          description: Nombre total d'entretiens

    # ==========================================================================
    # UPCOMING TASKS
    # ==========================================================================
    UpcomingTask:
      type: object
      properties:
        maintenanceTypeId:
          type: string
          format: uuid
        maintenanceTypeName:
          type: string
        deviceId:
          type: string
          format: uuid
        deviceName:
          type: string
        deviceType:
          type: string
        houseId:
          type: string
          format: uuid
        houseName:
          type: string
        status:
          type: string
          enum: [pending, overdue, up_to_date]
          description: up_to_date seulement pour `Dashboard.nextTask`
        nextDueDate:
          type: string
          format: date-time
          description: Jamais nulle (R2). Jour calendaire, minuit UTC (`yyyy-MM-ddT00:00:00Z`, voir Conventions)
        lastMaintenanceDate:
          type: string
          format: date-time
          nullable: true
          description: Jour calendaire, minuit UTC (`yyyy-MM-ddT00:00:00Z`, voir Conventions)
        periodicity:
          $ref: '#/components/schemas/Periodicity'
        customDays:
          type: integer
          nullable: true
        customMonths:
          type: integer
          nullable: true
        canLogMaintenance:
          type: boolean
          description: L'appelant peut faire « C'est fait » sur cet entretien (R5)
        capabilities:
          $ref: '#/components/schemas/Capabilities'
          description: |
            Droits de l'appelant sur la maison de l'entretien (R5) — ex. `canViewCosts` pour afficher
            prestataire et coût dans M3 depuis P07.

    UpcomingTasksResponse:
      type: object
      properties:
        tasks:
          type: array
          items:
            $ref: '#/components/schemas/UpcomingTask'
        overdueCount:
          type: integer
          description: Nombre de tâches en retard
        pendingCount:
          type: integer
          description: Nombre de tâches à faire (hors retards)

    Dashboard:
      type: object
      description: Accueil (P07) — voir `GET /dashboard`
      properties:
        tasks:
          type: array
          description: Tous les entretiens à traiter (retard + 30 jours), échéance croissante
          items:
            $ref: '#/components/schemas/UpcomingTask'
        toHandleCount:
          type: integer
          description: À traiter = en retard + à faire (titre de l'accueil et badge de navigation)
        overdueCount:
          type: integer
        pendingCount:
          type: integer
        upToDateCount:
          type: integer
        totalCount:
          type: integer
          description: Nombre total de types d'entretien visibles
        nextTask:
          allOf:
            - $ref: '#/components/schemas/UpcomingTask'
          nullable: true
          description: Prochain entretien à jour (échéance la plus proche), null s'il n'y en a pas

    # ==========================================================================
    # MEMBERS & INVITATIONS
    # ==========================================================================
    HouseMember:
      type: object
      properties:
        id:
          type: string
          format: uuid
          description: ID de l'adhésion (pour /members/{memberId})
        userId:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
        role:
          $ref: '#/components/schemas/HouseRole'
        canLogMaintenance:
          type: boolean
          description: |
            Droit effectif (R5) : toujours vrai pour le propriétaire et un collaborateur RW,
            toujours faux pour un collaborateur RO ; pour un locataire, le réglage du propriétaire.
        canViewCosts:
          type: boolean
          description: |
            Droit effectif (R5) : toujours vrai pour le propriétaire et les collaborateurs ; pour un
            locataire, le réglage du propriétaire.
        createdAt:
          type: string
          format: date-time
          description: Date d'arrivée dans la maison

    UpdateMemberRoleRequest:
      type: object
      required: [role]
      properties:
        role:
          type: string
          description: CollaboratorRW, CollaboratorRO ou Tenant

    UpdateMemberPermissionsRequest:
      type: object
      properties:
        canLogMaintenance:
          type: boolean
          nullable: true
        canViewCosts:
          type: boolean
          nullable: true

    CreateInvitationRequest:
      type: object
      required: [email, role]
      properties:
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 255
          description: Enregistré sous sa forme canonique (sans espaces autour, en minuscules), comme l'email d'un compte
        role:
          type: string
          description: CollaboratorRW, CollaboratorRO ou Tenant

    Invitation:
      type: object
      properties:
        id:
          type: string
          format: uuid
        token:
          type: string
          description: Token du lien `/invitations/{token}` (à copier ; aucun email n'est envoyé)
        email:
          type: string
          nullable: true
          description: Email de la personne invitée (null pour les invitations antérieures)
        role:
          $ref: '#/components/schemas/HouseRole'
        status:
          type: string
          enum: [Pending, Accepted, Expired, Revoked, Declined]
        isExpired:
          type: boolean
          description: Délai de 7 jours dépassé (« Renvoyer » relance l'invitation)
        houseId:
          type: string
          format: uuid
        houseName:
          type: string
        createdByName:
          type: string
        expiresAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time

    InvitationInfo:
      type: object
      description: Vue publique d'une invitation (P04)
      properties:
        id:
          type: string
          format: uuid
        houseId:
          type: string
          format: uuid
        houseName:
          type: string
        houseColorKey:
          $ref: '#/components/schemas/HouseColorKey'
        houseDeviceTypes:
          type: array
          items:
            type: string
          description: |
            Types (`Device.type`) des appareils de la maison, un élément par appareil, dans l'ordre de
            création — pastilles du bandeau de P04. Renvoyé uniquement tant que l'invitation est utilisable ;
            liste vide sinon (minimisation, comme `email`). Aucun autre détail des appareils (nom, marque,
            modèle, entretiens) n'est exposé sur cet endpoint public.
        role:
          $ref: '#/components/schemas/HouseRole'
        invitedByName:
          type: string
          description: Prénom et nom de la personne qui invite
        email:
          type: string
          nullable: true
          description: |
            Email invité — verrouille le champ email de l'inscription (P03). Renvoyé uniquement
            tant que l'invitation est utilisable ; null sinon (et pour les invitations antérieures).
        status:
          type: string
          enum: [Pending, Accepted, Expired, Revoked, Declined]
        expiresAt:
          type: string
          format: date-time
        isExpired:
          type: boolean
          description: true si l'invitation n'est plus utilisable (expirée, acceptée, refusée ou annulée) — état C de P04
        isAlreadyMember:
          type: boolean
          nullable: true
          description: Appel authentifié uniquement — l'appelant est déjà membre (P04 → P09). null sans JWT.

    HouseCollaborators:
      type: object
      properties:
        houseId:
          type: string
          format: uuid
        houseName:
          type: string
        members:
          type: array
          items:
            $ref: '#/components/schemas/HouseMember'
        pendingInvitations:
          type: array
          items:
            $ref: '#/components/schemas/Invitation'

    AllCollaboratorsResponse:
      type: object
      properties:
        houses:
          type: array
          items:
            $ref: '#/components/schemas/HouseCollaborators'

    AcceptInvitationResponse:
      type: object
      properties:
        houseId:
          type: string
          format: uuid
        houseName:
          type: string
        role:
          $ref: '#/components/schemas/HouseRole'

    # ==========================================================================
    # API Keys (US-300 (#188), US-301 (#189), US-302 (#190))
    # ==========================================================================
    CreateApiKeyRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
          maxLength: 100
          description: Nom descriptif de la clé (ex. "Home Assistant")
        scope:
          type: string
          enum: [ReadOnly, ReadWrite]
          default: ReadWrite
          description: Niveau d'accès de la clé

    CreateApiKeyResponse:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        key:
          type: string
          description: Clé API complète (affichée une seule fois)
        prefix:
          type: string
          description: Préfixe de la clé pour identification (ex. "hf_Ab3xK9mQ")
        scope:
          type: string
          enum: [ReadOnly, ReadWrite]
        createdAt:
          type: string
          format: date-time

    ApiKeyDto:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        prefix:
          type: string
        scope:
          type: string
          enum: [ReadOnly, ReadWrite]
        createdAt:
          type: string
          format: date-time
        lastUsedAt:
          type: string
          format: date-time
          nullable: true

    # ==========================================================================
    # OAUTH
    # ==========================================================================
    OAuthScope:
      type: string
      enum: ['houses:read', 'houses:write']
      description: |
        Scope accordable à une application : `houses:read` (lire maisons, appareils et
        entretiens), `houses:write` (les ajouter et les modifier). `offline_access` (refresh
        token) est ajouté par le serveur et n'apparaît jamais ici.

    OAuthClientInfo:
      type: object
      required: [clientId, clientName, redirectHosts, scopes]
      properties:
        clientId:
          type: string
          description: Identifiant OAuth du client (`client_id`)
        clientName:
          type: string
          description: Nom déclaré par le client à l'enregistrement (non vérifié)
        clientUri:
          type: string
          nullable: true
          description: Page d'accueil déclarée par le client (https, non vérifiée)
        redirectHosts:
          type: array
          description: |
            Hôtes des redirect URIs enregistrées — là où l'utilisateur sera renvoyé : forme ASCII
            (punycode pour un nom internationalisé), suivie du port s'il n'est pas celui par défaut
            du schéma (`claude.ai`, `127.0.0.1:9`, `[::1]:8080`)
          items:
            type: string
        scopes:
          type: array
          description: Scopes que ce client a le droit de demander
          items:
            $ref: '#/components/schemas/OAuthScope'

    OAuthAuthorization:
      type: object
      required: [id, clientId, clientName, redirectHosts, scopes, createdAt]
      properties:
        id:
          type: string
          description: Identifiant du consentement
        clientId:
          type: string
        clientName:
          type: string
        redirectHosts:
          type: array
          description: Hôtes des redirect URIs du client, au format de `OAuthClientInfo.redirectHosts`
          items:
            type: string
        scopes:
          type: array
          description: Scopes accordés
          items:
            $ref: '#/components/schemas/OAuthScope'
        createdAt:
          type: string
          format: date-time

    GrantOAuthAuthorizationRequest:
      type: object
      required: [clientId, scopes]
      properties:
        clientId:
          type: string
        scopes:
          type: array
          minItems: 1
          description: Scopes cochés par l'utilisateur (sous-ensemble de `OAuthClientInfo.scopes`)
          items:
            $ref: '#/components/schemas/OAuthScope'

    # ==========================================================================
    # USER ACCOUNT & RGPD
    # ==========================================================================
    UserProfile:
      type: object
      required: [id, firstName, lastName, email, theme, language, createdAt, consentRequired]
      properties:
        id:
          type: string
          format: uuid
        firstName:
          type: string
        lastName:
          type: string
        email:
          type: string
          format: email
        theme:
          type: string
          enum: [light, dark, system]
        language:
          type: string
          enum: [fr, en]
        createdAt:
          type: string
          format: date-time
        consentGivenAt:
          type: string
          format: date-time
          nullable: true
          description: Date d'acceptation de la politique de confidentialité / CGU (null pour les comptes antérieurs)
        consentPolicyVersion:
          type: string
          nullable: true
          description: Version de la politique acceptée (format date ISO, ex. "2026-09-11")
        consentRequired:
          type: boolean
          description: true si l'utilisateur doit (ré)accepter la politique en vigueur

    UpdateProfileRequest:
      type: object
      required: [firstName, lastName, email]
      properties:
        firstName:
          type: string
          minLength: 1
          maxLength: 100
        lastName:
          type: string
          minLength: 1
          maxLength: 100
        email:
          type: string
          format: email
          minLength: 1
          maxLength: 255
          description: Enregistré sous sa forme canonique (sans espaces autour, en minuscules) ; l'unicité ignore la casse

    DeleteAccountRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          minLength: 1
          description: Mot de passe actuel, ressaisi pour confirmer la suppression

    ConsentStatus:
      type: object
      description: |
        Statut d'acceptation des CGU / de la politique de confidentialité pour l'utilisateur
        courant. Sert à piloter la bannière de ré-acceptation du frontend.
      required: [consentRequired, currentPolicyVersion]
      properties:
        consentGivenAt:
          type: string
          format: date-time
          nullable: true
          description: Date (UTC) de la dernière acceptation, null si jamais acceptée
        consentPolicyVersion:
          type: string
          nullable: true
          description: Version acceptée lors de cette acceptation
        consentRequired:
          type: boolean
          description: True si l'utilisateur doit (ré)accepter la version en vigueur
        currentPolicyVersion:
          type: string
          description: Version en vigueur des CGU / de la politique de confidentialité
          example: "2026-09-11"

    ConsentRequest:
      type: object
      required: [accepted, policyVersion]
      properties:
        accepted:
          type: boolean
          description: Doit être true
        policyVersion:
          type: string
          minLength: 1
          description: Version de la politique acceptée (doit correspondre à la version en vigueur)

    UserDataExport:
      type: object
      description: |
        Copie complète des données personnelles de l'utilisateur (Art. 15 + 20).
        Structure stable, destinée à être lisible par machine et importable ailleurs.
      properties:
        exportedAt:
          type: string
          format: date-time
        formatVersion:
          type: string
          example: "1.0"
        profile:
          type: object
          description: id, email, firstName, lastName, createdAt, updatedAt
        preferences:
          type: object
          description: theme, language
        consent:
          type: object
          description: consentGivenAt, consentPolicyVersion
        houses:
          type: array
          description: Maisons possédées, avec devices → maintenanceTypes → maintenanceInstances imbriqués
          items:
            type: object
        memberships:
          type: array
          description: Maisons partagées avec l'utilisateur (houseName, role, canLogMaintenance, canViewCosts, since)
          items:
            type: object
        invitationsSent:
          type: array
          items:
            type: object
        invitationsReceived:
          type: array
          items:
            type: object
        apiKeys:
          type: array
          description: name, prefix, scope, createdAt, lastUsedAt, revokedAt (jamais le hash)
          items:
            type: object
        sessions:
          type: array
          description: Refresh tokens — createdAt, expiresAt, createdByIp, revokedAt, revokedByIp, reasonRevoked (jamais la valeur du token)
          items:
            type: object
        auditLogs:
          type: array
          description: Actions effectuées par l'utilisateur — timestamp, action, entityType, entityId, changedProperties, ipAddress, userAgent
          items:
            type: object
        information:
          type: object
          description: |
            Volet « métadonnées » de l'export (Art. 15(1)(a) à (h) et 15(2)), sans lequel
            un export n'est qu'un extrait de base de données : controller, contactEmail,
            policyVersion, purposes, dataCategories, legalBases, recipients, retention,
            rights, supervisoryAuthorities, dataSource, internationalTransfers,
            automatedDecisionMaking et portabilityScope (sections relevant de l'Art. 20).
            Les textes sont fournis en anglais et en français (`{ en, fr }`).

    # ==========================================================================
    # ADMIN
    # ==========================================================================
    UserSettings:
      type: object
      required: [theme, language]
      properties:
        theme:
          type: string
          enum: [light, dark, system]
        language:
          type: string
          enum: [fr, en]

    AdminStats:
      type: object
      properties:
        users:
          type: integer
          description: Nombre total de comptes
        admins:
          type: integer
          description: Nombre d'administrateurs
        houses:
          type: integer
        devices:
          type: integer
        maintenanceInstances:
          type: integer
          description: Nombre d'entretiens loggés

    AdminUser:
      type: object
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
          format: email
        firstName:
          type: string
        lastName:
          type: string
        isAdmin:
          type: boolean
        createdAt:
          type: string
          format: date-time
        housesCount:
          type: integer
          description: Nombre de maisons dont l'utilisateur est propriétaire

    AdminUsersPage:
      type: object
      properties:
        users:
          type: array
          items:
            $ref: '#/components/schemas/AdminUser'
        total:
          type: integer
          description: Nombre total d'utilisateurs correspondant au filtre
        page:
          type: integer
        pageSize:
          type: integer

    SetUserAdminRequest:
      type: object
      required:
        - isAdmin
      properties:
        isAdmin:
          type: boolean
          description: true pour accorder les droits administrateur, false pour les retirer
